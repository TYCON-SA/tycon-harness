## Workflow

1. **Filtrar archivos relevantes**:
   - Tomar `modified_files` y quedarse con `.cs` + `.csproj`.
   - Para cada `.cs`, leer y clasificar:
     - Tiene `new HttpClient(` (excluir tests, fakes) → aplicar HTTP-C1.
     - Tiene `IHttpClientFactory` o `AddHttpClient(` o `AddResilienceHandler(` → aplicar HTTP-C2/C3/W1/W2/W3/W4/W5.
     - Tiene `httpClient.GetAsync/PostAsync/SendAsync` o `await client.SendAsync` con un `CancellationToken` disponible en el scope → aplicar HTTP-C5.
     - Tiene `EnsureSuccessStatusCode` → aplicar HTTP-C6.
     - Tiene `ShouldHandle =` / `ShouldRetry` / delegate dentro de `AddStandardResilienceHandler(`/`AddResilienceHandler(` **y** el proyecto implementa `IBackendPlugin` (plugin Bizuit: `plugin.json` en la raíz o `Bizuit.Backend.Abstractions` en el `.csproj`) → aplicar HTTP-C7.
     - Tiene `OnRetry`/`OnFailure`/`catch HttpRequestException`/`catch (Exception ... )` con `_logger.Log...` → aplicar HTTP-C4.

2. **HTTP-C1 — `new HttpClient()`**:
   - Buscar `new HttpClient(` en `.cs` no-test.
   - Excepciones aceptables: `Program.cs`/`Startup.cs` para test/setup explícito, fakes en tests.
   - Si aparece en `Features/`, `Services/`, `Workers/` → finding C1.

3. **HTTP-C2 — retry sin timeout budget**:
   - Buscar `AddRetry(` o `RetryStrategyOptions` con `MaxRetryAttempts ≥ 2`.
   - En la misma pipeline (mismo `AddResilienceHandler` block o mismo `ResiliencePipelineBuilder` chain), buscar `AddTimeout(` con TotalTimeout, o `HttpClient.Timeout = ` setting.
   - Si retry existe sin timeout total → finding C2.

4. **HTTP-C3 — timeout per-attempt ≥ total**:
   - Si la pipeline tiene tanto `AttemptTimeoutStrategy` como `TotalTimeoutStrategy` (o equivalente), comparar valores.
   - Si attempt timeout ≥ total / (retries + 1) → finding C3.
   - Heurística: si attempt = total exacto, definitely C3.

5. **HTTP-C4 — secrets en logs**:
   - Buscar dentro de `OnRetry`, `catch (HttpRequestException ...)`, `catch (Exception ...)` cuando el contexto tiene `HttpRequestMessage`/`HttpResponseMessage`:
     - Patrones rojos: `request.ToString()`, `request.Headers.ToString()`, `LogXxx(... request ...)`, `LogXxx(..., ex)` cuando ex puede ser HttpRequestException con request adjunto.
   - También: literales en log con `?token=`, `?apikey=`, `?secret=`, o URL completa interpolada `$\"...{url}...\"` para clients de proveedores conocidos (algunos autentican por query string).
   - Si match → finding C4.

6. **HTTP-C5 — CancellationToken no propagado**:
   - Buscar métodos async que tienen `CancellationToken` como parámetro.
   - Dentro del cuerpo, buscar llamadas a `httpClient.GetAsync(...)`, `PostAsync(...)`, `SendAsync(...)`, `PutAsync(...)`, `DeleteAsync(...)`, `PatchAsync(...)`.
   - Si la llamada NO incluye el token disponible → finding C5.
   - Excepción: si el método tiene una sobrecarga sin token y es por diseño (raro), revisar; default = finding.

7. **HTTP-C6 — EnsureSuccessStatusCode sin diagnóstico**:
   - Buscar `EnsureSuccessStatusCode()`.
   - En las 10 líneas previas, buscar `Content.ReadAsStringAsync(`, `_logger.Log...`, o handler de error que capture el body.
   - Si no aparece → finding C6.

7bis. **HTTP-C7 — API estática de Http.Resilience en un predicado (plugin Bizuit)**:
   - Sólo aplica si el proyecto es un plugin Bizuit (implementa `IBackendPlugin`). En un servicio que ES el host o una API propia, la librería que compila es la que corre → no aplica.
   - Dentro de cada delegate de `ShouldHandle`/`ShouldRetry`/`OnRetry` configurado en un `AddStandardResilienceHandler(`/`AddResilienceHandler(`, buscar: `.GetRequestMessage(`, `HttpClientResiliencePredicates.`, `HttpResilienceContextExtensions.`, `ResilienceContextExtensions.` o cualquier `using static Microsoft.Extensions.Http.Resilience...`.
   - Si match → finding C7 (CRITICAL). Los comentarios no cuentan.
   - NO es finding: leer por `Properties.TryGetValue(<ResiliencePropertyKey>)`, delegar al predicado default capturado (`var d = options.Retry.ShouldHandle;` … `await d(args)`), o mirar `args.Outcome.Result?.RequestMessage` / `args.Outcome.Exception` (Polly.Core puro).

8. **HTTP-W1 — retry sin jitter**:
   - Buscar `RetryStrategyOptions` blocks.
   - Si tiene `BackoffType = DelayBackoffType.Exponential` o `Constant` sin `UseJitter = true` → finding W1.
   - También: Polly v7 syntax `WaitAndRetryAsync` con `attempt => TimeSpan.From*(attempt * X)` (sin componente aleatorio) → finding W1.

9. **HTTP-W2 — falta circuit breaker**:
   - Si la pipeline tiene `AddRetry` pero NO tiene `AddCircuitBreaker` → finding W2.
   - Excepción: si usa `AddStandardResilienceHandler` (ya incluye breaker) → no aplica W2.

10. **HTTP-W3 — HttpClient sin nombre/typed**:
    - Buscar `services.AddHttpClient()` literal sin nombre y sin generic.
    - Si match → finding W3.

11. **HTTP-W4 — timeout en HttpClient + en pipeline**:
    - Si hay `AddResilienceHandler`/`AddStandardResilienceHandler` Y también `client.Timeout = ` en el mismo registro → finding W4.

12. **HTTP-W5 — retry sobre POST con efectos**:
    - Si el client está registrado con retry y el typed client tiene métodos `PostAsync(...)` que el code llama (heurística: typed client con métodos `Post*`/`Send*`/`Create*`/`Charge*`/`Pay*`) → finding W5 informativo (revisión humana).
    - No es bloqueante; emitir warning con sugerencia de filtrar retry por status code.

13. **Agrupar findings por severity** y emitir el reporte.

## Regla de citación

**Si emitís un finding sin rule ID, el advisor tiene un bug.** El dev debe poder siempre:

1. Ver el rule ID en el reporte (ej: `HTTP-C1`).
2. Buscar ese ID en este mismo archivo (sección \"Catálogo de reglas\").
3. Buscar el ID también en `~/.claude/tycon-harness/guides/advisor-rules-catalog.md` para ver el contexto compartido del equipo.
4. Entender exactamente qué regla se aplicó.

Si el pattern detectado no matchea ninguna regla del catálogo, **no emitir finding** — el advisor solo reporta reglas conocidas. Reglas nuevas se agregan acá primero.

## Anti-patterns (lo que NO hace)

- NO valida lógica de negocio del request (qué se manda, headers de dominio, etc.).
- NO valida performance (latencia, throughput) — solo configuración de resiliencia estática.
- NO ejecuta el cliente HTTP — análisis estático sobre el código.
- NO valida APIs JS/TS (`fetch`, `axios`) — scope exclusivo .NET.
- NO bloquea el commit local — el pipeline bloquea solo el merge.
- NO emite findings sin rule ID.
- NO se invoca si el diff no toca código HTTP cliente (ver \"Cuándo se invoca\").

## Calibración inicial

Calibrado contra los siguientes signals típicos del stack TYCON:

- **Backend de un plugin** (`src/<Plugin>/<Plugin>.cs`): registra varios HttpClients con `AddHttpClient` (autenticación, mensajería, telefonía). Si la resiliencia no está formalizada, es esperable que la primera corrida levante varias HTTP-C2/W1/W2.
- **Workers** (`Workers/OrderSyncWorker.cs`, servicios de tiempo real): Background services que reciben `CancellationToken stoppingToken` y deberían propagarlo a cada llamada HTTP — primer surface candidate de HTTP-C5.
- **Plugins de mensajería** (cuando aplique): clients para proveedores de mensajería. Esperable que algunos retry handlers no tengan circuit breaker (HTTP-W2).

Si el subagent reporta CRITICAL contra un client correcto sin que haya un cambio que lo justifique, hay un falso positivo en la regla — actualizar el catálogo.
"""
