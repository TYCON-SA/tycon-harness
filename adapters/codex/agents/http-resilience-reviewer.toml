# http-resilience-reviewer

**Phase**: during/post
**Severity**: CRITICAL para reglas que producen breakage real en producción (retry storms, timeouts cruzados, secret leaks). WARNING para gaps operativos (jitter, observability hooks, naming).
**Tier**: Core condicional — solo se invoca si el diff toca código HTTP cliente .NET. No corre por default sobre cualquier diff dotnet.

## Cuándo se invoca

El orquestador del `tycon-pipeline` lo agrega al set paralelo de advisors **solo si** alguna de estas condiciones se cumple sobre los `modified_files`:

1. Algún `.cs` modificado declara o usa `HttpClient` (instancia, parámetro, campo, propiedad).
2. Algún `.cs` modificado contiene `IHttpClientFactory` o `AddHttpClient(`.
3. Algún `.cs` modificado contiene `AddResilienceHandler(`, `AddStandardResilienceHandler(`, `ResiliencePipeline`, `ResiliencePipelineBuilder`, o `using Polly`.
4. Algún `.csproj` modificado agrega/quita `Microsoft.Extensions.Http.Resilience` o `Polly`.

Si ninguna se cumple, **NO** se invoca. La idea es que un cambio puramente CRUD/SQL no dispare análisis de resiliencia HTTP irrelevante.

## Catálogo de reglas

**Cada finding DEBE citar el rule ID**. Formato del finding:

```
[<RULE-ID>] `<file>:<line>` <descripción corta>. Fix: <acción concreta>.
```

### CRITICAL — breakage real en producción

| ID | Regla | Patrón detectado |
|---|---|---|
| **HTTP-C1** | `HttpClient` instanciado con `new HttpClient()` en lugar de `IHttpClientFactory` | `new HttpClient(` aparece en código de feature/service/worker (excluyendo `Program.cs` / startup explícitamente o factories internos). Causa socket exhaustion bajo carga. Fix: inyectar `IHttpClientFactory` y resolver con `factory.CreateClient(name)`, o registrar typed client con `services.AddHttpClient<TClient>()`. |
| **HTTP-C2** | Retry policy sin timeout total acotado (retry storm) | Pipeline o handler con `AddRetry`/`RetryStrategy` (configurando `MaxRetryAttempts` ≥ 2) **sin** un `AddTimeout`/`TimeoutStrategy` en la misma pipeline que acote el budget total, o sin `Timeout` en el `HttpClient` resuelto. Si el endpoint upstream se cuelga, el retry se ejecuta N veces consumiendo threads. Fix: agregar timeout total > timeout per-attempt, o usar `AddStandardResilienceHandler` que ya combina ambos. |
| **HTTP-C3** | Timeout per-attempt ≥ timeout total (configuración inconsistente) | `AttemptTimeout` (o `Timeout` per-handler) **mayor o igual** a `TotalTimeout`/`HttpClient.Timeout`. El timeout per-attempt nunca dispara — efectivamente no hay timeout granular. Fix: `AttemptTimeout < TotalTimeout / (MaxRetryAttempts + 1)` con margen. |
| **HTTP-C4** | Secrets logueados en handler de retry o excepción | `OnRetry` callback, `ILogger` calls dentro de catch HTTP, o `Exception.ToString()` que loggea el `HttpRequestMessage` completo (que incluye `Headers.Authorization`, `Headers.X-Api-Key`, `Headers.Cookie`). También: log que incluye URL completa con query string si la URL es de un proveedor que pasa tokens en query (algunas APIs de telefonía y APIs legacy). Fix: en logs, redactar headers sensibles y query params (`Authorization`, `X-Api-Key`, `Cookie`, `apikey=`, `token=`, `secret=`). |
| **HTTP-C5** | `CancellationToken` no propagado a `HttpClient.SendAsync`/`GetAsync`/`PostAsync` | Método async que recibe `CancellationToken ct` (típico Worker/BackgroundService o handler), llama a `httpClient.GetAsync(url)` / `PostAsync(url, content)` / `SendAsync(req)` **sin** pasar `ct`. La cancelación queda colgada — request sigue corriendo después de `StopAsync`. Fix: pasar el token (`GetAsync(url, ct)`, `PostAsync(url, content, ct)`, `SendAsync(req, ct)`). |
| **HTTP-C6** | `EnsureSuccessStatusCode` antes de leer body en error → pierde diagnóstico | Llamada a `response.EnsureSuccessStatusCode()` sin haber leído ni loggeado `await response.Content.ReadAsStringAsync(ct)` antes en caso 4xx/5xx. La excepción HTTP no incluye el body, perdiendo el detalle del error del proveedor (los proveedores suelen devolver mensajes accionables ahí). Fix: para no-2xx, leer body, loggear (sin secrets), y luego throw con contexto. |
| **HTTP-C7** | API estática de `Microsoft.Extensions.Http.Resilience` dentro de un predicado de resiliencia de un **plugin Bizuit** (skew de DLL con el host) | En un proyecto que implementa `IBackendPlugin`, dentro de `Retry.ShouldHandle` / `CircuitBreaker.ShouldHandle` / cualquier delegate configurado en `AddStandardResilienceHandler`/`AddResilienceHandler`, una llamada a `args.Context.GetRequestMessage()`, `HttpClientResiliencePredicates.IsTransient(...)`, `HttpClientResiliencePredicates.IsHttpConnectionTimeout(...)` o cualquier otro método estático/extensión de `Microsoft.Extensions.Http.Resilience`. El host de Bizuit carga SU versión de esa librería y gana sobre la del ZIP del plugin: si la firma compilada no existe en la del host → `MissingMethodException` en **cada** llamada del cliente (el predicado corre también en los éxitos) → 500 en toda la feature. Compila y da verde en local y CI: sólo rompe dentro del host. Fix: leer el request por la clave cruda `new ResiliencePropertyKey<HttpRequestMessage>(\"Resilience.Http.RequestMessage\")` con `args.Context.Properties.TryGetValue(...)`, y el criterio de transitorio delegarlo al predicado DEFAULT capturado antes de reemplazarlo (`var esTransitorio = options.Retry.ShouldHandle; options.Retry.ShouldHandle = async a => <filtro> && await esTransitorio(a);`), fail-closed si el método no se puede determinar. Sacar UNA sola llamada no alcanza: el predicado explota en la siguiente API estática — se sacan todas. |

### WARNING — gaps operativos

| ID | Regla | Patrón detectado |
|---|---|---|
| **HTTP-W1** | Retry sin jitter (backoff determinístico) | `RetryStrategyOptions` con `BackoffType.Exponential` o `Constant` y `UseJitter = false` (default es `false` en algunas versiones), o pipeline custom de Polly v7 con `WaitAndRetryAsync(n, attempt => TimeSpan.FromSeconds(...))` sin componente aleatorio. Causa thundering herd cuando varios pods reintentar al unísono tras una caída. Fix: `UseJitter = true` o `Polly.Contrib.WaitAndRetry.DecorrelatedJitter`. |
| **HTTP-W2** | Falta circuit breaker para endpoint externo | Pipeline con `AddRetry` pero sin `AddCircuitBreaker` para clientes que llaman APIs externas (proveedor SaaS — mensajería, telefonía, autenticación, etc.). Sin breaker, durante una caída sostenida el servicio sigue gastando threads en retries inútiles. Fix: agregar `AddCircuitBreaker` con `FailureRatio` razonable (0.5) + `MinimumThroughput` (10) o usar `AddStandardResilienceHandler`. |
| **HTTP-W3** | `HttpClient` registrado sin nombre / typed client | `services.AddHttpClient()` sin parámetro de nombre y sin tipo (`AddHttpClient<TService>()`). Resolver via `factory.CreateClient()` (default) sin diferenciar entre clientes pierde la posibilidad de configurar `BaseAddress`/`DefaultHeaders`/policies por proveedor. Fix: registrar named client (`AddHttpClient(\"twilio\", c => ...)`) o typed client (`AddHttpClient<ITwilioClient, TwilioClient>()`). |
| **HTTP-W4** | `HttpClient.Timeout` global mezclado con `HttpClient.Timeout = Timeout.InfiniteTimeSpan` cuando hay resilience handler | Si hay `AddResilienceHandler`/`AddStandardResilienceHandler`, el timeout debería estar en la pipeline (no en `HttpClient.Timeout`). Mezclar ambos genera comportamiento confuso (cuál gana). Fix: setear `HttpClient.Timeout = Timeout.InfiniteTimeSpan` cuando la pipeline ya maneja timeouts, o no usar pipeline timeout y dejar `HttpClient.Timeout`. Una sola fuente de verdad. |
| **HTTP-W5** | Retry aplicado a métodos no-idempotentes (POST con efectos) | Pipeline retry registrada para un client/endpoint sin filtro de método o status code, **y** el client se usa para `POST` con efectos (crear pago, enviar mensaje, llamar API que cobra por uso). Reintentar puede duplicar la operación. Fix: filtrar retry por status (`ShouldRetry` solo para 5xx + 408 + 429), o desactivar retry en clients que hacen POST con side effects, o usar idempotency key en el header (revisión humana). |

