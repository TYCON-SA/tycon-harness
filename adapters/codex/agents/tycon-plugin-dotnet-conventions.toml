# tycon-plugin-dotnet-conventions

**Phase**: during/post
**Severity**: WARNING (default) / CRITICAL (SQL concat, ClaimsPrincipal, hardcoded connection)
**Tier**: Core (.NET only — skipea automático en repos frontend)

## Catálogo de reglas

**Cada finding DEBE citar el rule ID**. Formato:
```
[<RULE-ID>] `<file>:<line>` <descripción>. Fix: <acción>.
```

Las reglas viven canónicamente en `guides/bizuit/bizuit-plugin-dotnet.md` del arnés. Este advisor las **lee en runtime** — si la guía cambia, el advisor se adapta. Los IDs acá abajo son estables aunque la prosa de la guía evolucione.

### CRITICAL

| ID | Regla | Patrón detectado |
|---|---|---|
| **DOTNET-C1** | SQL injection via raw concat | String interpolation o concat con input de usuario en SQL: `$\"SELECT ... WHERE x = {input}\"`, `\"... \" + userInput + \" ...\"` en string ejecutado por `SqlCommand.ExecuteReader` o equivalente. Fix: `SafeQueryBuilder.Query/Insert/Update/Delete`. |
| **DOTNET-C2** | ClaimsPrincipal usado para user context | `HttpContext.User.FindFirst(...)`, inyección de `ClaimsPrincipal`, acceso a claims para obtener user identity. En Bizuit el user context va por `BizuitUserContext` + `UserIdResolver` via `HttpContext.Items`. Fix: inyectar `IUserIdResolver` y usar `GetRequiredUserIdAsync()`. |
| **DOTNET-C3** | Connection string hardcoded | String literal completo con `Server=...;Database=...;User Id=...` en código. Fix: `IConnectionFactory` + configuración via `IOptions<T>`. |
| **DOTNET-C4** | `IConfiguration` inyectado en ctor de plugin service O resuelto via `sp.GetRequiredService<IConfiguration>()` dentro de factory delegate | Dos antipatrones equivalentes, mismo síntoma en runtime: (a) **ctor injection**: CUALQUIER ctor con param `IConfiguration` en un servicio registrado por el plugin (`services.AddScoped/Singleton/Transient<Service>()` sin factory). NO solo `config[\"Key\"]` ad-hoc — también `_config.GetValue<T>(...)`, `_config.GetSection(...)`, `_config.Bind(...)`. (b) **factory delegate**: `services.AddXxx<T>(sp => { var cfg = sp.GetRequiredService<IConfiguration>(); ... })` o variante con `sp.GetService<IConfiguration>()`. **Runtime failure** en el plugin loader del host (el sitio `*BIZUITExtensionsAPI` de cada producto), que NO registra `IConfiguration` en el scope DI de plugins — dispara `InvalidOperationException: Unable to resolve service for type '...IConfiguration' while attempting to activate '{Service}'` (ctor path) o `InvalidOperationException: No service for type '...IConfiguration' has been registered.` (factory path) → HTTP 500 con body vacío al primer request. **Local DevHost funciona, IIS prod no**. El patrón se dispara lazily en Singleton con factory — puede quedar latente meses si ningún request ejerce el path. Fix preferido: `IOptions<MyConfig>` + POCO + `services.Configure<MyConfig>(configuration.GetSection(\"Section\"))`. Fix legacy aceptable para factories: **closure sobre el param `configuration` del método `ConfigureServices(IServiceCollection services, IConfiguration configuration)`** — patrón usado por `PluginLogger` registration. Nunca `sp.GetRequiredService<IConfiguration>()` ni similar. |
| **DOTNET-C5** | Plugin service depende de DI del host no expuesto al plugin scope | Ctor de servicio registrado por el plugin pide un tipo **no whitelisted** por el plugin loader. Whitelist conocida (segura): `IOptions<T>`, `IOptionsSnapshot<T>`, `IOptionsMonitor<T>`, repos registrados por el mismo plugin, `HttpClient` via named factory (`IHttpClientFactory`), `PluginLogger`, servicios del mismo plugin, entidades `Microsoft.Extensions.Caching.*`, `TimeProvider`. Blacklist (explota al runtime en plugin scope): `IConfiguration` (ver C4), `ILogger<T>` de `Microsoft.Extensions.Logging` (usar `PluginLogger`), `IHostApplicationLifetime`, `IWebHostEnvironment`, `IHttpContextAccessor` (depende del plugin host — verificar), `IServer`, `IApplicationBuilder`. Fix: adaptar al patrón soportado. Si se necesita un tipo no whitelisted, coordinar con el equipo del plugin loader para exponerlo. |
| **DOTNET-C6** | Setting key usada en código pero faltante en `plugin.json.example` → `defaultSettings` | Cualquier match `configuration[\"X:Y\"]` o `Configuration[\"X:Y\"]` (también `_configuration[\"...\"]`) cuyo key (`\"X:Y\"`) NO esté declarado como entrada en `plugin.json.example` → `defaultSettings`. **Runtime failure**: en producción, Bizuit Backend Host expone settings al admin **solo si están en `defaultSettings`** del ZIP packageado. Una key usada por el código pero no declarada → resuelve a `null` silente, sin warning, sin error. Bugs latentes (worker que no arranca porque su `IntervalSeconds` viene null y casteo falla, integración que llama API con `BaseUrl` vacía y devuelve 404 sin contexto). Fix: agregar la key a `plugin.json.example` → `defaultSettings` con default sensato (string vacío para credentials, valor numérico explícito para timeouts/intervals). Excepción: keys del host como `Urls`, `ApplicationInsights:ConnectionString`, `System:TenantId`, `System:BizuitApiBaseUrl` son inyectadas por el host y NO van en `defaultSettings` — manejar via allowlist documentada en la guía. |
| **DOTNET-C7** | `catch` de `Microsoft.Data.SqlClient.SqlException` por TIPO CONCRETO en código del plugin | Cualquier `catch (SqlException ...)` / `catch (Microsoft.Data.SqlClient.SqlException ...)` / `ex is Microsoft.Data.SqlClient.SqlException` / helper que recibe `SqlException` tipado, en `Features/**/*.cs` o `Services/**`. **Por qué falla**: el plugin corre en un `AssemblyLoadContext` del host; la conexión SQL la crea el HOST (su `Microsoft.Data.SqlClient`), así que la `SqlException` se tira desde ESA carga de MDS. El `catch (SqlException)` del plugin compara por IDENTIDAD DE TIPO y en runtime NO matchea de forma confiable (aunque MDS esté en `SharedAssemblies` del loader) → la excepción ESCAPA sin manejar → **INTERNAL_ERROR**. Rompe TODA idempotencia/retry basada en `SqlException`: unique-violation (2627/2601), deadlock (1205). **Local DevHost (un solo proceso/ALC/MDS) el catch por tipo SÍ matchea → \"anda en local, falla en el host IIS\"** — exactamente el mismo perfil que C4. Fix: `catch (System.Data.Common.DbException ex) when (ex.IsUniqueViolation())` (o `.IsDeadlock()`) — `DbException` es la base del SHARED FRAMEWORK (identidad ÚNICA entre ALCs, todas las `SqlException` derivan de ella) y el `Number` se lee por reflection (helper `Shared/SqlExceptionExtensions`). Aplica a TODO `catch (SqlException)`, no solo a los de 2627. |
| **DOTNET-C8** | Read/write-while-tx-open: 2da conexión sobre la MISMA tabla que la tx tiene lockeada → self-block | Un método abre `using var tran = conn.BeginTransaction();` y, DENTRO del bloque (antes del `tran.Commit()`), llama a un método de repo/service que **NO recibe `(IDbConnection, IDbTransaction)`** y **abre su propia conexión** (`_connectionFactory.CreateConnection()` en su cuerpo). Si esa 2da conexión lee/escribe la **misma tabla** que la tx insertó/actualizó sin commitear, choca con los locks de la tx; la conn de la tx está `await`-eando a la conn nueva → ciclo a través de la capa `async` de la app, **INVISIBLE al deadlock detector de SQL** (nunca hay deadlock graph) → cuelga hasta `CommandTimeout` (~30s) → `SqlException -2` (que el catch best-effort suele tragar) → request \"exitoso\" (HTTP 200) pero con la operación a medias. Peor con `BeginTransaction(IsolationLevel.Serializable)` (range locks). **Severidad CRITICAL** cuando la 2da conexión toca la MISMA tabla que la tx muta (cuelgue garantizado); **WARNING** cuando toca una tabla DISTINTA bajo READ COMMITTED (no cuelga hoy, pero es deuda estructural latente — sube a CRITICAL si la tx pasa a SERIALIZABLE o si la tabla entra en el scope de la tx). Fix: **read-first** (mover los reads ANTES del `BeginTransaction`, conexiones cortas sin tx → la tx queda write-only) **o** pasar `(conn, tran)` al método llamado (patrón dual conn/transaction ya canónico en el codebase). Ejemplo: `ListadoService.OpenArmadoStageEventsAsync`/`CloseRecepcionStageEventsAsync` leen `CEIX_PasosDelPedido` con `GetStageEvent`/`GetOpenStageEvent` (conexión propia) dentro de la tx que inserta filas `FechaFin=NULL` en esa misma tabla. |
| **DOTNET-C9** | API de librería compartida con el host sin verificar la versión CARGADA — rompe solo en prod | El plugin se carga DENTRO del proceso del host de Bizuit y las DLLs que el host ya tiene cargadas GANAN sobre las del ZIP del plugin. Para todo paquete que el host también usa (Polly, Polly.Core, Microsoft.Extensions.Http.Resilience, Microsoft.Extensions.* (DI/Options/Logging/Http), Microsoft.ApplicationInsights*, Newtonsoft.Json), la versión efectiva en runtime NO es la del csproj: compilar y testear verde no prueba que la API exista. Si el diff introduce llamadas nuevas a superficie de esos paquetes (extension methods de conveniencia, APIs agregadas en versiones recientes) sin verificación citada de la versión real cargada (`GET diagnostics/assemblies` contra staging — mismo host que prod — o manifiesto de versiones del host) ni fail-closed en el call-site (catch `MissingMethodException`/`TypeLoadException` con degradación segura) → **CRITICAL**. Preferir siempre primitivas estables (base de Polly.Core 8.x, BCL) o lectura de datos crudos (property keys) en vez de extensiones nuevas. Ejemplo: `HttpResilienceContextExtensions.GetRequestMessage()` (Http.Resilience 9.0.0) que no existe en el host de prod → el predicado de retry explota tras CADA llamada → TODAS las llamadas que pasan por él mueren, disfrazadas de error de conexión. |

### WARNING

| ID | Regla | Patrón detectado |
|---|---|---|
| **DOTNET-W1** | Layer-based folders | Carpetas tipo `Controllers/`, `Services/`, `Repositories/` en la raíz del proyecto (en vez de `Features/{Name}/{Models, Service, Repository, Endpoints}`). Fix: reorganizar por feature. |
| **DOTNET-W2** | Orchestrator pattern roto | Service A llama directo a Repository de Service B (en vez de llamar a Service B). Rompe encapsulación + testabilidad. Fix: Services call Services, not Repos de otro feature. |
| **DOTNET-W3** | Endpoint sin auto-prefix | `app.MapPost(\"/ruta\", ...)` directo en `Program.cs`/`TotoraBackend.cs` en vez de usar `IPluginEndpointBuilder`. Rompe el prefix `/api/plugins/{name}/` (sin versión: el host sirve la activa). Fix: registrar via builder. |
| **DOTNET-W4** | Test naming no sigue convención | Tests xUnit con nombres que no matchean `MethodName_Scenario_ExpectedResult` (ej: `TestMethod1`, `DescriptivoDelEscenario` sin método en el prefix). Fix: renombrar según convención. Excepción: si el equipo adopta naming alternativo, documentarlo en la guía `bizuit-plugin-dotnet.md` y este check se deshabilita para ese repo. |
| **DOTNET-W5** | Lifetime de DI incorrecto | Singleton de algo que debería ser Scoped (ej: un validator que tiene dependencias scoped), o Scoped de algo que debería ser Singleton (config cache). Fix: revisar lifetime según el tipo de servicio. |
| **DOTNET-W6** | `[NoTransaction]` sin justificación | Uso del attribute `[NoTransaction]` sin comentario arriba explicando por qué. Fix: comentario con razón (ej: \"// Read-only, no state mutation\"). |
| **DOTNET-W7** | `plugin.json` vs `plugin.json.example` desincronizados | Un archivo cambió pero el otro no. Fix: sincronizar (el `.example` debería ser un mirror con valores placeholder). |
| **DOTNET-W8** | Método en Service sin tests directos | Los tests mockean el service entero (`Mock<IPacaraService>`) en vez de ejercitar la lógica real con `Mock<HttpMessageHandler>` o similar. Fix: patrón de `VoipApiServiceTests` — mockear dependency externa, ejecutar el service real. |
| **DOTNET-W10** | Setting key declarada en `plugin.json.example` pero no usada en código (dead config) | Entrada en `plugin.json.example` → `defaultSettings` cuyo key (`\"X:Y\"`) NO aparece en ningún `configuration[\"X:Y\"]` / `Configuration[\"X:Y\"]` del código bajo `src/`. Genera ruido de configuración para admins (campos en la UI del Bizuit Host que no hacen nada). Fix: remover del `defaultSettings` o, si se planea usar, dejar comentario explícito en el cambio. Excepción: keys que se leen via `IOptions<T>` en lugar de indexer — el detector debe inspeccionar también `services.Configure<T>(configuration.GetSection(\"...\"))` y mapear las properties del POCO a keys (`Section:PropertyName`). |
| **DOTNET-W9** | Schema de BD asumido sin verificar contra BD real | Código con queries SQL (vía `SafeQueryBuilder` o raw) que referencia tablas, columnas, stored procedures, o relaciones **sin que el advisor haya verificado que existen en la BD de dev**. Fix: advisor debe conectarse a la BD de dev (connection string de `appsettings.Development.json` o `appsettings.Local.json`) **sólo si apunta a una base LOCAL** (`localhost`, `127.0.0.1`, `(local)`, `.`) —si apunta a staging o a una base compartida, no se conecta (ver «Límites de ejecución») y emite el WARNING de no verificado— y validar: (a) cada tabla referenciada existe, (b) cada columna usada en `WHERE`/`SELECT`/`UPDATE` existe en la tabla correspondiente con el tipo esperado, (c) nombres de foreign keys que se joinean coinciden. Sin acceso a BD de dev → WARNING explícito \"schema no verificado, asumir puede causar runtime errors\". Con acceso → WARNING por cada mismatch detectado (`tabla 'Llamadas' no existe — la tabla real se llama 'Calls'`). |
| **DOTNET-W11** | Write-path sin audit injection declarada por el proyecto (**PROJECT-gated**) | Solo aplica si el repo declara su convención de auditoría en `.tycon/advisors.yaml` → bloque `audit:` con `interface:` (ej `IAuditService`); sin esa key la regla es silenciosa. Detecta: clase `*Service.cs` / `*Repository.cs` nueva o modificada en el diff cuyo constructor NO inyecta la interface declarada NI está anotada con el atributo de exclusión (`audit.exclude_attribute`, default `[ExcludeFromAuditCoverage]`). Los write-paths (métodos con INSERT/UPDATE/DELETE vía SafeQueryBuilder o repos que mutan) DEBEN inyectar audit; los read-only pueden excluirse con el atributo (la anotación es la constancia de que se decidió). Por qué: sin este check los bugs de audit-wiring solo los caza la full suite (`dotnet test --filter=*SchemaTests`); acá se atrapan en el diff. Fix: inyectar la interface o anotar la exclusión con razón. |
| **DOTNET-W12** | `DateTime` leído de SQL y devuelto por la API sin `Kind=Utc` explícito | Método que materializa un tipo con propiedades `DateTime`/`DateTime?` vía Dapper genérico (`QueryAsync<T>`, `QueryFirstOrDefaultAsync<T>`, `QuerySingleOrDefaultAsync<T>`, `QueryFirstAsync<T>`) y lo devuelve hacia un controller/endpoint, **sin** `DateTime.SpecifyKind(..., DateTimeKind.Utc)` a la salida del repositorio y **sin** que la columna sea `DATETIMEOFFSET`. Ver la sección \"Detección concreta — DOTNET-W12\" para el procedimiento, las 3 condiciones que deben darse juntas y los casos que NO son hallazgo. Fix: marcar el `Kind` a la salida del repositorio (o, mejor, un converter global de `JsonSerializerOptions` en `Program.cs` que lo haga para toda la API — si existe, la regla queda silenciosa). |
| **DOTNET-W13** | Token de concurrencia optimista (`DateTime`) comparado por **igualdad** contra una columna `datetime2`, con Dapper y sin `DbType.DateTime2` explícito | SQL que contiene `WHERE`/`AND <col> = @<param>` donde el parámetro se alimenta de un `DateTime`/`DateTime?` desde Dapper (objeto anónimo o `DynamicParameters.Add` **sin** el tercer argumento `DbType.DateTime2`) y la columna es `datetime2`. Dapper mapea `DateTime` a `DbType.DateTime` (el `datetime` viejo, 1/300 s); SQL Server **redondea el parámetro a milisegundos** al compararlo contra `datetime2`, y `GETUTCDATE()` escribe ticks de 1/300 s (ej. `.9166667`) que ningún milisegundo representa exacto → **la igualdad no matchea nunca**. No hay error ni excepción: el `UPDATE` afecta 0 filas y eso se lee igual que \"la fila no existe\". Ver \"Detección concreta — DOTNET-W13\". Fix: `parameters.Add(\"ExpectedUpdatedAt\", value, DbType.DateTime2)`. |

## Límites de ejecución (no vienen del CLAUDE.md)

Este revisor corre con `omitClaudeMd: true`: no carga el `CLAUDE.md` global ni el del repo, así que
las reglas de ejecución que antes le llegaban por ahí están acá. No se negocian:

- **Nunca una suite de pruebas sin filtro.** Si necesitás correr pruebas, sólo el archivo o la clase
  tocada (`npm test -- <patrón>`, `dotnet test --filter \"FullyQualifiedName~<Clase>\"`). Una suite
  completa congela la máquina del dev y es trabajo del cierre, no de un revisor.
- **Nunca escribir en una base de datos ni levantar servicios** (DevHost, `docker`, `npm run dev`,
  servidores de prueba). Leés código; no cambiás estado.
- **No consultar bases compartidas o remotas.** Las connection strings de `appsettings.*` suelen
  apuntar a staging o a bases de otros equipos: si no es una base local (`localhost`, `127.0.0.1`,
  `(local)`, `.`), no te conectes — verificá contra las migraciones del repo y decí que no pudiste
  verificar contra la base.

