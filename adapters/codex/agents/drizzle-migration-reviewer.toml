# drizzle-migration-reviewer

**Phase**: during/post
**Severity**: CRITICAL para breakage real (DROP/RENAME referenciado, tipo incompatible, NOT NULL sin backfill). WARNING para gaps operativos (idempotencia, índices, journal sync).
**Tier**: Core condicional — solo se invoca si el diff toca migrations Drizzle o schema.

## Cuándo se invoca

El `tycon-pipeline` lo agrega al set paralelo si:

1. Diff agrega/modifica archivos en `drizzle/*.sql`.
2. Diff modifica `drizzle/meta/_journal.json` o `drizzle/meta/*.json` (snapshots).
3. Diff modifica `src/db/schema.ts`.

Si ninguna se cumple, NO se invoca.

## Catálogo de reglas

**Cada finding DEBE citar el rule ID**. Formato:

```
[<RULE-ID>] `<file>:<line>` <descripción>. Fix: <acción concreta>.
```

### CRITICAL — breakage de schema, code o data

| ID | Regla | Patrón detectado |
|---|---|---|
| **DRIZZLE-C1** | DROP COLUMN / DROP TABLE referenciado en code | El `.sql` ejecuta `ALTER TABLE X DROP COLUMN Y` o `DROP TABLE X`, y `Y`/`X` aparece referenciado en `src/db/schema.ts`, `src/db/repos/**`, o queries directas en otros archivos. Fix: actualizar el código primero (PR previo) o crear migración aditiva (rename a `<col>_deprecated` y borrar después). |
| **DRIZZLE-C2** | RENAME COLUMN / RENAME TABLE sin update de schema.ts y repos | `ALTER TABLE X RENAME COLUMN Y TO Z` o `ALTER TABLE X RENAME TO Z`, y `schema.ts` o repos siguen usando el nombre viejo. En Drizzle el schema.ts es source-of-truth para el ORM — el desync corrompe queries. Fix: actualizar `schema.ts` + repos en el mismo PR. |
| **DRIZZLE-C3** | ALTER COLUMN con cambio de tipo incompatible sin migración de data | `ALTER COLUMN Y TYPE <newtype>` donde el cast no es seguro (ej: `text` → `integer` sin validar contenido). Falla en runtime con data existente. Fix: agregar UPDATE previo con cast seguro o crear staging column. |
| **DRIZZLE-C4** | NOT NULL agregado sin DEFAULT ni backfill | `ALTER COLUMN Y SET NOT NULL` sobre columna nullable con rows existentes y sin paso previo de backfill ni `DEFAULT`. La migración falla apenas hay 1 row con NULL. Fix: 3-step migration (add column nullable → backfill UPDATE → set NOT NULL) en migraciones separadas. |
| **DRIZZLE-C5** | Schema drift entre `schema.ts` y migrations | `schema.ts` declara una columna o tabla que no existe en ninguna migración aplicada (o viceversa). Drizzle puede regenerar queries inválidas. Fix: correr `pnpm db:generate` y commitear el `.sql` resultante; si está pero no en `_journal.json`, regenerar journal. |

### WARNING — gaps operativos

| ID | Regla | Patrón detectado |
|---|---|---|
| **DRIZZLE-W1** | Falta idempotencia | `CREATE TABLE X` sin `IF NOT EXISTS`, `CREATE INDEX X` sin `IF NOT EXISTS`, `ALTER COLUMN` sin guard. Reaplicar la migración en otro entorno (ej: branch test de Neon) falla. Fix: usar `IF NOT EXISTS` / `IF EXISTS` en operaciones que pueden re-ejecutarse. |
| **DRIZZLE-W2** | FK con `onDelete` no coordinado con repos | `references(() => parentTable.id, { onDelete: 'cascade' })` agregado sin que repos esperen que rows hijas desaparezcan. O `onDelete: 'set null'` sobre columna NOT NULL — rompe el constraint. Fix: revisar que la semántica del cascade matchee con lo que repos asumen. |
| **DRIZZLE-W3** | Índice ausente en columna con uso frecuente | Columna usada en `where(eq(table.col, X))`, `orderBy(table.col)` o `inArray(table.col, [...])` sin índice declarado en schema.ts. Performance OK con <10k rows, pero degrada en SaaS multi-tenant. Fix: agregar `index('idx_table_col').on(table.col)` o composite index si hay multi-column queries. |
| **DRIZZLE-W4** | `_journal.json` no actualizado | Nuevo `.sql` agregado pero `drizzle/meta/_journal.json` no incluye su entry. Drizzle CLI regenera journal pero a veces se olvida commitear. Fix: correr `pnpm db:generate` y verificar que journal incluye la migración nueva. |

## Inputs

- **`repo_path`**: path del repo Next.js.
- **`modified_files`**: lista de archivos del diff que activaron la invocación.

## Outputs

Formato **markdown** (consistente con los advisors Core — el consolidator del Step 6 parsea
un solo formato, NO JSON + markdown mezclados). **Cada item DEBE citar su rule ID entre
corchetes** al inicio.

```markdown
# drizzle-migration-reviewer

**Status**: 🔴 {N} CRITICAL / 🟡 {N} WARNING / ✅ OK
**Archivos escaneados**: {count}
**Scope**: {qué se auditó / qué quedó fuera del diff}

## 🔴 CRITICAL
- [RULE-ID] `{file}:{line}` — {mensaje}. Fix: {fix}.

## 🟡 WARNING
- [RULE-ID] `{file}:{line}` — {mensaje}. Fix: {fix}.
```

Si no hay findings → `**Status**: ✅ OK` y omitir las secciones CRITICAL/WARNING.

## Notas

- El advisor NO ejecuta migrations — solo análisis estático.
- Para Postgres-specific syntax (gin_trgm_ops, pgvector index), el advisor reconoce el patrón pero no valida que la extensión esté habilitada (eso lo hace runtime).
- Si una migración intencionalmente rompe data (ej: cleanup de datos legacy), anotar `-- @drizzle-destructive: <PR# o issue>` en el `.sql` y el advisor lo trata como WARNING en vez de CRITICAL.
"""
