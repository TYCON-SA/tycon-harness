#### [WIRING-W2] Badge/count prop sin sync hook

**Qué detecta**: componente acepta prop `count: number` (o `badgeCount`, `pendingCount`, `unreadCount`, etc.) pero **no hay hook con `useEffect` + `setInterval` o SignalR listener** en el diff que populate la fuente del count.

**Heurística**:

1. Para cada `.tsx` en `modified_files` con interface `Props` que contenga campo con pattern `^(count|badge.*|pending.*|unread.*|new.*)Count|^(count)$` typed como `number`.
2. Verificar si el diff agrega un hook (`hooks/use*.ts`) con `useEffect` + `setInterval` O `signalrService.on(` O `.subscribe(` que setee state que termine alimentando el count.
3. Si **no encuentra sync hook** → WARNING.

**Ejemplo de finding**:

```
[WIRING-W2] `src/components/SidebarCollapsed.tsx:18` prop printQueueCount: number
declarado pero diff no incluye hook que populate el store fuente. Badge va a
mostrar 0 siempre hasta que alguien implemente el sync.
Fix: agregar hook useColaDeArmadoSync (30s polling) + invocarlo en DepositoLayout.
Ver patrón de useNotificationsSync para referencia.
```

#### [WIRING-W4] Módulo compartido modificado sin enumerar sus consumidores (2026-09-06)

**Qué detecta**: un archivo del diff exporta un símbolo (service, hook, helper, store) que importan **dos o más** apps o paquetes del mismo repo (monorepo con varias raíces —`totora-encargos/`, `totora-catalogo/`, `packages/*`, `apps/*`— o una carpeta `shared/`/`lib/` consumida desde más de una raíz), el diff cambia su firma o su comportamiento, y la story (Dev Notes / Tasks / File List / Tests) nombra sólo a UNO de esos consumidores.

**Severidad WARNING** (no CRITICAL) porque el cambio puede ser correcto para todos los consumidores — el defecto es que nadie lo verificó: los demás quedan cubiertos «por construcción», sin test, smoke ni E2E. Ejemplo: un fix de `subscribeToTopics` en `signalr.service.ts` que consumen `totora-encargos/src/index.tsx` y `totora-catalogo/src/Dashboard.tsx`, sin que ningún reporte de la story nombre a `totora-catalogo`; o un cambio de contrato de un hook que rompe suites fuera del File List. `XPAT-*` cubre plugins backend hermanos en repos separados; esto es el mismo concepto dentro de un solo repo.

**Heurística**:

1. Para cada archivo `.ts`/`.tsx` del diff que exporte símbolos, listar los importadores reales:

   ```
   grep -rlE \"from ['\\\"][^'\\\"]*<nombre-del-archivo-sin-extensión>['\\\"]\" --include=*.ts --include=*.tsx . | grep -v node_modules
   ```

   🔴 y RESOLVER cada import al archivo real (ruta relativa desde el importador, o `codegraph_callers`, que es la fuente correcta en repos indexados): en Totora hay nombres de archivo repetidos entre apps (`ConfirmModal.tsx` vive en dos apps y son DOS archivos), y contar por nombre cruza raíces que no importan el módulo del diff. Sólo cuenta el importador cuyo import resuelve al archivo modificado. Agrupar los importadores por **raíz de app** (el primer segmento del path, o el `package.json` más cercano).
2. Si los importadores caen en **≥2 raíces**, comparar esas raíces con las que la story nombra (Dev Notes, Tasks, File List, tabla `### Tests`, E2E). Una raíz importadora que la story no menciona → finding.
3. No flaggear: módulos consumidos desde una sola raíz; consumidores que la story NOMBRA en cualquier sección (Dev Notes, Tasks, File List, Tests, E2E, smoke) — 🔴 **nombrarlo alcanza**: si la story dice «también lo consume `totora-catalogo`» no hay WIRING-W4, aunque no lo cubra con un test o el test no esté en el diff; que la cobertura sea suficiente es asunto de `TEST-C*`/`ACCOV-*`, no de cableado. El finding es SÓLO por consumidores AUSENTES de la story. Tampoco flaggear cambios que no tocan la firma ni el comportamiento (renombres internos, comentarios, tipos sin cambio de forma).

**Formato de finding**:

```
[WIRING-W4] `totora-encargos/src/services/signalr.service.ts:41` subscribeToTopics cambió
(ahora rechaza cuando todas las suscripciones fallan). Lo importan totora-encargos/src/index.tsx
y totora-catalogo/src/Dashboard.tsx; la story sólo nombra a totora-encargos.
Fix: agregar a la story el consumidor totora-catalogo con su test o smoke (o la nota de por qué
no lo afecta) — el cambio le llega igual.
```

---

## Workflow

1. **Stack detection** (skip automático):
   - Leer `package.json` del repo. Si no tiene `react` O tiene `vue`/`@angular/core`/`svelte` → emit \"stack no soportado\" + status OK. Stop.
   - Si tiene `next` en deps → este advisor NO aplica (V1 cubre React SPA / plugin Bizuit, no Next.js — el wiring de Next.js Server Components es ortogonal). Skip + OK.
   - Si tiene `react` + (esbuild o no-next) → corre frontend rules.
   - Si hay `.cs` modificados y proyecto tiene `IPluginEndpointBuilder` / `Bizuit.Backend.*` referencias → corre WIRING-W3 (REST caller detection).

2. **Parsear modified_files** por categoría:
   - Componentes (.tsx con export).
   - Stores Zustand (`store/use<X>Store.ts`).
   - Hooks (`hooks/use<X>.ts`).
   - Endpoints .NET (`.cs` con `MapGet/MapPost/...`).
   - Otros (ignorar).

3. **Aplicar reglas en orden**:
   - WIRING-C1 sobre componentes nuevos.
   - WIRING-C2 sobre stores modificados.
   - WIRING-C3 sobre hooks side-effect nuevos.
   - WIRING-C4 sobre archivos con `preventDefault` en keyboard listener.
   - WIRING-C5 sobre archivos de layout/navegación (`*Layout*`, `*Nav*`, `Sidebar*`, `Drawer*`, routing) vs el artefacto de IA (navigation-map.md / UX spec).
   - WIRING-W1 sobre `data-testid` declarados en story (si `story_path` provisto).
   - WIRING-W2 sobre props `*Count` numéricos.
   - WIRING-W3 sobre endpoints .NET nuevos.
   - WIRING-W4 sobre símbolos exportados modificados que importan ≥2 raíces de app del mismo repo: enumerar los importadores reales y compararlos con los consumidores que la story nombra.

4. **Emit findings** con rule ID + file:line + fix copy-pasteable.

5. **Output reporte estructurado**.

