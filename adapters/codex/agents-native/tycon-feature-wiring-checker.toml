#### [WIRING-C2] Zustand store action sin invocación real

**Qué detecta**: action agregada al slice de un `useXStore` que ningún componente / hook invoca.

**Heurística**:

1. Detectar archivos `store/use<X>Store.ts` (o `store/<x>Store.ts`) en `modified_files`.
2. Parsear las actions exportadas: heurística simple — buscar pattern `<name>: (<args>) =>` o `<name>: async (<args>) =>` dentro del slice (excluir state fields que sean valores, no funciones).
3. Para cada `actionName`, grep en `src/` con extensiones `.tsx` y `.ts`:

   ```
   grep -rn \"use<X>Store(.*)\\.<actionName>(\\|use<X>Store\\.getState()\\.<actionName>(\" \\
     src/ --include=\"*.tsx\" --include=\"*.ts\" \\
     --exclude-dir=__tests__ --exclude=\"*.test.*\" --exclude=\"*.spec.*\"
   ```

   Equivalente más permisivo (cubre destructuring): grep por `\\.<actionName>\\(` en archivos que también importen del store.
4. Si **0 matches** fuera de tests → CRITICAL.

**Ejemplo de finding**:

```
[WIRING-C2] `src/store/useDespachoStore.ts:42` action openRemitoModal exportada
pero 0 callsites fuera de tests. Ningún componente la invoca → modal nunca abre.
Fix: invocar desde el handler que debe abrir el modal. Ejemplo:
  // en useKeyboardShortcuts.ts
  const openRemitoModal = useDespachoStore(s => s.openRemitoModal);
  // dentro del handler Ctrl+P:
  openRemitoModal([]);
```

**Falsos positivos esperables**:
- Actions invocadas via `subscribe()` con selector dinámico — el grep no detecta. Si el dev detecta esto, override con razón en commit.
- Actions usadas en e2e tests fuera de `__tests__/` (raro en plugins Bizuit).

---

#### [WIRING-C3] React hook side-effect sin mount en el árbol del app shell

**Qué detecta**: hook custom agregado al diff que contiene side-effect (polling, fetch, SignalR subscribe), exportado del barrel `hooks/index.ts`, pero **ningún componente lo invoca**.

**Heurística**:

1. Para cada `hooks/use<X>.ts(x)` en `modified_files` que tenga `useEffect(` con al menos uno de los patterns: `setInterval(`, `fetch(`, `api.get(`, `api.post(`, `signalrService.on(`, `signalRConnection.on(`, `.subscribe(`.
2. Extraer `use<X>` (el hook name).
3. Grep en `src/` por callsites del hook:

   ```
   grep -rn \"use<X>(\" src/ --include=\"*.tsx\" --include=\"*.ts\" \\
     --exclude-dir=__tests__ --exclude=\"*.test.*\" \\
     --exclude=\"<hook-file>\"
   ```
4. Si **0 matches** → CRITICAL.

**Ejemplo de finding**:

```
[WIRING-C3] `src/hooks/useColaDeArmadoSync.ts:8` hook con useEffect + setInterval(30s)
que populate useDespachoStore.colaDeArmado, pero 0 callsites en src/ fuera de tests.
El polling nunca arranca → badge SidebarCollapsed.printQueueCount queda en 0.
Fix: invocar el hook desde el componente root del feature (típicamente
DepositoLayout, AdminLayout, o el page-level component). Ejemplo:
  // en DepositoLayout.tsx
  useColaDeArmadoSync();
```

**Falsos positivos esperables**:
- Hooks invocados condicionalmente via render prop o HOC — el grep simple no detecta. Override manual.
- Hooks lib-only que se documentan para consumers externos (no típico).

---

#### [WIRING-C4] Keyboard event handler sin user action

**Qué detecta**: `event.preventDefault()` agregado en un `keydown`/`keyup` listener del diff que **no invoca acción de usuario** (store action, navigate, modal open, etc.).

**Heurística**:

1. Para cada archivo `.tsx`/`.ts` en `modified_files` que agrega un listener de keyboard:
   - Detectar pattern: `useEffect(() => { ... document.addEventListener('keydown', ...)` o `<X onKeyDown={...}` con `event.preventDefault()` dentro.
2. Dentro del cuerpo del handler (entre `(event) =>` y el cierre), verificar presencia de **al menos uno** de:
   - `useXStore(...).<actionName>(` o `useXStore.getState().<actionName>(`
   - `navigate(` / `router.push(` / `window.location.`
   - Función imported que termine con verbo de acción: `open*`, `close*`, `submit*`, `confirm*`, `cancel*`, `trigger*`, `launch*`.
   - `set<X>(` (setState explícito que cambie UI visible).
3. Si encuentra `preventDefault()` pero **ninguno** de los anteriores → CRITICAL.

**Ejemplo de finding**:

```
[WIRING-C4] `src/hooks/useKeyboardShortcuts.ts:47` handler Ctrl+P llama
event.preventDefault() pero solo previene la impresión nativa del browser
— NO invoca acción de usuario. El usuario presiona Ctrl+P y no pasa nada.
Fix: invocar la action que debe responder al shortcut. Ejemplo:
  const openRemitoModal = useDespachoStore(s => s.openRemitoModal);
  // ...dentro del handler...
  if (event.ctrlKey && event.key === 'p') {
    event.preventDefault();
    openRemitoModal([]); // ← agregar
  }
```

**Falsos positivos esperables**:
- Handlers que solo previenen default intencionalmente (ej: bloquear F5 refresh en kiosko) — el dev override con razón en commit.

---

#### [WIRING-C5] Layout/navegación modificado sin validar contra el artefacto de IA

**Qué detecta**: el diff crea o modifica **layout, navegación o estructura de pantalla** (componentes `*Layout*`, `*Nav*`, `Sidebar*`, `Drawer*`, routing) y NO hay evidencia de que la implementación se validó contra el artefacto de IA del proyecto (`navigation-map.md` y/o la sección de layout/navegación del UX spec) antes de `done`. Enforcea la **Regla 11.1 de `workflow-orchestration.md`** — hasta 2026-06-09 era regla solo-en-guía, invisible para el pipeline.

**Heurística**:

1. Trigger: algún archivo de `modified_files` matchea `\\b(\\w*Layout|\\w*Nav\\w*|Sidebar\\w*|Drawer\\w*)\\.tsx$` o toca routing (`router`, `routes`, `navigate(` agregado).
2. Localizar el artefacto de IA: `specs/planning-artifacts/navigation-map.md` o `ux-design-specification*.md` (sección layout/navegación). Si el proyecto NO tiene ninguno → degradar a WARNING con nota \"proyecto sin artefacto de navegación — considerar crearlo\".
3. Buscar evidencia de validación, cualquiera de:
   - El artefacto de IA está EN el diff (la divergencia se ratificó en el mismo PR — el caso correcto per Regla 11.1).
   - La story / Dev Agent Record declara explícitamente consistencia citando el artefacto (sección o anchor concreto, no \"es consistente\" a secas).
4. Sin evidencia → **CRITICAL**: el layout nuevo puede ser un \"tercer modelo\" silencioso sobre el que se construyen N stories antes de descubrir el drift.

**Ejemplo de finding**:

```
[WIRING-C5] `src/components/deposito/DepositoLayout.tsx` modifica el modelo de
navegación (un panel lateral superpuesto) pero ni navigation-map.md está en el diff
ni la story cita el artefacto. Regla 11.1: si la divergencia es intencional,
se ratifica en el artefacto fuente EN ESTE MISMO PR — nunca \"después\".
Por qué: un layout que diverge en silencio del artefacto aprobado se descubre
semanas y varias stories después, y reconciliarlo cuesta una story entera.
Fix: (a) editar el artefacto de IA en este PR ratificando el modelo nuevo, o
(b) ajustar la implementación al artefacto, o (c) si toca modelo FIRMADO por
el cliente → CR registrado (Regla 12.3 + signed-scope-guardrails.md).
```

**Falsos positivos esperables**:
- Cambios cosméticos dentro de un layout existente (padding, colores, copy) que no alteran estructura/navegación — el advisor mira si el diff agrega/quita/mueve regiones de pantalla, rutas o paneles, no estilos.

