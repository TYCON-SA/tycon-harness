### WARNING — no bloquea, reportar

#### [WIRING-W1] data-testid declarado en spec Mary+GOLD sin uso en código

**Qué detecta**: la story `.md` declara `data-testid=\"X\"` (en pseudocódigo, contexto de AC, o tabla de tests) pero el código no lo incluye.

**Heurística**:

1. Si `story_path` está disponible, parsear el contenido buscando pattern `data-testid=\"([^\"]+)\"`.
2. Para cada testid encontrado, grep en `src/` (frontend del diff):

   ```
   grep -rn 'data-testid=\"<X>\"' src/ --include=\"*.tsx\" --include=\"*.ts\"
   ```
3. Si **0 matches** → WARNING.

**Ejemplo de finding**:

```
[WIRING-W1] story declara data-testid=\"ceibo-listado-imprimir\" en AC #5
pero el código no incluye el atributo. Tests E2E que dependan del testid van
a fallar runtime con \"no element found\".
Fix: agregar `data-testid=\"ceibo-listado-imprimir\"` al botón
Imprimir en ListadoToolbar.tsx.
```

