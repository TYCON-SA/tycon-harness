### CRITICAL — bloquea commit prep

#### [WIRING-C1] Componente React exportado sin mount real

**Qué detecta**: componente `.tsx` agregado o modificado en el diff cuyo símbolo no aparece **fuera del propio archivo y de tests**.

**Heurística**:

1. Para cada `.tsx` en `modified_files` que exporta un componente (heurística: `export (default )?(function|const) <PascalName>` o `export { <PascalName> }`):
2. Extraer `<PascalName>`.
3. Grep en `src/` con extensión `.tsx`:

   ```
   grep -rn \"<<PascalName>\" src/ --include=\"*.tsx\" \\
     --exclude-dir=__tests__ \\
     --exclude=\"*.test.tsx\" --exclude=\"*.stories.tsx\"
   ```

   Excluir además el archivo del propio componente (donde está la definición).
4. Si **0 matches** → CRITICAL.

**Ejemplo de finding**:

```
[WIRING-C1] `src/components/modals/RemitoModal.tsx:1` componente RemitoModal exportado
pero NO aparece como JSX `<RemitoModal` en ningún `.tsx` fuera de tests.
La feature está exportada + testeada pero nunca se renderiza al usuario.
Fix: agregar `<RemitoModal userRoles={userRoles} />` en `DepositoLayout.tsx` (o
layout/page equivalente del shell) entre los componentes del árbol principal.
```

**Falsos positivos esperables**:
- Componentes cargados via `React.lazy(() => import('...'))` o `dynamic()` — el grep `<<Name>` no matchea. Documentar como WARNING degradado si se detecta `lazy(` con el path del componente en el diff.
- Componentes exportados como librería interna consumidos por otro repo (no típico en plugins Bizuit).

