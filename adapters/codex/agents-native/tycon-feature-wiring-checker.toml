#### [WIRING-W3] Endpoint .NET Minimal API sin caller frontend

**Qué detecta**: endpoint `endpoints.MapGet/MapPost/MapPut/MapDelete(\"ruta\", ...)` agregado en archivo `.cs` del diff que ningún archivo `.ts`/`.tsx` del frontend invoca.

**Severidad WARNING** (no CRITICAL) porque hay casos legítimos: endpoint admin-only, integración B2B externa, endpoint consumido por otro plugin Bizuit, spike preliminar. Si V2 confirma que estos casos son raros en el codebase TYCON y el dev quiere bloqueo duro, promover a CRITICAL real con un ID nuevo del rango C (el C5 se asignó 2026-06-09 al check de layout-vs-artefacto; el ID concreto se reserva recién al promover, para no crear orphans en el catálogo).

**Heurística**:

1. Para cada `.cs` en `modified_files`, grep por:

   ```
   grep -nE '\\.Map(Get|Post|Put|Delete|Patch)\\(\\s*\"([^\"]+)\"' <file>
   ```

   Extraer cada `\"ruta\"` agregada en el diff (comparar con `git diff` para distinguir nuevas vs existentes — solo flaggear las **nuevas**).
2. Construir el path absoluto frontend: típicamente `/api/ceibo/<ruta>` o `/api/plugins/<plugin-name>/<ruta>` según convención del proyecto. Si la convención es ambigua, intentar ambos.
3. Grep en `src/` (frontend) con extensiones `.ts` y `.tsx`:

   ```
   grep -rn \"<ruta>\" src/ --include=\"*.ts\" --include=\"*.tsx\" \\
     --exclude-dir=__tests__ --exclude=\"*.test.*\"
   ```

   Buscar tanto el path absoluto como el relativo (sin prefix `/api/plugins/...`).
4. Si **0 matches** → WARNING (no CRITICAL — puede ser endpoint admin / spike).

**Ejemplo de finding**:

```
[WIRING-W3] `src/CeiboBackend/Features/Despacho/DespachoEndpoints.cs:34`
endpoint GET /api/ceibo/despacho/printers agregado pero ningún archivo
frontend lo invoca. Buscado en CeiboFrontEnd/src/ (.ts + .tsx), 0 matches.
Posibles causas:
  (a) falta agregar el wrapper en src/services/despachoApi.ts
      (export async function getPrinters(): Promise<Printer[]> { return api.get('/api/ceibo/despacho/printers'); })
  (b) endpoint es admin-only / spike preliminar (override con razón)
Fix: si (a), agregar wrapper + caller. Si (b), comentario en commit body
explicando por qué no hay caller frontend en este sprint.
```

**Falsos positivos esperables**:
- Endpoints consumidos por Postman / curl manual durante desarrollo.
- Endpoints expuestos para integraciones B2B externas (no consume el frontend).
- Endpoints internos llamados por otro plugin Bizuit, no por el frontend del propio plugin.

En todos esos casos, el dev confirma y silencia (override con razón).

