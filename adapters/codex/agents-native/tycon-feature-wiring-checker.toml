## Qué hace

Cierra el gap entre **\"código exportado + tests verdes\"** y **\"feature realmente accesible al usuario\"**. Detecta el patrón \"código done, feature dead\" — componente que vive en `src/components/Foo.tsx` con suite de tests verde pero que nunca está mounted en el árbol del app shell, store action que existe en el slice de Zustand pero ningún callsite la invoca, endpoint .NET registrado pero sin caller frontend.

**Por qué**: advisors, tests y builds en verde no prueban que la feature esté conectada. Ejemplo:

6 advisors paralelos GREEN + 369/369 backend tests + 347/347 frontend tests + builds verdes. Story declarada `review`. Y aun así, **5 gaps invisibles a los demás advisors**:

1. `RemitoModal` exportado + 8 tests verdes → **nunca mounted** en `DepositoLayout`. Feature inaccesible.
2. `useDespachoStore.openRemitoModal` → **0 callsites reales** fuera de tests.
3. `useKeyboardShortcuts.onPrint` → handler con `event.preventDefault()` pero sin abrir UI ni invocar action.
4. `SidebarCollapsed.printQueueCount` → **0 hooks que populen el store** (badge always = 0).
5. `ListadoToolbar` → sin botón \"Imprimir\" que invoque la action.

Ninguno de los demás advisors (`tycon-plugin-react-conventions`, `tycon-plugin-tests-coverage`, `tycon-plugin-security-basics`, `tycon-ac-coverage-checker`) detecta estos gaps porque:
- React-conventions valida estilos/convenciones del código, no si está montado.
- Tests-coverage valida que el test corre, no que el componente esté wired.
- Security-basics scanea inputs/secretos.
- AC-coverage-checker hace grep semántico de keywords del AC pero NO valida el mount/callsite chain.

## Stack soportado (V1)

**Frontend**:
- React 18 + TypeScript
- Zustand para state management
- esbuild para build
- vitest para tests
- `@ceibo/ui` u otro SDK Bizuit como peer

**Backend**:
- .NET 9 + Minimal API
- Bizuit Plugin framework (`IPluginEndpointBuilder` + `BizuitUserContext`)
- Endpoints registrados via `endpoints.MapGet/MapPost/MapPut/MapDelete(\"ruta\", ...)`

**NO soportados en V1** (advisor separado pendiente para cada uno cuando TYCON adopte el stack):
- Vue / Nuxt
- Angular
- Blazor / Razor Server / Razor Pages
- Svelte / SvelteKit
- Mobile nativo (Swift, Kotlin, React Native, Flutter)
- Express / Node.js backend
- Solid.js / Qwik / otros frameworks emergentes

Si el `package.json` no tiene `react` como dep o tiene `vue`/`@angular/core`/`svelte` → advisor **skipea con OK** y emite mensaje:

