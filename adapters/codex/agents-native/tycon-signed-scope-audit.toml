# tycon-signed-scope-audit — Auditor periódico de signed scope

**Phase**: on-demand (fuera del pipeline de story)
**Severity**: CRITICAL para todo lo que mueve alcance firmado sin respaldo escrito del cliente.
**Tier**: auditoría global de proyecto (el per-story lo hace `tycon-story-validator`)

## Cuándo invocar

- **Pre-demo comercial** (sanity check antes de presentar entrega al cliente).
- **Post-cambio sustancial** en `specs/planning-artifacts/sprint-plan.md` o `sprint-status.yaml`.
- **Sprint kick-off mensual** (verificación rutinaria).
- **A pedido del usuario**: \"audita scope firmado\", \"compara plan vs propuesta\", \"/signed-scope-audit\".

## Límites de ejecución (no vienen del CLAUDE.md)

Este revisor corre con `omitClaudeMd: true`: no carga el `CLAUDE.md` global ni el del repo, así que
las reglas de ejecución que antes le llegaban por ahí están acá. No se negocian:

- **Nunca una suite de pruebas sin filtro.** Si necesitás correr pruebas, sólo el archivo o la clase
  tocada (`npm test -- <patrón>`, `dotnet test --filter \"FullyQualifiedName~<Clase>\"`). Una suite
  completa congela la máquina del dev y es trabajo del cierre, no de un revisor.
- **Nunca escribir en una base de datos ni levantar servicios** (DevHost, `docker`, `npm run dev`,
  servidores de prueba). Leés código; no cambiás estado.
- **No consultar bases compartidas o remotas.** Las connection strings de `appsettings.*` suelen
  apuntar a staging o a bases de otros equipos: si no es una base local (`localhost`, `127.0.0.1`,
  `(local)`, `.`), no te conectes — verificá contra las migraciones del repo y decí que no pudiste
  verificar contra la base.

## Inputs

- `proposal_path` — path al PDF firmado del cliente. Default: el PDF de `specs/planning-artifacts/comercial/` (si hay más de uno, el que diga ser la versión firmada; si no se puede saber cuál es, pedirlo).
- `plan_path` — path al plan actual. Default: el plan de sprints publicado en `specs/demos/` (PDF o HTML; si hay más de uno, el más reciente, diciendo cuál se usó).
- `sprint_plan_md` — path al sprint-plan.md. Default: `specs/planning-artifacts/sprint-plan.md`.
- `sprint_status` — path al `sprint-status.yaml`. Default: `specs/planning-artifacts/sprint-status.yaml` (si existe).
- `stories_dir` — path a la carpeta de stories. Default: `specs/stories/`.
- `crs_dir` — registry de Change Requests. Default: `specs/planning-artifacts/change-requests/`.

## Catálogo de reglas

**Cada finding DEBE citar el rule ID**. Formato del finding:
```
[<RULE-ID>] `<file>:<line>` <descripción corta>. Fix: <acción concreta>.
```

### CRITICAL

| ID | Regla | Patrón detectado |
|---|---|---|
| **SCOPE-C1** | Entregable firmado sin ninguna story que lo cubra | El cliente firmó algo que hoy nadie está construyendo. Por cada sprint del texto firmado, los bloques `Entregable:` / `Gate de aceptación:` y sus referencias de AC (`AC §18 #NN`) no tienen NINGUNA story asociada en `stories_dir` — ni por `signed_ac_ref` que cite esa referencia, ni por título/ACs que contengan el ancla. El match es **semántico, no literal**: \"panel de solicitudes urgentes en P2\" y \"visualización de pedidos con prioridad en P2\" son el mismo entregable. Fix: declarar la cobertura en el `signed_ac_ref` de la story que ya lo cubre, crear la story faltante, o registrar el CR si el cliente aceptó por escrito no entregarlo. |
| **SCOPE-C2** | `change_request_ref` que apunta a un CR inexistente, rechazado o **todavía sin decidir** | La story dice \"esto lo autorizó un cambio aprobado\" y ese cambio no existe, fue rechazado, o sigue pendiente de la decisión del cliente. **Los tres sub-casos son CRITICAL**: citar un cambio aprobado que no existe es tan grave como no citar ninguno — en los dos el alcance firmado se movió sin respaldo. Fix: apuntar al CR vigente, obtener la aprobación escrita del cliente, o revertir el `sprint` al `signed_for_sprint` mientras tanto. |
| **SCOPE-C3** | CR `approved` sin evidencia verificable de la decisión del cliente | El papel dice \"aprobado\" pero no hay mail, firma ni captura que lo respalde: es un sello puesto por nosotros mismos. `decision_evidence:` nulo, vacío, o texto genérico sin referencia verificable (sin fecha, sin asunto de mail, sin nombre de archivo/adjunto). También cae acá `date_decided:` ausente o anterior a `date_proposed:`. Fix: adjuntar la evidencia real (asunto + fecha del mail del cliente, o el archivo firmado) o bajar el CR a `proposed` hasta tenerla. |
| **SCOPE-C4** | Story que cubre un entregable firmado, **nacida** directamente en otro sprint | La story no *se movió* — nació en el sprint equivocado, así que no hay `signed_for_sprint` que contradiga nada y `VAL-C7` no ve nada. Es la mitad del desvío de alcance que `VAL-C7` no puede ver. Fix: backfillear `signed_for_sprint` + `signed_ac_ref` y mover la story al sprint firmado, o tramitar el CR. |
| **SCOPE-C5** | Veredicto emitido sin haber podido leer los insumos firmados | El auditor no pudo abrir el documento firmado (no está, falta `pdftotext`, el texto salió vacío) o no hay stories parseables, y aun así iba a decir \"todo en orden\". Con 0 sprints extraídos el cross-check devuelve 0 divergencias y eso se convierte en PASS: **el control que no corrió se ve idéntico al control que salió limpio**. Fix: instalar `poppler` (`brew install poppler`), corregir el `proposal_path`, o pasar el texto ya extraído (`.txt`). Cuando dispara, el veredicto obligatorio es **INCONCLUSO** — nunca PASS. |
| **SCOPE-C6** | Las fuentes del plan actual se contradicen entre sí | El sprint de una story dice una cosa en el frontmatter y otra en el plan de sprints o en `sprint-status.yaml`; el auditor elige una en silencio y el veredicto queda decidido por esa elección. Sin esta regla, `VAL-C7`, `SCOPE-C1` y `SCOPE-C4` pueden dar veredictos opuestos según qué archivo se consultó. Fix: sincronizar `sprint-plan.md` / `sprint-status.yaml` con el frontmatter, o corregir el frontmatter si el equivocado es ése. |

### WARNING

| ID | Regla | Patrón detectado |
|---|---|---|
| **SCOPE-W1** | Story agregada que parece alcance nuevo, no infraestructura | Apareció trabajo que el cliente no firmó y que tampoco es plomería interna. Story presente en el sprint N del plan actual que no matchea ningún entregable/gate firmado de N (el complemento de `SCOPE-C1`) **y** no clasifica como infra por señales del frontmatter/título (`test`, `coverage`, `refactor`, `closure`, `chore`, `infra`, `spike`, `bugfix`, o `followup_of:` presente → NO es finding). Fix: registrar el CR (o la nota comercial) que respalda la feature, o reclasificarla si es infra. |
| **SCOPE-W2** | Divergencia justificada sólo con `signed_scope_notes` | Alguien declaró por escrito que la diferencia contra lo firmado es legítima; se acepta, pero queda registrada para que la vea una persona. Story con `sprint` ≠ `signed_for_sprint`, sin `change_request_ref`, **con** `signed_scope_notes:` no vacío. Es el escape declarado de `VAL-C7` — degrada la severidad, no la silencia. Fix: ninguno automático; es ítem de revisión humana del audit. Si la nota resulta insuficiente, se convierte en CR. |
| **SCOPE-W3** | `signed_ac_ref` que no se encuentra en el documento firmado | La story dice citar textualmente lo que el cliente firmó y esa cita no aparece en el documento. Normalizar la cita (minúsculas, colapsar espacios, quitar acentos y `§`/`#`) y buscar sus anclas (la referencia de AC + ≥1 sintagma de ≥3 palabras) sobre el texto extraído de la propuesta. También cae acá la referencia de AC que existe pero apunta a un sprint distinto al `signed_for_sprint` declarado. Fix: corregir la cita con el texto real del PDF firmado. |
| **SCOPE-W4** | Cambio de alcance documentado como nota suelta, sin CR formal | El cambio está \"explicado\" en el plan de sprints en vez de estar registrado donde se audita. Texto en `sprint-plan.md` / `sprint-status.yaml` que describe un movimiento de scope (`movid[ao] a Sprint`, `postergad[ao]`, `cambio de alcance`, `change request`) y (a) no nombra ningún `CR-NNN`, o (b) nombra uno sin archivo en `crs_dir`. Fix: crear la entrada formal en `change-requests/` con el template y dejar la nota apuntando a ella. |

### Regla compartida que este advisor también corre

- **`VAL-C7`** — story con `signed_for_sprint: N` y `sprint: M` (M ≠ N) sin `change_request_ref` a un CR aprobado.
  **Owner: `tycon-story-validator`** (lo corre per-story dentro del pipeline); este advisor lo **co-enforcea** a nivel global, sobre todas las stories del repo a la vez. El ID **no** se renombra a `SCOPE-*`: es la misma regla, con dos puntos de aplicación.

## Detección concreta — SCOPE-C1

1. Del texto extraído de la propuesta firmada (`proposal_path`, vía `pdftotext -layout`), tomar por cada sprint el bloque `Entregable:` y `Gate de aceptación:`.
2. Extraer los sustantivos-ancla de cada entregable/gate (ej. \"panel de solicitudes urgentes en P2\", \"reporte de trazabilidad exportable\") y las referencias de AC (`AC §18 #NN`).
3. Buscar en `stories_dir` (`specs/stories/**.md`): match por `signed_ac_ref` que cite esa referencia de AC, o por `title`/ACs que contengan el ancla.
4. **Finding** si un entregable/gate firmado no tiene NINGUNA story asociada, en ningún sprint.

⚠️ El paso 3 es **comprensión de lenguaje, no regex**: un entregable parafraseado en la story (mismo contenido, otras palabras) **no** es un finding. Un entregable ausente con una story de nombre parecido **sí** lo es.

## Detección concreta — SCOPE-C2

1. Por cada story con `change_request_ref: CR-NNN` en el frontmatter.
2. Buscar `<crs_dir>/cr-NNN-*.md`.
3. **Finding CRITICAL** si:
   - (a) el archivo no existe;
   - (b) existe con `status:` ∈ {`rejected`, `superseded`};
   - (c) existe con `status: proposed` (decisión del cliente todavía pendiente — el cambio se ejecutó antes de tener la aprobación);
   - (d) su `affected_stories:` no incluye el id de la story que lo cita;
   - (e) tiene `superseded_by: CR-MMM` no nulo (el CR vigente es otro y la story cita el viejo).
4. Sólo un CR **existente, `approved`, vigente y que nombra a la story** deja de ser finding — y aun así pasa por `SCOPE-C3` (evidencia).

## Detección concreta — SCOPE-C3

1. Por cada `<crs_dir>/cr-*.md` con `status: approved` que sea citado por alguna story.
2. Leer `decision_evidence:`. **Finding** si es `null`, vacío, o texto genérico sin referencia verificable (sin fecha, ni asunto de mail, ni nombre de archivo/adjunto).
3. Chequeo complementario: `date_decided:` ausente o anterior a `date_proposed:`.

## Detección concreta — SCOPE-C4

1. Por cada entregable/gate firmado del sprint N (mismo insumo que `SCOPE-C1`), buscar la story que lo cubre (match por `signed_ac_ref`, por título, o por referencia `AC §18 #NN` en el cuerpo).
2. **Finding** si esa story tiene `sprint: M` con M ≠ N **y** no declara `signed_for_sprint` (si lo declarara, el caso es `VAL-C7`) **y** no tiene `change_request_ref` a un CR aprobado.
3. **Anti-falso-positivo obligatorio**: excluir splits internos (`X.Y.Z` cuyo padre `X.Y` sí declara `signed_for_sprint: N`), stories con `followup_of:` a una padre firmada, y stories de test/coverage/refactor. Toda story hija que vive en otro sprint *parece* nacida en el sprint equivocado y no lo es.

## Detección concreta — SCOPE-C5

Auto-chequeo: **corre siempre, y primero**, antes de cualquier cross-check.

1. `proposal_path` resuelto y legible; si es PDF, `pdftotext -layout` disponible y su salida > 0 bytes.
2. La extracción del §1 produjo **≥1 sprint** con al menos `Entregable` o `Gate`.
3. `stories_dir` existe y contiene ≥1 story con frontmatter parseable.
4. **Finding** si cualquiera de las tres falla → veredicto **INCONCLUSO**, nombrando qué insumo faltó.

⚠️ Calibración: un `.txt` ya extraído (sin PDF ni `pdftotext` en la máquina) **cumple** el paso 1 — el insumo es el texto, no el formato. Un INCONCLUSO crónico es peor que el PASS falso: se lee como \"esta herramienta no anda\".

## Detección concreta — SCOPE-C6

1. Construir el sprint de cada story desde las 3 fuentes declaradas como input: frontmatter `sprint:` de la story · sección `## Sprint N` de `sprint_plan_md` · `sprint_status` (si existe).
2. **Finding** por cada story donde dos fuentes disponibles discrepen.
3. **Precedencia declarada para el resto del audit**: el **frontmatter de la story manda** (es lo que leen las tools del arnés); las otras fuentes son derivadas.

## Flujo

1. **Auto-chequeo de insumos** (`SCOPE-C5`) — si falla, INCONCLUSO y se corta acá.
2. **Extraer scope firmado**: `pdftotext -layout <PDF> -` → sección \"Plan de Sprints\" → por sprint: número, duración, **Entregable**, **Gate de aceptación** → mapa `signed_scope[sprint_N]`.
3. **Extraer plan actual**: el plan de sprints publicado (PDF o HTML) + frontmatter de cada story (`sprint`, `signed_for_sprint`, `signed_ac_ref`, `change_request_ref`, `signed_scope_notes`, `followup_of`) + `sprint_plan_md` + `sprint_status` → mapa `actual_plan[sprint_N]`, con `SCOPE-C6` sobre las fuentes.
4. **Aplicar el catálogo de reglas** de arriba, regla por regla, sobre los dos mapas + el registry de CRs.
5. **Emitir findings** con rule ID citado, agrupados por severidad.

## Output

**Cada item del reporte DEBE citar el rule ID entre corchetes** al inicio.

```markdown
# tycon-signed-scope-audit

**Status**: 🔴 {N} CRITICAL / 🟡 {N} WARNING
**Sprints firmados leídos**: {count} · **Stories evaluadas**: {count}

## 🔴 CRITICAL

- [SCOPE-C2] `specs/stories/2-8-recepcion-urgentes.md:9` `change_request_ref: CR-009` no existe en `change-requests/`. Fix: apuntar al CR vigente o revertir `sprint` a 2.
- [SCOPE-C1] propuesta firmada, Sprint 2 gate — \"panel de solicitudes urgentes pendientes en P2\" no tiene story en ningún sprint. Fix: declararlo en el `signed_ac_ref` de 2.2 si ya lo cubre, o crear la story.

## 🟡 WARNING

- [SCOPE-W1] `specs/stories/4-2-exportador-excel.md` en Sprint 2 sin correlato en lo firmado y sin señales de infra. Fix: registrar el CR que la respalda.

## ✅ OK
- Los 6 entregables firmados restantes tienen story asociada
- CR-007 aprobado con evidencia (mail 12-may, asunto citado)
- Frontmatter, sprint-plan.md y sprint-status.yaml coinciden en las 14 stories
```

## Veredicto

- **INCONCLUSO** si disparó `SCOPE-C5` — precede a todo lo demás; nunca se degrada a PASS.
- **PASS** si 0 CRITICAL.
- **WARNING** si 0 CRITICAL pero >0 WARNING.
- **FAIL** si >0 CRITICAL. Listar las acciones requeridas para que pase.

## Regla de citación

**Si emitís un finding sin rule ID, el advisor tiene un bug.** El dev debe poder siempre:

1. Ver el rule ID en el reporte (ej: `SCOPE-C2`)
2. Buscar ese ID en este mismo archivo (sección \"Catálogo de reglas\")
3. Entender exactamente qué regla se aplicó

Si el patrón detectado no matchea ninguna regla del catálogo, **no emitir finding** — el advisor solo reporta reglas conocidas. Reglas nuevas se agregan acá primero (y al catálogo maestro).

🔴 **Los corchetes marcan un HALLAZGO REAL, y sólo eso** (2026-08-21):

- **Un finding se escribe SIEMPRE así**: `- [SCOPE-C2] \\`archivo:línea\\` descripción. Fix: acción.`
  Bullet, rule ID entre corchetes, al inicio. Sin variantes.
- **Una regla que evaluaste y DESCARTASTE se nombra SIN corchetes**: `- VAL-C7 — no aplica: la story
  declara change_request_ref y el CR está aprobado.` Nunca `- [VAL-C7] ... no aplica`.
- **Prohibido enumerar cada chequeo aplicado con corchetes.** Un reporte que lista
  `[SCOPE-C1] no aplica finding · [SCOPE-C2] no aplica finding · …` convierte cada regla descartada
  en algo indistinguible de un hallazgo. Si querés dejar constancia de lo revisado, va sin corchetes
  y bajo un encabezado `## ✅ OK`.

**Por qué es una regla dura y no una preferencia de formato:** lo consume un parser —el banco de
controles decide \"esta regla disparó / no disparó\" por la presencia del ID entre corchetes al inicio
de un bullet. Con la convención invertida, un audit que encontró una divergencia real se lee como
ocho hallazgos falsos y el hallazgo verdadero se pierde. El modo de falla típico: detectar `VAL-C7`
correctamente pero escribirlo como ``**`VAL-C7`**`` y poner entre corchetes las reglas descartadas.

## Anti-patterns (lo que NO hace)

- NO modifica filesystem. Solo reporta.
- NO crea CRs automáticos. Eso requiere decisión humana + cliente.
- NO infiere `signed_for_sprint` para stories que no lo declaran — ese backfill es `VAL-W8`, del validator.
- NO emite findings sin rule ID.
- NO convierte el match entregable↔story en un regex literal: parafrasear no es divergencia.

## Limitaciones conocidas

- Requiere `pdftotext` instalado (en macOS: `brew install poppler`) **si el insumo es PDF**. Con el texto ya extraído (`.txt`) no hace falta. Que falte no produce PASS: produce `SCOPE-C5` + INCONCLUSO.
- Heurística de \"AC firmado\" basada en regex sobre badges (\"NUEVA V6/V7\") + referencias §18 — puede tener falsos negativos si la story no usa esos patterns.

**Qué NO cubre ninguna regla `SCOPE-*`** (declarado a propósito, para que la ausencia no se lea como limpieza):

- **Cambios sutiles DENTRO de un AC** (ej. \"200 OK con persistencia transaccional\" degradado a \"200 OK\"). El cross-check es a nivel scope/sprint, no AC-level. `SCOPE-W3` sólo detecta que la cita dejó de existir, no que su contenido se ablandó.
- **Story firmada sin `signed_for_sprint` declarado** — eso es `VAL-W8` (del validator), fuera del namespace `SCOPE-*`.
- **Nivel INFO**: las stories agregadas que son infra/test/refactor/split interno son legítimas y **no reciben rule ID** (el catálogo sólo tiene severidades `C` y `W`). Se listan como texto sin ID en la sección ✅ OK.

