- [SPEC-C1] `ejemplo/RutaDeEjemplo.cs:NN` endpoint nuevo `GET /api/ejemplo/{id}` no mencionado en el spec. Buscado en la story: 0 matches para la ruta ni para el handler name. Fix: actualizar el AC con verbo + ruta + response shape ANTES de codear.
- [SPEC-C9] `ejemplo/RepositorioDeEjemplo.cs:NN` el diff agrega un predicado de scoping por inquilino a una consulta cuyo resultado llega a la UI, y ningún AC lo declara. Fix: agregar al AC la regla de visibilidad.

## 🟡 WARNING ({N})

- [SPEC-W1] `ejemplo/ComponenteDeEjemplo.tsx:NN` comentario `// TODO update spec` indica drift declarado. Fix: actualizar el AC + remover el TODO antes de marcar `review`.

## ✅ OK

- SPEC-C6 — insumos completos: story legible con 9 ACs numerados, 14 archivos en el diff.
- SPEC-C2, SPEC-C7 — sin componentes ni hooks nuevos fuera del spec.
- SPEC-C4 — los 2 ACs con condición compuesta evalúan todos sus predicados.
```

## Veredicto

- **INCONCLUSO** si disparó `SPEC-C6` — precede a todo lo demás; nunca se degrada a 🟢 OK ni a PASS.
- **PASS** si 0 CRITICAL.
- **WARNING** si 0 CRITICAL pero >0 WARNING.
- **FAIL** si >0 CRITICAL. Listar las acciones requeridas para que pase.

## Regla de citación

**Si emitís un finding sin rule ID, el advisor tiene un bug.** El dev debe poder siempre:

1. Ver el rule ID en el reporte (ej: `SPEC-C9`).
2. Buscar ese ID en este mismo archivo (sección \"Catálogo de reglas\").
3. Entender exactamente qué regla se aplicó.

Si el patrón detectado no matchea ninguna regla del catálogo, **no emitir finding** — el advisor solo reporta reglas conocidas. Reglas nuevas se agregan acá primero (y al catálogo maestro).

🔴 **Los corchetes marcan un HALLAZGO REAL, y sólo eso** (2026-08-21):

- **Un finding se escribe SIEMPRE así**: `- [SPEC-C1] \\`archivo:línea\\` descripción. Fix: acción.`
  Bullet, rule ID entre corchetes, al inicio. Sin variantes.
- **Una regla que evaluaste y DESCARTASTE se nombra SIN corchetes**: `- SPEC-C9 — no aplica: el único
  predicado agregado es el lookup por clave primaria.` Nunca `- [SPEC-C9] … no aplica`.
- **Prohibido enumerar cada chequeo aplicado con corchetes.** Un reporte que lista
  `[SPEC-C1] sin hallazgos · [SPEC-C2] sin hallazgos · …` convierte cada regla descartada en algo
  indistinguible de un hallazgo. Si querés dejar constancia de lo revisado, va sin corchetes y bajo
  un encabezado `## ✅ OK`.

**Por qué es una regla dura y no una preferencia de formato:** lo consume un parser —el banco de
controles decide \"esta regla disparó / no disparó\" por la presencia del ID entre corchetes al inicio
de un bullet. Con la convención invertida, un chequeo que encontró un scope creep real se lee como
nueve hallazgos falsos y el hallazgo verdadero se pierde. El modo de falla típico: detectar la
regla correctamente pero escribirla sin corchetes y poner entre corchetes las que se descartaron.

## Anti-patterns (lo que NO hace este advisor)

- **NO valida tests** (eso es `tycon-plugin-tests-coverage` + `tycon-ac-coverage-checker`).
- **NO valida wiring** (mount/callsite — eso es `tycon-feature-wiring-checker`).
- **NO valida convenciones de código** (eso es `tycon-plugin-{dotnet|react}-conventions`).
- **NO bloquea WARNINGs** (`SPEC-W1..W7` son advisory).
- **NO reescribe el spec** — solo reporta gaps; el dev/agent humano actualiza la story.
- **NO emite findings sin rule ID.**
- **NO entiende semántica profunda** — heurística grep + parsing simple. Falsos positivos posibles cuando el spec usa sinónimos o cuando un endpoint se renombra internamente sin cambiar la ruta pública. El único override es el marcador de `SPEC-W6`; no hay otro.

### Qué NO cubre ninguna regla `SPEC-*` (limitaciones declaradas)

Se declaran explícitamente para que no vuelva el modo \"no lo detecta y nadie sabe que no lo detecta\":

- **Mount de un componente que YA existía** y no está descrito en el spec: `SPEC-C2` exige archivo NEW. Eso es de `tycon-feature-wiring-checker`.
- **El ORDEN real spec→código**: este advisor no tiene acceso a git y no puede probar qué se escribió primero. `SPEC-W5` detecta sólo su huella barata (un AC que cambió sin dejar rastro), y por eso es WARNING y no CRITICAL.
- **Sinónimos y paráfrasis**: si el AC dice \"el listado se acota al inquilino\" y el código dice `TenantId`, el match es comprensión de lenguaje, no regex. Leé el AC, no lo grepees literal — es donde `C7`/`C8`/`C9` producen falsos negativos si se aplican como patrón ciego.
- **Dependencias nuevas y settings de despliegue**: fuera de alcance (ya las cubren otros controles).

## Integración con el pipeline

### Modo pre-coding (Step 4 pre-flight)

1. BMAD genera el plan (Step 2/3) y el usuario lo aprueba.
2. **ANTES de invocar el ejecutor BMAD en Step 4**: si el plan menciona endpoints/componentes/hooks/contratos/filtros nuevos → invocar este advisor en modo `pre-coding` con el plan textual.
3. Si hay CRITICAL → pausar Step 4, mostrar findings, preguntar: ¿actualizar el spec primero, o marcar la exención?
4. Si el user actualiza el spec → re-run.
5. Si el user exime un hallazgo → **el override se escribe como marcador `// @spec-first-exempt(SPEC-CN): <razón>`** (o en el frontmatter de la story). Un override sin marcador no existe: sin rastro, el hallazgo vuelve a salir en la próxima corrida y nadie puede auditar por qué se descartó.

**Caller del Step 4 pre-flight** pasa: `story_path`, `proposed_diff` (o resumen del plan textual), `phase: \"pre-coding\"`.

### Modo post-implementation (Step 5 paralelo)

Se invoca en paralelo con los otros advisors post-build. Detecta el caso donde la coding phase YA pasó sin pre-flight (spike, fix urgente) y el spec no se actualizó.

**Caller del Step 5** pasa: `story_path`, `modified_files`, `repo_path`, `phase: \"post-implementation\"`.

