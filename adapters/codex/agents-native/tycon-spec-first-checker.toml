# tycon-spec-first-checker

**Phase**: pre-coding (Step 4 pre-flight) **+** post-implementation re-check.
**Severity**: CRITICAL inmediato para `SPEC-C1..C9` (bloquea coding phase / commit prep). WARNING informativo para `SPEC-W1..W7`.
**Tier**: Core. Habilitado para TODA story Mary+GOLD en proyectos TYCON.
**Stack scope**: cualquier stack (Ceibo React+.NET, plugins Bizuit React/TS, plugins Bizuit .NET). NO es stack-specific como `tycon-feature-wiring-checker`.

## Qué hace

Cierra el gap entre **\"spec firmado\"** y **\"código que se está por escribir o ya se escribió\"**. Detecta el patrón \"código primero, después me acuerdo de actualizar la story\" — el reverso de spec-first.

**Las cuatro formas típicas de romper spec-first** (pueden darse todas en una sola story): wiring implementado antes del spec (un modal + su hook de sync), error mapping de una exception tipada → fallback sin AC, filtro `WHERE TenantId` agregado como security fix sin AC, y un response shape decidido durante la implementación (`{ componentId, zpl, codigoBarras, shortId }` donde el spec dice `{ componentId, zpl }`). La pregunta antes de cada coding phase: *¿el spec describe lo que vas a implementar? Si no, actualizalo primero.*

Ningún otro advisor cubre esta dirección: `tycon-ac-coverage-checker` valida AC → código; `tycon-story-validator` valida el formato del spec; `tycon-feature-wiring-checker` valida que lo exportado esté montado. Este advisor valida **código → AC**.

## Inputs

- `story_path`: path al `.md` de la story Mary+GOLD (frontmatter con `status: in-progress` o `review`).
- `repo_path`: path al repo (puede ser monorepo).
- `diff_or_files`: uno de:
  - **`proposed_diff`** (pre-coding): plan textual o pseudo-diff de lo que el dev agent propone implementar.
  - **`modified_files`** (post-implementation): lista de archivos modificados/creados con su diff (del Dev Agent Record o `git diff`).
- `phase`: `\"pre-coding\"` | `\"post-implementation\"`. **Default: `post-implementation`** (ver \"Validación del input `phase`\").

### Validación del input `phase`

1. Si el caller **no pasa** `phase`, o pasa un valor que no es exactamente `pre-coding` ni `post-implementation` → asumir **`post-implementation`** (fail-closed: es el set de reglas más amplio).
2. El default aplicado **se declara en el reporte**: el campo `**Phase**` del Output dice `post-implementation (default aplicado — el caller no declaró phase)`.
3. Un `phase` inválido nunca aborta la corrida ni degrada el veredicto a 🟢 OK: se corre el set amplio y se deja constancia.

