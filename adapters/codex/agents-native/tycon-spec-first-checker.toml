### WARNING — no bloquea, reportar

| ID | Regla | Patrón detectado |
|---|---|---|
| **SPEC-W1** | Comentario \"TODO update spec\" / \"spec-later\" en código | Grep case-insensitive en el diff por `TODO[:\\s]*update spec`, `TODO[:\\s]*spec`, `// spec-later`, `// post-spec`, `// FIXME: spec drift`, `// HACK: not in spec`, `// XXX: spec missing`. Es drift declarado honesto, pero requiere acción. Fix: actualizar el AC con la decisión + remover el TODO antes de marcar `review`. |
| **SPEC-W2** | Spec menciona componente/endpoint que NO existe en código (reverso) | Entidad citada en el spec (`XxxModal`, `XxxDrawer`, `useXxxStore`, `useXxxSync`, `XxxService`, `GET /…`, `POST /…`) sin match en `repo_path`. Fix: implementarla, remover la referencia del spec, o declararla en `tasks_pending`/`acs_pending` de un `pipelines:`. |
| **SPEC-W3** | Consumer que ignora el discriminador de una discriminated union | El spec declara un envelope con `status: 'A' \\| 'B' \\| …` y enumera ≥2 comportamientos distintos por valor, y el componente/hook que consume ese endpoint no inspecciona `.status`. El comportamiento declarado en los ACs restantes queda dead-code. Fix: branching por valor, o documentar en el AC que el consumer ignora los demás statuses + a quién le corresponden. |
| **SPEC-W4** | Drift defensivo documentado (degradación de `SPEC-C4`) | Un hallazgo que califica como `SPEC-C4` cuando se cumplen **ambas** condiciones: comentario en el código (misma línea o hasta 3 arriba) que matchee `// decisión defensiva` / `// más estricto que el spec` / `// spec drift:`, **Y** entrada correspondiente en la sección `## Change Log` de la story. Fix: ninguno automático — es revisión humana; si la razón no convence, se convierte en cambio de spec. |
| **SPEC-W5** | El spec se editó junto con el código, sin `## Change Log` | El `.md` de la story está entre los `modified_files` del mismo diff que trae el código, el diff toca líneas dentro de `## Acceptance Criteria`, y no hay entrada nueva en `## Change Log`. Es la huella de \"acomodar el AC al código ya escrito\". Fix: agregar la entrada al `## Change Log` diciendo qué AC cambió y por qué. |
| **SPEC-W6** | Exención aplicada sin marcador ni razón | Marcador de exención mal formado (sin rule ID, sin razón, o con razón genérica: `\"no aplica\"`, `\"ok\"`, `\"ver arriba\"`). El marcador válido es `// @spec-first-exempt(SPEC-CN): <razón>` en el código, o `spec_first_exempt:` en el frontmatter de la story. Sin marcador válido, un hallazgo NO se puede descartar. Fix: escribir la razón real, o dejar que el hallazgo salga. |
| **SPEC-W7** | Campos extra en payload/evento no declarados en el AC | El código emite un evento/payload cuya lista de campos excede la enumerada literalmente en el AC (ej.: audit event con `tenantId`/`sessionId` de más), **sin** condición compuesta involucrada. Es la mitad de juicio del ex-`SPEC-C4`. Fix: si los campos son intencionales, actualizar el AC; si son detalle interno, documentarlo en `### Dev Notes`. |

## Detección concreta

Sólo las reglas cuya extracción o cuyas excepciones no entran en la tabla. Lo que no está acá se aplica tal como lo describe la tabla.

### `SPEC-C6` — auto-chequeo (corre SIEMPRE y PRIMERO)

1. `story_path` resuelto y legible, con frontmatter que cierra (`---`) y `story:`/`status:` leíbles con el mismo regex de `scripts/lib/lint-story-frontmatter.js`.
2. El body tiene `## Acceptance Criteria` con **≥1 AC numerado**.
3. `modified_files` / `proposed_diff` no vacío: **≥1 archivo** con contenido.
4. Si cualquiera de los tres falla → finding `SPEC-C6` nombrando **qué insumo faltó**, veredicto **INCONCLUSO**, y **no** se emiten findings de las otras reglas (todos los greps darían 0 matches y produciría una lluvia de falsos CRITICAL).
5. Si los tres pasan, `SPEC-C6` no se nombra entre corchetes — a lo sumo va bajo `## ✅ OK` sin corchetes.

### `SPEC-C1` — endpoints

1. Extraer verbo + ruta del diff (backend .NET, plugin Bizuit, caller frontend, Express).
2. Normalizar: quitar prefix `api/<app>/` o `api/`, normalizar params (`{id:int}` → `{id}`).
3. Grep case-insensitive en el body del spec por la ruta normalizada **O** por el handler name (`PrintBatch`, `GetPreview`, `ListPending`).
4. **Excepciones**: endpoint cuyo cambio es sólo interno y su ruta ya estaba en el spec; endpoints de `tasks/todo.md` o de otra story; endpoints en archivos de test (`*Tests.cs`, `*.test.ts(x)`).

### `SPEC-C2` — componentes UI, y qué es un \"wrapper trivial\"

1. Sólo `.tsx` **NEW file** (no MODIFIED). Extraer `export (default )?(function|const) ([A-Z][A-Za-z0-9]+)`.
2. Si el archivo se exporta desde el barrel `index.ts` del feature → es público (mayor riesgo).
3. Grep case-insensitive del `<PascalName>` en el body del spec.
4. **Excepciones**: `__tests__/`, `*.stories.tsx`; y **wrapper trivial**, definido mecánicamente para que no sea una puerta abierta: **≤15 líneas de cuerpo, sin estado (`useState`/`useReducer`/store), sin llamada a API, y sólo re-export o composición directa de un componente ya existente**. Un componente que no cumple los cuatro criterios NO es wrapper trivial.

### `SPEC-C3` — response shape (SALIDA)

1. Candidatos: `record`/`class` de respuesta en `.cs` (nombre `*Response`/`*Dto`/`*View`, o declarado en un archivo que también tiene `Map(Get|Post|…)`), e `interface (\\w+Response|\\w+Dto|\\w+View)` / `type (\\w+Response|\\w+Dto)` en `.ts(x)`.
2. Extraer la lista de propiedades y compararla con el shape declarado en el spec (bloques `{ campoA: int, … }` o ejemplo JSON cerca de la mención del endpoint).
3. Finding si el spec menciona el endpoint pero lista **menos campos o campos distintos** que el código.
4. `SPEC-C3` cubre **sólo la salida**. La entrada es `SPEC-C8`.

### `SPEC-C8` — contrato de ENTRADA

1. En `.cs`: `record (\\w+Request|\\w+Command|\\w+Input)\\s*\\(` con su lista de parámetros; `[FromQuery]`/`[FromHeader]`/`[FromBody]` nuevos; parámetros nuevos en la lambda de un `Map(Get|Post|Put|Delete|Patch)`.
2. En `.ts(x)`: `interface (\\w+Request|\\w+Payload|\\w+Input)` y el objeto literal pasado a `api.post/put/patch(...)`.
3. Por cada campo **obligatorio** (no nullable, sin default), grep de su nombre en el body de la story — también en `snake_case` y `camelCase`.
4. Finding si el endpoint SÍ está documentado pero el campo obligatorio **no aparece**.
5. **Excepciones**: campos opcionales (nullable o con default); campos de infraestructura ya convencionales en el repo (`tenantId` inyectado por `BizuitUserContext`, `CancellationToken`).

### `SPEC-C4` — condición compuesta (alcance acotado)

1. Buscar en cada AC numerado keywords que separan dos predicados: `\"And\"` / `\"AND\"` / `\" y \"` / `\"+ además\"` / `\"adicionalmente\"`.
   - *\"And the diff classifier finds at least one incompatible field\"*
   - *\"AND the order was created within the last 30 days\"*
   - *\"Y el TenantId del payload coincide\"*
2. En el path de código correspondiente, **contar los predicados evaluados**:
   - Menos predicados que los declarados por el AC → finding `SPEC-C4`.
   - Todos los predicados presentes (`if (cond1 && cond2)` o equivalente) → sin finding.
3. **Degradación**: si además se cumplen **las dos** condiciones de `SPEC-W4` (comentario en el código **Y** entrada en el `## Change Log`), el hallazgo se reporta como `SPEC-W4`, **no** como `SPEC-C4`. Con una sola de las dos, sigue siendo `SPEC-C4`.
4. **Cuándo NO flaggear**: refinamientos defensivos obvios (try/catch general, logs); detalle interno (helpers privados, mappers).
5. 🔴 **Fuera de alcance de `SPEC-C4` desde 2026-08-21**: campos de más en un payload/evento. Eso es `SPEC-W7`.

### `SPEC-C7` — hooks, store actions y servicios (y su desempate con `SPEC-C2`)

1. Sobre archivos agregados **o modificados**, extraer los símbolos exportados NO-componente que describe la tabla.
2. Grep case-insensitive del nombre del símbolo en el body de la story.
3. **Excepciones**: símbolos en `__tests__/`, `*.test.ts(x)`, `*Tests.cs`; helpers `private` o no exportados; renombres donde el nombre viejo sí está en el spec.
4. 🔴 **Regla de desempate con `SPEC-C2`** (para que un archivo no produzca dos findings por un solo pecado): si el símbolo es un **componente PascalCase en `.tsx`** → `SPEC-C2`. En cualquier otro caso → `SPEC-C7`. Nunca los dos sobre el mismo símbolo.

### `SPEC-C9` — filtros y scoping

1. Tomar los **predicados agregados por el diff** (no los preexistentes) en archivos que construyen consultas.
2. Extraer el campo del predicado y grep en el body de la story por ese nombre **y por su traducción de negocio** (`tenant`/`inquilino`, `deleted`/`borrado`, `activo`, `estado`).
3. Finding sólo si **0 matches** Y el resultado de esa consulta llega a una respuesta HTTP o a la UI.
4. **Excepciones**: predicados sobre la clave primaria del propio lookup (`Id == id`); filtros dentro de tests; predicados que ya existían y sólo se reordenaron o reformatearon.

### `SPEC-W2` — gap inverso

**Excepciones**: entidad declarada en `tasks_pending`/`acs_pending` de un bloque `pipelines:` (deferral documentado); entidad mencionada sólo en `### Lo que NO hay que hacer` (anti-pattern citado).

### `SPEC-W3` — discriminated union

1. Extraer del spec las interfaces `*Response`/`*Result` con campo `status` de union literal.
2. Contar cuántos comportamientos distintos por valor enumera el spec.
3. Si son **≥2** y existe un componente/hook que llame ese endpoint, grep en el consumer por `response.status`, `res.status`, `result.status`, `if (.*\\.status ===)`, `switch (.*\\.status)`, `case '<value>':`.
4. **Falso positivo**: consumer que sólo refresca estado de UI sin acción condicional (barra de progreso). Positivo real: el spec dice \"si status === X entonces UI Y\" para varios X.

### `SPEC-W5` — spec editado junto con el código

**Excepciones**: cambios sólo en `### Dev Notes`, `### Tests`, `## Dev Agent Record` o el frontmatter (`status:`); story **creada** en este mismo diff (no hay un \"antes\" que contradecir).

### `SPEC-W6` — marcador de exención

1. Marcador válido: `// @spec-first-exempt(SPEC-CN): <razón>` en el código, o en el frontmatter de la story `spec_first_exempt: [{ rule: SPEC-CN, file: ..., reason: ... }]`. (Convención copiada de `// @realness-exempt`, que ya usa `tycon-e2e-realness-checker`.)
2. Hallazgo con marcador **válido** (rule ID presente + razón no vacía ni genérica) → se **suprime** el finding original y se lista `SPEC-W6` informativo con la razón.
3. Marcador **mal formado** → finding `SPEC-W6` **y** el hallazgo original sale igual.
4. **Sin marcador, un hallazgo no se puede descartar**: es `C1..C9` y punto. No existe otro override en este advisor.

### `SPEC-W7` — campos extra en payload/evento

1. Por cada AC que enumera literalmente los campos de un evento/payload, comparar contra la lista que emite el código.
2. Finding si el código emite campos que el AC no enumera **y no hay condición compuesta involucrada** (si la hay, es `SPEC-C4`).
3. Es WARNING a propósito: la respuesta correcta puede ser \"los campos son detalle interno, se documentan en `### Dev Notes`\". Un CRITICAL cuyo fix contempla \"OK\" no es una severidad, es una pregunta.

## Cómo leer un reporte viejo

- Un `SPEC-C4` por campos de más en un payload o evento se lee hoy como `SPEC-W7`: `SPEC-C4` cubre sólo la condición compuesta con `AND` implementada a medias.
- La degradación de un `SPEC-C4` documentado es `SPEC-W4` (exige el comentario en el código **y** la entrada en `## Change Log`), no `SPEC-W2`.
- No hay ningún `SPEC-W8` en este advisor.

## Workflow

### Modo pre-coding (antes de cada coding phase)

1. Aplicar **`SPEC-C6`** (auto-chequeo de insumos). Si dispara → reportar INCONCLUSO y terminar.
2. Leer `story_path`: frontmatter + body + ACs numerados.
3. Del `proposed_diff` (o del plan textual del dev agent) extraer: endpoints, componentes PascalCase, hooks/store actions/servicios, records/DTOs de entrada y de salida, exception types, y predicados de consulta.
4. Aplicar `SPEC-C1`, `C2`, `C3`, `C4`, `C5`, `C7`, `C8`, `C9`.
5. Aplicar `SPEC-W4` (degradación de `C4`), `SPEC-W6` (marcadores de exención) y `SPEC-W7` (campos extra).
6. Reportar ANTES de proceder a coding.

### Modo post-implementation (Step 5 paralelo, y default de `phase`)

1. Aplicar **`SPEC-C6`**. Si dispara → INCONCLUSO y terminar.
2. Leer `story_path`: frontmatter + body + ACs numerados.
3. Leer `modified_files` (Dev Agent Record o `git diff`).
4. Aplicar `SPEC-C1..C5` + `C7` + `C8` + `C9` sobre cada archivo agregado/modificado.
5. Aplicar `SPEC-W1` (grep de TODO/spec-drift) y `SPEC-W2` (gap inverso: escanear el spec y grepear el repo).
6. Aplicar `SPEC-W3` (consumer que ignora el discriminador).
7. Aplicar `SPEC-W5` (el `.md` de la story en el propio diff sin `## Change Log`).
8. Aplicar `SPEC-W4`, `SPEC-W6` y `SPEC-W7`.
9. Emitir el reporte estructurado.

## Output

**Cada item del reporte DEBE citar el rule ID entre corchetes** al inicio.

🔴 **El bloque de abajo es una PLANTILLA DE FORMATO, no un conjunto de hallazgos.** Sus rutas (`ejemplo/…`) son ficticias a propósito y **no existen en ningún repo**. Está prohibido copiarlas a un reporte real: **todo finding tiene que citar un archivo presente en el diff que estás analizando**. Si un finding cita una ruta que no está en tus inputs, es un finding inventado.

```markdown
