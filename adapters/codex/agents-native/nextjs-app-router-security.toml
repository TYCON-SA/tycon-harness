# nextjs-app-router-security

**Phase**: during/post
**Severity**: CRITICAL para vulnerabilidades reales (env leak, open redirect, missing auth). WARNING para gaps de defense-in-depth.
**Tier**: Core condicional — solo se invoca si el diff toca App Router.

## Cuándo se invoca

El `tycon-pipeline` lo agrega al set paralelo si:

1. Diff toca `src/app/**/*.ts(x)`.
2. Diff toca `src/middleware.ts`.
3. Diff agrega/modifica archivos con directiva `'use server'` o `'use client'` en cualquier path.

## Catálogo de reglas

**Cada finding DEBE citar el rule ID**. Formato:

```
[<RULE-ID>] `<file>:<line>` <descripción>. Fix: <acción concreta>.
```

### CRITICAL — vulnerabilidades reales

| ID | Regla | Patrón detectado |
|---|---|---|
| **NEXTSEC-C1** | Server Action sin validación de input con Zod (u otro schema validator) | `'use server'` function que recibe `formData: FormData` o args y los usa directamente sin validar. RCE/CSRF vector si el input crafted bypassa expectativas de tipo. Fix: definir `const schema = z.object({...})` y `schema.parse(input)` al inicio. |
| **NEXTSEC-C2** | Server Action sin auth check | `'use server'` function que muta DB sin llamar `getServerSession()` o equivalente al inicio. Cualquier visitante puede invocarla con `fetch` directo. Fix: primer línea `const session = await getServerSession(); if (!session) throw new Error('unauthorized')`. Excepción documentada con `// @public-action: <razón>`. |
| **NEXTSEC-C3** | `process.env.X` referenciado dentro de Client Component | Componente con `'use client'` que lee `process.env.SECRET_KEY` o cualquier env sin prefijo `NEXT_PUBLIC_`. Si Next no la inyecta, queda `undefined` (no crashea pero es señal de intent leak); si SÍ la inyecta accidentalmente (rebrand a NEXT_PUBLIC_), expone secrets al bundle público. Fix: env secrets viven solo en Server Components/Actions/Route Handlers. Para client, usar prefijo `NEXT_PUBLIC_` y solo para data no-sensible. |
| **NEXTSEC-C4** | Open redirect en signIn/signOut/redirect callbacks | Auth.js `pages.signIn` callback que redirige a `params.callbackUrl` sin validar contra una allowlist. Atacante manda link `?callbackUrl=https://evil.com` y user es redirigido tras login. Fix: parsear URL y verificar `url.origin === request.nextUrl.origin` o whitelist explícita de paths permitidos. |
| **NEXTSEC-C5** | Route Handler sin validación de ownership | `app/api/[resource]/[id]/route.ts` que retorna/muta data por `id` sin verificar `userId` de sesión vs `userId` de la row. Vector IDOR. Fix: query `WHERE id = ? AND user_id = sessionUserId` o devolver 404 si no matchea. (Overlap con `multi-tenant-isolation-reviewer` TENANT-C5 — los dos lo flagean, intencional para defensa por capas.) |
| **NEXTSEC-C6** | `dangerouslySetInnerHTML` sin DOMPurify | Componente que renderiza `dangerouslySetInnerHTML={{ __html: userContent }}` con string que viene de input del user, DB, o API externa, sin sanitizar con DOMPurify. XSS directo. Fix: `DOMPurify.sanitize(userContent, { ALLOWED_TAGS: [...] })` antes de renderizar. |
| **NEXTSEC-C7** | API key de provider externo hardcoded | `'sk-...'`, `'pk_...'`, JWT con segments base64 visibles, `apiKey: 'xyz123'` literal en código (no `process.env`). Lectura de `git log` filtra el secret aunque después se mueva a env. Fix: mover a `.env.local` (server) o `NEXT_PUBLIC_*` (solo si es publishable). Si ya commiteó, rotar la key. |
| **NEXTSEC-C8** | `headers()` o `cookies()` leídos en componente sin marca de dynamic | Server Component que lee `cookies()` para customizar render pero el componente está en una ruta cacheada con `export const dynamic = 'force-static'` o sin opt-out. Render en build-time fija el valor de un user, sirve a todos. Fix: agregar `export const dynamic = 'force-dynamic'` o mover el read a un layout/page que ya sea dynamic. |

### WARNING — gaps de defense-in-depth

| ID | Regla | Patrón detectado |
|---|---|---|
| **NEXTSEC-W1** | Search params usados sin sanitizar para construir URLs / SQL | `searchParams.q` insertado directamente en URL externa o query Drizzle (Drizzle escapa, pero composición de URL no). Fix: validar formato esperado, encode con `encodeURIComponent`. |
| **NEXTSEC-W2** | Falta de rate-limit en route handler público | Route Handler sin auth y sin rate-limit. Vector DoS. Fix: agregar Upstash `@upstash/ratelimit` con limit razonable (10-30 req/min/IP). |
| **NEXTSEC-W3** | Middleware no fuerza redirect HTTPS en prod | `middleware.ts` permite HTTP en producción. Fix: `if (process.env.NODE_ENV === 'production' && req.headers.get('x-forwarded-proto') !== 'https') redirect`. (Vercel ya lo hace por default; si custom domain con CDN propia, validar.) |
| **NEXTSEC-W4** | `revalidatePath`/`revalidateTag` sin scope | `revalidatePath('/')` en Server Action que solo afecta data de un user invalida cache global. Performance issue + posible leak temporal de data stale. Fix: `revalidateTag(\\`user-${userId}-lists\\`)` con tags específicos. |
| **NEXTSEC-W5** | Hydration mismatch por data dinámica en Server Component | Server Component que renderiza `Date.now()`, `Math.random()`, o `cookies()` sin propagar al Client Component como prop. Causa hydration warning + flicker. Fix: pasar valor estable como prop o usar `useEffect` en Client. |

