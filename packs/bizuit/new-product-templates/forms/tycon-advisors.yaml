# Config de advisors / evidencia para {{FORMS_REPO}} (los formularios y plugins frontend de {{PRODUCT}}).
#
# 🔴 CADA FORMULARIO ES UNA CARPETA CON SU PROPIO package.json, y React entra como
# `peerDependency` de cada uno: NO figura en el package.json raíz. Consecuencia medida en otro producto el
# 2026-08-25: el cómputo mecánico del set de revisores da "este repo no usa React" para el repo
# entero, así que los revisores de React y de cableado de features no se invocan solos en ningún
# formulario. Hasta que el arnés lo resuelva, en este repo se invocan A MANO.

# ── Cómo llega el trabajo a main ─────────────────────────────────────────────────────────────
# `pr`: /tycon-merge-to-main NO pushea main directo — pushea la rama y crea el Pull Request con
# auto-complete, que se completa solo cuando el pipeline de validación da verde.
# 🔴 La política prohíbe SQUASH a propósito: con squash los commits individuales desaparecen de
# main y las notas de versión —que se arman listando esos commits desde la versión publicada—
# colapsarían a "Merged PR N".
merge:
  mode: pr

# ── Gate E2E ─────────────────────────────────────────────────────────────────────────────────
# Cada formulario con pruebas de punta a punta (Playwright) se declara acá. Sin declararlo, el
# gate no encuentra la evidencia y la matriz por criterio de aceptación da rojo AUNQUE las
# pruebas estén verdes: el resultado queda en el marcador pero no deja artefacto.
# 🔴 Un formulario que tiene specs y no está declarado es peor que uno sin specs: su verde no
# significa nada y nadie se entera. Al crear un formulario con E2E, agregalo en las dos listas.
e2e:
  frontend_dirs: []

# ── Evidencia ────────────────────────────────────────────────────────────────────────────────
# Las historias de los formularios de {{PRODUCT}} viven en {{STORIES_REPO}}/.specs/. Sin declarar el repo
# hermano, la matriz descarta —con razón— la evidencia por ser "de otro repo".
evidence:
  fe_paths: []

# Los repos que una entrega de {{PRODUCT}} puede tocar junta. Rutas relativas al directorio padre.
repo_group: [{{BACKEND_REPO}}, {{STORIES_REPO}}]

# El paquete bizuit del arnés: suma los revisores de convenciones de plugins y formularios BIZUIT.
packs: [bizuit]
