# Pipeline del repo de ESPECIFICACIONES — una sola etapa: el portón de controles del arnés.
#
# 🔴 POR QUÉ EXISTE ESTE ARCHIVO (2026-08-31)
#
# El portón (`tycon-ci-gate.js`) revisa las stories que un cambio declara `review`/`done` y exige
# su evidencia en el repo. Se había instalado sólo en los repos de CÓDIGO — pero las stories no
# viven ahí: viven acá. Medido el 2026-08-31 en los productos del equipo que escribió esta
# plantilla: cientos de stories fuera de alcance, y en un producto el desbalance era TOTAL —más de
# cien stories en el repo de historias y **0** en sus repos de código. Poner el portón sólo allá
# habría sido verde permanente vigilando nada.
# En esos repos el portón corría, no encontraba nada, y salía VERDE — que es el
# modo de falla exacto contra el que el arnés escribe sus reglas: "0 hallazgos" se lee como
# "salió limpio" cuando en realidad no había nada que mirar.
#
# Este repo no compila nada, así que el pipeline no construye ni despliega: sólo el portón y, desde el
# 2026-10-04, el buscador de secretos sobre lo que trae cada pedido (job SecretScan, al final).
#
# 🔴 `trigger: none` + `pr: none` A PROPÓSITO. Este pipeline NO se dispara solo: lo encola la
# política de rama ("Build validation") cuando se abre un Pull Request contra main. Declarar un
# disparador además de la política haría DOS corridas por cada PR, y una corrida sobre main no
# tendría nada que juzgar (el portón compara un diff contra la rama destino de un PR).
trigger: none
pr: none

# El arnés no llega como recurso de Azure: cada etapa que lo usa lo clona de su repo público, sin
# credencial (paso 'Fetch harness (public GitHub, no credentials)'). Por eso la identidad de compilación
# no necesita lectura sobre ningún repo del arnés ni autorizar un recurso.

variables:
  # De dónde se baja el arnés: su repo público y la rama. Un fork propio del arnés se apunta acá;
  # el resto del pipeline no cambia.
  harnessRepoUrl: 'https://github.com/TYCON-SA/tycon-harness.git'
  harnessRef: 'main'

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: HarnessGate
    displayName: 'Controles del arnés (solo PRs)'
    dependsOn: []
    condition: eq(variables['Build.Reason'], 'PullRequest')
    jobs:
      - job: TyconGate
        displayName: 'tycon-ci-gate (bloqueante)'
        steps:
          # El arnés llega por clon (abajo), no por checkout: el repo propio queda solo en $(Build.SourcesDirectory).
          - checkout: self
            fetchDepth: 0
            # 🔴 2026-08-31: sin esto, el `git fetch` de abajo NO tiene credenciales y falla con
            # "could not read Username" — y estaba tapado con `|| true`. El portón funcionaba de
            # casualidad, porque `fetchDepth: 0` ya trae la rama destino.
            persistCredentials: true
          # El arnés se baja de su repo público (variables harnessRepoUrl y harnessRef), por clon y sin credencial.
          # Sin `|| true`: si el repo no responde, el paso falla y lo dice.
          - script: |
              set -euo pipefail
              DEST="$(Agent.BuildDirectory)/tcg"
              rm -rf "$DEST"
              git clone --quiet --depth 1 --single-branch --branch "$(harnessRef)" --no-tags "$(harnessRepoUrl)" "$DEST"
              echo "Arnés público en $(git -C "$DEST" rev-parse --short HEAD)"
            displayName: 'Fetch harness (public GitHub, no credentials)'
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
          - script: |
              set -u
              GATE="$(Agent.BuildDirectory)/tcg/scripts/ci/tycon-ci-gate.js"
              REPO="$(Build.SourcesDirectory)"
              TARGET="$(System.PullRequest.TargetBranch)"
              TARGET="${TARGET#refs/heads/}"
              if [ ! -f "$GATE" ]; then
                echo "##vso[task.logissue type=error]No se encontró el portón en $GATE — un control ausente NO es un control aprobado (¿cambió la ruta en el arnés público?)"
                exit 1
              fi
              # 🔴 2026-08-31: el fetch YA NO se tapa con `|| true`. Si no puede actualizar la rama
              # destino se DICE, y si la referencia directamente no está en el clon el portón no
              # puede comparar nada — y un control que no puede correr NO está aprobado.
              if ! git -C "$REPO" fetch --no-tags origin "$TARGET"; then
                echo "##vso[task.logissue type=warning]No se pudo actualizar origin/$TARGET — se usa lo que trajo el checkout"
              fi
              if ! git -C "$REPO" rev-parse --verify -q "origin/$TARGET" >/dev/null; then
                echo "##vso[task.logissue type=error]No existe origin/$TARGET en el clon — el portón no puede comparar contra la rama destino del PR"
                exit 1
              fi
              node "$GATE" --repo "$REPO" --base "origin/$TARGET"
            displayName: 'tycon-ci-gate (--base = rama destino del PR)'

      # 🔴 2026-10-04 — BUSCADOR DE SECRETOS (gitleaks). Caso: contraseñas SQL —una, la de la base de producción—
      # quedaron escritas tal cual en `.advisors/dod-runtime/*-smoke-ledger.jsonl` de un repo de historias, que
      # sólo tenía el portón del arnés; los repos de código ya corrían gitleaks. Mismo motor y misma versión fija.
      #
      # 🔴 Escanea SÓLO los commits que trae el pull request (`origin/<destino>..HEAD`), no el árbol entero: el
      # árbol de un repo de historias puede traer secretos viejos (curls de ejemplo, documentos de socios) y un
      # escaneo completo frenaría todos los pedidos hasta limpiarlos. Lo nuevo no entra; lo viejo se limpia aparte.
      # Si el pedido trae commits y gitleaks no escaneó ninguno, es error: un escaneo que no corrió no es limpio.
      - job: SecretScan
        displayName: 'Secretos en lo que trae el PR (gitleaks, bloqueante)'
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true
          - script: |
              set -u
              REPO="$(Build.SourcesDirectory)"
              TARGET="$(System.PullRequest.TargetBranch)"
              TARGET="${TARGET#refs/heads/}"
              if ! command -v docker >/dev/null; then
                echo "##vso[task.logissue type=error]docker no está en el agente — el escaneo de secretos no puede correr"
                exit 1
              fi
              if ! git -C "$REPO" fetch --no-tags origin "$TARGET"; then
                echo "##vso[task.logissue type=warning]No se pudo actualizar origin/$TARGET — se usa lo que trajo el checkout"
              fi
              if ! git -C "$REPO" rev-parse --verify -q "origin/$TARGET" >/dev/null; then
                echo "##vso[task.logissue type=error]No existe origin/$TARGET en el clon — no se puede saber qué trae el PR"
                exit 1
              fi
              # Bajar la imagen ANTES, con reintento: un 502 del registro no es un hallazgo (2026-09-02).
              bajar() {
                for intento in 1 2 3; do
                  docker pull -q "$1" >/dev/null && return 0
                  ESPERA=$((intento * 10))
                  echo "  ⏳ no se pudo bajar $1 (intento $intento) — reintento en ${ESPERA}s"
                  sleep $ESPERA
                done
                echo "##vso[task.logissue type=error]No se pudo bajar $1 tras 3 intentos — el escaneo no puede correr"
                return 1
              }
              bajar zricethezav/gitleaks:v8.30.1 || exit 1
              ESPERADOS=$(git -C "$REPO" rev-list --count --no-merges "origin/$TARGET..HEAD")
              echo "🔍 Secretos en los $ESPERADOS commit(s) que trae el PR (origin/$TARGET..HEAD)"
              SALIDA=$(docker run --rm -v "$REPO":/repo \
                -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
                zricethezav/gitleaks:v8.30.1 detect --source /repo --log-opts="--no-merges origin/$TARGET..HEAD" \
                --redact --verbose --no-banner --no-color 2>&1)
              RC=$?
              printf '%s\n' "$SALIDA"
              ESCANEADOS=$(printf '%s\n' "$SALIDA" | sed -n 's/.* \([0-9][0-9]*\) commits scanned.*/\1/p' | tail -1)
              if [ "$RC" -ne 0 ] && [ "$RC" -ne 1 ]; then
                echo "##vso[task.logissue type=error]gitleaks terminó con código $RC — el escaneo no corrió bien, no se puede dar por limpio"
                exit 1
              fi
              if [ "$ESPERADOS" -gt 0 ] && [ "${ESCANEADOS:-0}" -eq 0 ]; then
                echo "##vso[task.logissue type=error]El PR trae $ESPERADOS commit(s) y gitleaks no escaneó ninguno — no se puede dar por limpio"
                exit 1
              fi
              if [ "$RC" -eq 1 ]; then
                echo "##vso[task.logissue type=error]El PR trae secretos (arriba, tapados). Sacalos del commit, reemplazalos por *** o una variable, y rotalos si son reales"
                exit 1
              fi
              echo "✅ sin secretos en lo que trae el PR ($ESCANEADOS commit(s) escaneados)"
            displayName: 'Secret Scan (Gitleaks) — commits del PR'
