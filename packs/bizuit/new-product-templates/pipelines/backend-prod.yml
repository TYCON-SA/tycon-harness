# Azure DevOps Pipeline — PASE A PRODUCCIÓN del plugin {{PRODUCT}} Backend
#
# 🔴 POR QUÉ ES UN PIPELINE APARTE (2026-09-01, como en los demás
# productos). Hasta hoy `DeployProd` era un stage más del pipeline de CI, colgado del deploy
# a staging. El problema: un run esperando la aprobación de PRODUCCIÓN cuenta como "en curso", así
# que los merges siguientes a main no obtenían run propio hasta que alguien aprobara, rechazara o
# venciera (24 h) — y staging se quedaba sin actualizar
# Microsoft recomienda exactamente esto: partir
# CI y CD en dos pipelines cuando hay aprobaciones.
#
# CÓMO FUNCIONA: se dispara SOLO cuando el pipeline de CI ("{{BACKEND_REPO}}") termina en verde
# sobre main — o sea, DESPUÉS del deploy a staging Y SU HUMO, que son stages de ese CI. Toma el
# MISMO paquete que ese run subió a staging (no se reconstruye: "Build Binaries Only Once") y pide
# la aprobación del environment 'production'. Cada merge genera su propia corrida de PROD; se
# aprueba la que se quiera y las demás vencen solas.
# También se puede encolar a mano eligiendo el run de CI a promover.

trigger: none   # obligatorio: si no, cada push a main correría este pipeline dos veces
pr: none

resources:
  pipelines:
    - pipeline: ci                    # alias: $(resources.pipeline.ci.*)
      source: '{{BACKEND_REPO}}'       # nombre exacto del pipeline de CI en ADO
      trigger:
        branches:
          include:
            - main
        # 🔴 2026-09-02 (revisión adversarial de cierre, hallazgo B2; decidido con el dev): el pedido
        # de producción nace SÓLO cuando la etapa de staging de esa corrida terminó con éxito. Antes
        # se disparaba con la corrida entera "terminada bien" — y "bien" incluye "parcialmente bien":
        # si el despliegue a staging se salteaba por algo anterior, la corrida quedaba amarilla y
        # producción se ofrecía igual, con un pedido idéntico al de una corrida sana. Con este filtro,
        # staging fallido o salteado = ningún pedido de producción.
        # Lo que NO cubre: encolar a mano eligiendo una corrida vieja o en rojo (Run pipeline →
        # Resources). Eso es un acto deliberado de una persona; el freno de retroceso cubre bajar de
        # versión, y verificar el resultado de la corrida elegida queda anotado como mejora futura.
        stages:
          - Deploy

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Las credenciales (BIZEXT_PROD_USER / BIZEXT_PROD_PASS) son variables SECRETAS de ESTE
  # pipeline, cargadas en la UI de ADO (Pipelines > este pipeline > Edit > Variables).
  # No van acá.
  BIZEXT_PROD_URL: '{{PRODUCTION_URL}}'
  BIZEXT_UPLOAD_ENDPOINT: '/api/admin/plugins/upload'

stages:
  # El freno humano de PROD vive en el ENVIRONMENT 'production' de ADO (aprobadores + vencimiento
  # de 24 h; avisa por mail y muestra Aprobar/Rechazar). ADO frena el stage ANTES de correrlo:
  # no hace falta ningún paso extra acá.
  - stage: DeployProd
    displayName: 'PROD {{PRODUCT}} Backend (with approval)'
    # Sólo desde el disparo del CI sobre main (o a mano, eligiendo un run de CI de main).
    # PROD jamás desde un run de CI de otra rama.
    condition: and(in(variables['Build.Reason'], 'ResourceTrigger', 'Manual'), eq(variables['resources.pipeline.ci.sourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployToProd
        displayName: 'Upload to Bizuit host production'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                # Mismo commit que el run de CI. fetchDepth 0: la nota de versión se recalcula
                # con el historial de git.
                - checkout: self
                  fetchDepth: 0

                # Baja TODOS los artefactos del run de CI que disparó: el ZIP del plugin Y
                # `arnes-ci` (los guiones de notas y del humo) — sin tocar `resources:`.
                - download: ci

                - script: |
                    echo "Run de CI que disparó: $(resources.pipeline.ci.runName) (build $(resources.pipeline.ci.runID))"
                    echo "Commit: $(resources.pipeline.ci.sourceCommit) · rama: $(resources.pipeline.ci.sourceBranch)"
                    echo "Motivo de este run: $(Build.Reason)"
                    find "$(Pipeline.Workspace)/ci" -name "*.zip" -type f
                  displayName: 'What is going to be promoted'

                - task: Bash@3
                  displayName: 'Recompute release notes against production'
                  continueOnError: true
                  inputs:
                    targetType: 'inline'
                    script: |
                      # La nota dice qué cambia respecto de la versión que está corriendo EN
                      # PRODUCCIÓN justo antes de subir, para que no repita lo que ya trajo una
                      # versión intermedia publicada en el medio.
                      set -u
                      ZIP_FILE=$(find "$(Pipeline.Workspace)/ci" -name "*.zip" -type f | head -1)
                      if [ -z "$ZIP_FILE" ]; then echo "sin zip; se deja la nota del empaquetado"; exit 0; fi
                      ARNES="$(Pipeline.Workspace)/ci/arnes-ci"
                      RN="$ARNES/release-notes.sh"
                      INJ="$ARNES/inject-release-notes.sh"
                      if [ ! -f "$RN" ] || [ ! -f "$INJ" ]; then
                        echo "##vso[task.logissue type=warning]No llegaron los guiones de notas del arnés — queda la nota del empaquetado (fuente única: <arnés>/scripts/ci). Una nota de versión no puede voltear un pase a producción que una persona ya aprobó."
                        exit 0
                      fi
                      NOTAS=$(bash "$RN" --type plugin --from-server "$(BIZEXT_PROD_URL)" "$(BIZEXT_PROD_USER)" "$(BIZEXT_PROD_PASS)" {{PLUGIN}} src/ plugin.json database/ 2>/dev/null)
                      if [ -n "$NOTAS" ]; then
                        bash "$INJ" "$ZIP_FILE" "$NOTAS"
                      fi

                # 🔴 2026-09-02 — FRENO DE RETROCESO (revisión adversarial 🟠 #9, D#10). Encolar a mano este
                # pipeline eligiendo un run de CI VIEJO promovía ese paquete: se subía igual y el humo comparaba
                # contra la versión del ZIP —no contra la instalada—, así que el retroceso salía VERDE. Antes de
                # subir nada se le pregunta al host qué versión está instalada y se niega si la del paquete es
                # menor (igual o mayor pasa). No hay "forzar": no se verificó con el host que una versión menor
                # quede como actual, y retroceder es una acción de una persona desde el panel del host.
                # SIN continueOnError. Si el guion no llegó del arnés, el run de CI es ANTERIOR al freno: tampoco
                # se sube — es exactamente el paquete viejo que el freno existe para frenar.
                - task: Bash@3
                  displayName: 'Rollback guard: the package cannot be older than what PRODUCTION has installed'
                  inputs:
                    targetType: 'inline'
                    script: |
                      set -u
                      GUARDA="$(Pipeline.Workspace)/ci/arnes-ci/rollback-guard.sh"
                      if [ ! -f "$GUARDA" ]; then
                        echo "##vso[task.logissue type=error]No llegó rollback-guard.sh del arnés: este run de CI es anterior al freno de retroceso. Promové un run de CI más nuevo."
                        exit 1
                      fi
                      ZIP_FILE=$(find "$(Pipeline.Workspace)/ci" -name "*.zip" -type f | head -1)
                      [ -z "$ZIP_FILE" ] && { echo "##vso[task.logissue type=error]No hay ZIP del plugin para saber qué versión trae"; exit 1; }
                      VERSION=$(unzip -p "$ZIP_FILE" plugin.json | jq -r '.version // empty')
                      NOMBRE=$(unzip -p "$ZIP_FILE" plugin.json | jq -r '.name // empty')
                      if [ -z "$VERSION" ] || [ -z "$NOMBRE" ]; then echo "##vso[task.logissue type=error]El plugin.json del ZIP no trae name/version"; exit 1; fi
                      bash "$GUARDA" plugin "$(BIZEXT_PROD_URL)" "$(BIZEXT_PROD_USER)" "$(BIZEXT_PROD_PASS)" "$NOMBRE" "$VERSION"

                # 🔴 EL DESPLIEGUE VA POR EL GUION COMPARTIDO DEL ARNÉS (2026-09-02).
                # Acá sólo se subía el paquete: no se ejecutaban las migraciones ni se activaba el plugin.
                # Con las migraciones administradas encendidas, la primera migración habría dejado producción
                # con el plugin marcado como actual y BLOQUEADO, y el humo en rojo DESPUÉS de haber subido.
                # La secuencia correcta —subir sin marcar, preguntar, migrar, activar y recién ahí marcar—
                # se escribió mal cuatro veces seguidas cuando vivía en el YAML. Ahora vive en un solo lugar,
                # con 19 casos que prueban las siete formas de fallar. Ver `guides/probar-pipelines-sin-correrlos.md`.
                - task: Bash@3
                  displayName: 'Login and deploy to production'
                  inputs:
                    targetType: 'inline'
                    script: |
                      set -u
                      DESPLEGAR="$(Pipeline.Workspace)/ci/arnes-ci/deploy-plugin.sh"
                      if [ ! -f "$DESPLEGAR" ]; then
                        echo "##vso[task.logissue type=error]No llegó deploy-plugin.sh del arnés — un despliegue que no puede empezar NO está desplegado"
                        exit 1
                      fi
                      ZIP_FILE=$(find "$(Pipeline.Workspace)/ci" -name "*.zip" -type f | head -1)
                      # 🔴 LA MISMA CARPETA QUE LOS OTROS NUEVE PASOS (2026-09-03). Este archivo baja
                      # el artefacto con `- download: ci`, que lo deja en $(Pipeline.Workspace)/ci —
                      # y así lo leen los otros nueve lugares. Esta línea sola buscaba en
                      # $(System.ArtifactsDirectory), que en producción NADIE llena: quedaba vacía,
                      # el guion recibía --zip vacío y cortaba. O sea que el despliegue a producción
                      # fallaba SIEMPRE, después de la aprobación humana y después de que el freno de
                      # retroceso ya había interrogado al host: cada intento quemaba una aprobación.
                      # Quedó de una migración a medias: se actualizaron nueve referencias y ésta no.
                      bash "$DESPLEGAR" \
                        --url "$(BIZEXT_PROD_URL)" \
                        --user "$(BIZEXT_PROD_USER)" \
                        --password "$(BIZEXT_PROD_PASS)" \
                        --zip "$ZIP_FILE" \
                        --endpoint "$(BIZEXT_UPLOAD_ENDPOINT)" \
                        --pending-options "$(Build.SourcesDirectory)/opciones-pendientes.json" \
                        --environment production

                - task: Bash@3
                  displayName: 'Smoke: the plugin installed in PRODUCTION is alive and is this version'
                  inputs:
                    targetType: 'inline'
                    script: |
                      set -u
                      HUMO="$(Pipeline.Workspace)/ci/arnes-ci/smoke-plugin.sh"
                      if [ ! -f "$HUMO" ]; then
                        echo "##vso[task.logissue type=error]No llegó smoke-plugin.sh del arnés — sin humo no hay verde"
                        exit 1
                      fi
                      ZIP_FILE=$(find "$(Pipeline.Workspace)/ci" -name "*.zip" -type f | head -1)
                      [ -z "$ZIP_FILE" ] && { echo "##vso[task.logissue type=error]No hay ZIP del plugin para saber qué versión esperar"; exit 1; }
                      VERSION=$(unzip -p "$ZIP_FILE" plugin.json | jq -r '.version // empty')
                      NOMBRE=$(unzip -p "$ZIP_FILE" plugin.json | jq -r '.name // empty')
                      if [ -z "$VERSION" ] || [ -z "$NOMBRE" ]; then
                        echo "##vso[task.logissue type=error]El plugin.json del ZIP no trae name/version"
                        exit 1
                      fi
                      echo "Humo: esperando $NOMBRE v$VERSION"
                      # 🔴 EL IDENTIFICADOR DE COMPILACIÓN VA COMO 6º ARGUMENTO — TAMBIÉN EN PRODUCCIÓN (2026-09-04,
                      # revisión de cierre). La versión sola no dice que lo instalado sea ESTE build: se re-empaqueta
                      # y se sube sin tocar el número, y el humo aprueba igual. Con el hash, el guion además exige que
                      # las rutas PROPIAS del plugin contesten 200 — que el host lo dé por cargado no prueba que esté
                      # sirviendo. Ese razonamiento estaba aplicado a cinco stagings y a NINGÚN pase a producción, que
                      # es justo donde cada intento fallido quema una aprobación humana. Sale del plugin.json del ZIP,
                      # que el empaquetado sella con el commit de la corrida de integración que se está promoviendo.
                      HASH=$(unzip -p "$ZIP_FILE" plugin.json | jq -r '.commitHash // empty' | cut -c1-7)
                      [ -n "$HASH" ] || { echo "##vso[task.logissue type=error]El plugin.json del ZIP no trae commitHash — sin él el humo no puede verificar que lo instalado sea ESTE build"; exit 1; }
                      bash "$HUMO" "$(BIZEXT_PROD_URL)" "$(BIZEXT_PROD_USER)" "$(BIZEXT_PROD_PASS)" "$NOMBRE" "$VERSION" "$HASH"
