# npm-publish — publica el instalador de npm (@tyconsa/harness, scripts/setup/npm/) desde la CI pública.
#
# Sin ningún token: trusted publishing (OIDC). npm le cree a esta corrida porque el paquete declara como publicador de
# confianza ESTE repo y ESTE archivo; la constancia de procedencia se genera sola (repo y paquete públicos). Por eso el
# job pide `id-token: write` y nada que escriba en el repo. Publica EN ETAPAS (`npm stage publish`): la versión queda
# esperando hasta que el dueño la aprueba con 2FA en npmjs.com o con `npm stage approve <id>`.
#
# Corre en un push a main que toca scripts/setup/npm/**, o a mano sólo sobre main (repetir una publicación que no
# salió). Nunca en un pedido. La publicación se HABILITA con la variable de repositorio NPM_PUBLISH_ENABLED=true (no es un
# secreto: la pestaña «Variables» de Actions, en la configuración del repo). Sin ella, el job que publica sale salteado, en verde,
# con un aviso que dice qué falta configurar (la organización de npm, el publicador de confianza y la variable: tareas
# del dueño). Con ella, CUALQUIER error es rojo, también la identidad que npm no acepta (E401/E403/OIDC). El
# paquete que todavía no existe en npm (E404) se publica: es la primera publicación, también en etapas.
#
# Su forma exacta la lleva scripts/ci/check-public-workflow.js (`--publisher`): cambiar este archivo es cambiar
# `PUBLISHER_SHAPE` en el mismo commit. Las pruebas: scripts/tests/npm-publish-workflow.test.js.
name: npm-publish
on:
  push:
    branches: [main]
    paths:
      - 'scripts/setup/npm/**'
  workflow_dispatch:
concurrency:
  group: npm-publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # sin la identidad de la corrida: sólo lee la variable de repositorio y avisa si falta
  enabled:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.flag.outputs.enabled }}
    steps:
      - name: La publicación está habilitada
        id: flag
        env:
          ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${ENABLED:-}" = "true" ]; then
            echo "enabled=yes" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "::warning::falta configurar npm: la organización tyconsa, el publicador de confianza (TYCON-SA / tycon-harness / npm-publish.yml, sólo en etapas) y la variable de repositorio NPM_PUBLISH_ENABLED=true. No se publica nada (tareas del dueño, story 8.40)"
          echo "enabled=no" >> "${GITHUB_OUTPUT}"
  publish:
    needs: enabled
    if: needs.enabled.outputs.enabled == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: npm en una versión exacta
        run: |
          set -euo pipefail
          npm install -g npm@11.19.1
          have="$(npm --version)"
          if [ "${have}" != "11.19.1" ]; then
            echo "::error::npm viejo o distinto: hay ${have} y la publicación en etapas pide npm 11.19.1 (11.15.0 o más)"
            exit 1
          fi
          echo "npm ${have}"
      - name: El paquete, la versión y lo que ya está publicado
        id: preflight
        run: |
          set -euo pipefail
          cp LICENSE scripts/setup/npm/LICENSE
          cd scripts/setup/npm
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if ! npm view "${name}" versions --json > "${RUNNER_TEMP}/npm-versions.json" 2> "${RUNNER_TEMP}/npm-view.err"; then
            if grep -q 'E404' "${RUNNER_TEMP}/npm-versions.json" "${RUNNER_TEMP}/npm-view.err"; then
              echo "${name} todavía no existe en npm: es la primera publicación, en etapas"
              echo "publish=yes" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "::error::no pude preguntarle al registro por ${name}: $(head -c 400 "${RUNNER_TEMP}/npm-view.err")"
            exit 1
          fi
          listed=0
          node -e 'const v=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.exit([].concat(v).includes(process.argv[2])?0:3)' "${RUNNER_TEMP}/npm-versions.json" "${version}" || listed=$?
          if [ "${listed}" = 3 ]; then
            echo "${name}@${version} es nueva: se publica en etapas"
            echo "publish=yes" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${listed}" != 0 ]; then
            echo "::error::no entiendo la lista de versiones de ${name} que contestó el registro: $(head -c 400 "${RUNNER_TEMP}/npm-versions.json")"
            exit 1
          fi
          seen="$(npm view "${name}@${version}" dist.integrity)"
          mine="$(npm pack --dry-run --json | node -e 'let s="";process.stdin.on("data",(d)=>{s+=d}).on("end",()=>{process.stdout.write(JSON.parse(s)[0].integrity)})')"
          if [ -n "${seen}" ] && [ "${mine}" = "${seen}" ]; then
            echo "${name}@${version} ya publicada con este mismo contenido: no hay nada que publicar"
            echo "publish=no" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "::error::${name}@${version} ya está publicada con otro contenido: subí version en scripts/setup/npm/package.json"
          exit 1
      - name: Publicar en etapas (la aprueba una persona con 2FA)
        if: steps.preflight.outputs.publish == 'yes'
        working-directory: scripts/setup/npm
        run: |
          set -euo pipefail
          npm stage publish
