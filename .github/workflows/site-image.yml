# site-image.yml — arma y publica la imagen del sitio de la organización en el registro de paquetes de GitHub de este
# repo. Corre sólo en un push a main que toca lo que la imagen trae: las carpetas que copia scripts/site/Dockerfile
# (no version.json solo: cambia en cada merge) y este mismo archivo (cambiar cómo se arma es armarla de nuevo).
#
# El nombre de la imagen sale del contexto (ghcr.io/<este repo, en minúsculas>), nunca escrito. Etiquetas: la versión que
# el merge le puso a este commit (la etiqueta v<número> de version-tag.yml) y sha-<commit>; nunca latest: cada instalación
# fija la imagen por su huella (@sha256:…) y la actualiza una persona. La versión viaja adentro, en .tycon-release.json,
# para que el sitio diga la misma. Un commit que el merge no numeró (lo numeró el siguiente) no publica imagen y lo dice.
# Antes de publicar, Trivy escanea la imagen armada: una vulnerabilidad HIGH o CRITICAL con arreglo publicado frena la
# publicación; las que todavía no tienen arreglo se avisan. Con constancia de origen (attest-build-provenance), guardada al
# lado de la imagen: se sube con la sesión del registro todavía abierta, y la sesión se cierra al final, pase lo que pase.
#
# La visibilidad del paquete no la fija este workflow: tras la primera publicación, una persona confirma en
# GitHub → Packages que es público (hacerlo público no tiene vuelta atrás).
#
# Su control: scripts/tests/site-image-workflow.test.js (disparador, permisos, acciones fijadas por el sha, secretos).
name: site-image
on:
  push:
    branches: [main]
    paths:
      - 'scripts/site/**'
      - 'scripts/lib/**'
      - 'scripts/metrics/**'
      - 'scripts/nightly/**'
      - 'scripts/setup/harness/**'
      - 'scripts/setup/install-effects.json'
      - 'scripts/setup/public-remotes.json'
      - 'scripts/ci/check-product-parity.js'
      - 'scripts/ci/legacy-options.js'
      - 'skills/tycon-pipeline/scripts/**'
      - 'skills/tycon-pipeline/steps/**'
      - 'skills/clocki/scripts/**'
      - 'scripts/hooks/**'
      - 'scripts/setup/hooks-list.json'
      - 'guides/**'
      - 'agents/**'
      - 'packs/**'
      - 'LICENSE*'
      - 'NOTICE*'
      - 'guides/organization-site.md'
      - 'guides/organization-site.en.md'
      - 'guides/sitio-de-la-organizacion/capturas/**'
      - '.github/workflows/site-image.yml'
concurrency:
  group: site-image
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Armar y publicar la imagen
        id: imagen
        env:
          REGISTRO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGEN="ghcr.io/${GITHUB_REPOSITORY,,}"
          # la versión es la etiqueta que el merge le pone a este commit; la pone version-tag.yml en paralelo: se espera
          VERSION=""
          for _ in $(seq 1 40); do
            VERSION=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" 'refs/tags/v*' \
              | awk -v s="$GITHUB_SHA" '$1 == s && !visto { sub("^refs/tags/v", "", $2); sub("\\^\\{\\}$", "", $2); print $2; visto = 1 }')
            [ -n "$VERSION" ] && break
            sleep 15
          done
          if [ -z "$VERSION" ]; then
            echo "::warning::este commit no recibió la etiqueta del merge en 10 minutos (lo numeró un merge siguiente): no se publica imagen"
            echo "publicar=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '{ "version": "%s", "image": "%s" }\n' "$VERSION" "$IMAGEN" > .tycon-release.json
          echo "publicar=si" >> "$GITHUB_OUTPUT"
          # las etiquetas OCI: la versión se lee del registro sin bajar capas (latest-release.js); todo sale del contexto
          CREADA=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker build -f scripts/site/Dockerfile -t "${IMAGEN}:${VERSION}" -t "${IMAGEN}:sha-${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=$VERSION" --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --label "org.opencontainers.image.created=$CREADA" \
            --label "tycon.image=site" .
          # la pestaña Cómo trabaja arma su modelo con lo que la imagen trae: la sonda corre en el checkout y dentro de la
          # imagen recién armada, y tienen que dar lo mismo. Distinto (o un error adentro), no se escanea ni se publica. Las
          # dos con el Node de la imagen: el checkout entra montado, de sólo lectura
          SONDA_ARBOL=$(docker run --rm -v "$PWD:/arbol:ro" "${IMAGEN}:${VERSION}" node /arbol/scripts/tests/lib/how-it-works-probe.js /arbol)
          SONDA_IMAGEN=$(docker run --rm -v "$PWD/scripts/tests/lib:/app/scripts/tests/lib:ro" "${IMAGEN}:${VERSION}" node /app/scripts/tests/lib/how-it-works-probe.js)
          [ "$SONDA_IMAGEN" = "$SONDA_ARBOL" ] || { echo "::error::la pestaña Cómo trabaja no arma en la imagen lo mismo que en el árbol: ${SONDA_IMAGEN:0:400}"; exit 1; }
          # iguales no alcanza: rota en los dos lados también frena (sin error y sin problemas de lectura)
          case "$SONDA_IMAGEN" in *'"problems":[]}') ;; *) echo "::error::la pestaña Cómo trabaja no arma su modelo en la imagen: ${SONDA_IMAGEN:0:400}"; exit 1 ;; esac
          # el escaneo, ANTES de publicar: una vulnerabilidad HIGH o CRITICAL con arreglo publicado frena todo (exit 1, nada
          # se sube); las que todavía no tienen arreglo se avisan. Trivy fijado por versión y por huella; la imagen le llega
          # como archivo, sin el socket de Docker
          TRIVY="aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa"
          mkdir -p "$RUNNER_TEMP/escaneo/cache"
          docker save "${IMAGEN}:${VERSION}" -o "$RUNNER_TEMP/escaneo/imagen.tar"
          ESCANEAR=(docker run --rm -v "$RUNNER_TEMP/escaneo:/escaneo" -e TRIVY_CACHE_DIR=/escaneo/cache "$TRIVY" image --input /escaneo/imagen.tar --severity HIGH,CRITICAL --no-progress)
          "${ESCANEAR[@]}" --ignore-unfixed --exit-code 1
          SIN_ARREGLO=$("${ESCANEAR[@]}" --skip-db-update --format json --quiet \
            | node -e 'let s="";process.stdin.on("data",(d)=>{s+=d}).on("end",()=>{const r=JSON.parse(s).Results||[];process.stdout.write(String(r.reduce((n,x)=>n+(x.Vulnerabilities||[]).length,0)))})')
          [ "$SIN_ARREGLO" = 0 ] || echo "::warning::${SIN_ARREGLO} vulnerabilidad(es) HIGH o CRITICAL sin arreglo publicado todavía: se publica igual, mirarlas"
          printf '%s' "$REGISTRO_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGEN}:${VERSION}"
          docker push "${IMAGEN}:sha-${GITHUB_SHA}"
          HUELLA=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGEN}:${VERSION}" | sed 's/^.*@//')
          echo "imagen=${IMAGEN}" >> "$GITHUB_OUTPUT"
          echo "huella=${HUELLA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publicada: ${IMAGEN}@${HUELLA} (etiquetas ${VERSION} y sha-${GITHUB_SHA})"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.imagen.outputs.publicar == 'si'
        with:
          subject-name: ${{ steps.imagen.outputs.imagen }}
          subject-digest: ${{ steps.imagen.outputs.huella }}
          push-to-registry: true
      # la firma recién subida se verifica antes de mover stable: una imagen sin su constancia no llega a ningún sitio
      - name: Verificar la firma de la imagen
        id: firma
        if: steps.imagen.outputs.publicar == 'si'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGEN: ${{ steps.imagen.outputs.imagen }}
          HUELLA: ${{ steps.imagen.outputs.huella }}
        run: gh attestation verify "oci://${IMAGEN}@${HUELLA}" --repo "$GITHUB_REPOSITORY" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/site-image.yml"
      # stable, al final y nunca hacia atrás: apunta a la huella ya subida (sin volver a subir capas). Si falló el escaneo,
      # la publicación, la firma o su verificación, este paso no corre y stable queda donde estaba
      - name: Mover stable a la imagen nueva
        if: steps.imagen.outputs.publicar == 'si' && steps.firma.outcome == 'success'
        env:
          IMAGEN: ${{ steps.imagen.outputs.imagen }}
          HUELLA: ${{ steps.imagen.outputs.huella }}
          VERSION: ${{ steps.imagen.outputs.version }}
        run: |
          set -euo pipefail
          # sin poder leer stable no se mueve a ciegas: el paso falla y dice por qué
          SALIDA=$(node scripts/site/latest-release.js stable-decision --image "$IMAGEN" --version "$VERSION") || { echo "$SALIDA"; echo "::error::stable no se movió: $(printf '%s\n' "$SALIDA" | tail -n 1)"; exit 1; }
          echo "$SALIDA"
          DECISION=$(printf '%s\n' "$SALIDA" | sed -n 's/^decision=//p')
          if [ "$DECISION" = crear ] || [ "$DECISION" = mover ]; then
            docker buildx imagetools create -t "${IMAGEN}:stable" "${IMAGEN}@${HUELLA}"
            echo "stable → ${VERSION} (${HUELLA})" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'stable no se movió: %s\n' "$(printf '%s\n' "$SALIDA" | tail -n 1)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::stable no se movió: $(printf '%s\n' "$SALIDA" | tail -n 1)"
          fi
      - name: Cerrar la sesión del registro
        if: always()
        run: docker logout ghcr.io
