# ci.yml — la CI del repo público: corre scripts/ci/public-ci.sh, el mismo guion que cualquiera puede correr en su máquina.
#
# Lo que este archivo tiene que cumplir lo verifica scripts/ci/check-public-workflow.js (lo corre
# scripts/tests/public-ci.test.sh), regla por regla. Cambiarlo sin leer ese control termina en un rojo:
#   · corre en un pull request, en la cola de merge (merge_group) y en un push a main, y en nada más. Un pull request de
#     un fork corre SIN permisos de escritura y sin ningún dato reservado del repo: por eso el disparador es el común y
#     nunca el que corre con los permisos del repo de destino. La cola prueba cada pedido combinado con los
#     que entraron antes que él, en orden, antes de que llegue a main: corre sobre una rama temporal
#     gh-readonly-queue/main/…, con la misma CI que un pedido y el freno de nombres comparando contra main;
#   · el push a main que hace la cola al entrar un pedido NO corre nada: la cola ya probó exactamente ese
#     commit. Cada job lleva la misma condición: se saltea sólo cuando el evento es `push` y quien empujó es
#     `github-merge-queue[bot]`. Cualquier otro push a main corre entero, como el merge directo de un administrador que
#     salteó la cola (la salida de urgencia). En un pedido y en la cola la condición es siempre verdadera: no cambia nada;
#   · el permiso del token es de sólo lectura y no se usa en ningún paso;
#   · cada acción de terceros va fijada por el sha completo de su commit, con el tag al lado como comentario: un tag se
#     puede mover; un sha, no;
#   · el checkout trae la historia completa (fetch-depth: 0): el freno de nombres compara contra la rama de destino;
#   · la corrida entera con Node 24, el que el arnés se instala, y un trabajo chico aparte (`installer-floor`) con Node
#     22, el más viejo que acepta el instalador. Lo que corre con el Node del SISTEMA,
#     antes de que el arnés tenga el suyo —el arranque, la actualización, el Node propio, la versión bajada y su número—
#     se prueba con ese piso; el resto corre siempre con Node 24 y no necesita la matriz de dos. Cuando el piso del
#     instalador suba a 24, este trabajo se saca (y su regla en el control);
#   · la corrida va PARTIDA en trabajos que corren a la vez (una sola corrida por Node tardaría ~30 min, y con
#     el merge automático ese es el tiempo que tardaría en entrar cada cambio): la matriz es Node × parte. La parte `checks`
#     corre todos los pasos menos las portables y el banco de controles; `controls-bench` corre sólo el banco, que tarda
#     unos 5 minutos y en su propio trabajo no alarga `checks`; cada `suites-<i>-of-<n>` corre la parte <i> de las
#     portables, repartidas por peso con scripts/ci/suites-shard.js. Las partes juntas son la corrida entera
#     (public-ci.sh, TYCON_PUBLIC_CI_PART); la lista tiene que traer `checks`, `controls-bench` y TODAS las
#     `suites-<i>-of-<n>`, de 1 a n: una que falta deja pasos sin correr y el veredicto igual verde. Una base que todavía
#     no conoce la parte `controls-bench` corre el banco dentro de `checks`: esa parte sale verde y lo dice;
#   · en un pull request corren SÓLO `checks` y `controls-bench`: cada `suites-<i>-of-<n>` y `installer-floor` terminan al
#     instante, verdes, con una línea que lo dice. La corrida entera va en la cola (merge_group) y en un push a main que
#     no hizo la cola: un pedido no la paga dos veces (unos 20 minutos cada una). Lo que entra por la cola la pasó antes;
#     lo que un administrador mergea salteándola la corre después, en main, sin que nada la corte (ver `concurrency`);
#   · el ensayo de Windows (`windows`): un trabajo windows-latest por escenario, los cuatro de
#     scripts/ci/windows-rehearsal.js. Los escenarios y el job los exige la regla `windows` del control;
#   · el último job se llama `public-ci` y es el ÚNICO chequeo que las reglas de la rama exigen. Tiene nombre estable a
#     propósito: cambiárselo deja los merges esperando un chequeo que no llega nunca.
#
# CAMBIAR ESTE ARCHIVO ES CAMBIAR DOS: ese control lleva adentro la forma EXACTA de este archivo —sus líneas de código,
# una por una y en orden (la lista `SHAPE`); los comentarios y las líneas vacías no cuentan, y en las dos líneas `uses:`
# el sha y el tag pueden ser otros—. Una línea de más, de menos o distinta es rojo hasta que la misma línea cambie
# allá, en el mismo commit. Es a propósito: lo que corre la CI de un repo público no cambia sin que quede dicho dos veces.
name: public-ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# Un cambio nuevo en la misma rama (o en el mismo pedido) corta la corrida anterior: sólo importa la última.
# En la cola cada grupo tiene su propia rama (gh-readonly-queue/main/pr-<n>-<sha>): los grupos no se cortan entre sí.
# En main no se corta nada: el push que no viene de la cola (el merge directo de un administrador) es la única corrida
# entera de ese commit, porque el pedido corrió sólo `checks`; el push siguiente la cortaría y el commit quedaría sin ella.
concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Node ${{ matrix.node }} · ${{ matrix.part }}
    if: github.event_name != 'push' || github.actor != 'github-merge-queue[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: [24]
        part: [checks, controls-bench, controls-bench-base, suites-1-of-5, suites-2-of-5, suites-3-of-5, suites-4-of-5, suites-5-of-5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Los pasos de la CI pública que le tocan a esta parte
        env:
          TYCON_PUBLIC_CI_OUT: ${{ runner.temp }}/public-ci
          TYCON_PUBLIC_CI_PART: ${{ matrix.part }}
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          # en un pedido corren sólo `checks` y los dos bancos: las suites las corre la cola, y nada entra a main sin pasarlas.
          # El banco de la base corre en el pedido porque es ahí donde el dueño firma un aflojamiento
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ "${TYCON_PUBLIC_CI_PART}" != "checks" ] && [ "${TYCON_PUBLIC_CI_PART}" != "controls-bench" ] && [ "${TYCON_PUBLIC_CI_PART}" != "controls-bench-base" ]; then
            echo "en un pedido corren sólo las partes checks, controls-bench y controls-bench-base: ${TYCON_PUBLIC_CI_PART} corre en la cola de merge"
            exit 0
          fi
          # en un pedido BASE_REF es «main»; en la cola es «refs/heads/main»: se le saca el prefijo
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            # los controles y su regla salen de la base: en la cola, la base del grupo; en un pedido, la punta de la rama
            # destino. Corre el public-ci.sh DE LA BASE, sobre el checkout del pedido (guides/piezas-del-arnes.md)
            # (el rango sale de la misma base: en la cola, desde main se colarían los cambios del grupo de adelante)
            BASE="${BASE_SHA:-$(git rev-parse --verify "origin/${BASE_REF#refs/heads/}^{commit}")}" || exit 1
            git cat-file -e "${BASE}^{commit}" || exit 1
            # sin el guion de la revisión en la base no hay de dónde sacar los controles: rojo, nunca los del pedido
            git cat-file -e "${BASE}:scripts/ci/run-base-controls.sh" || { echo "::error::no pude correr: la base no trae scripts/ci/run-base-controls.sh; los controles de un pedido salen de la base, nunca del pedido"; exit 1; }
            git show "${BASE}:scripts/ci/public-ci.sh" > "${RUNNER_TEMP}/public-ci-base.sh"
            # una base que no conoce la parte del banco lo corre dentro de `checks`: acá no queda nada que correr
            if [ "${TYCON_PUBLIC_CI_PART}" = "controls-bench" ] && ! grep -q -- '|controls-bench)' "${RUNNER_TEMP}/public-ci-base.sh"; then
              echo "la base todavía corre el banco de controles dentro de la parte checks: esta parte no tiene nada que correr"
              exit 0
            fi
            # una base que no conoce la parte del banco de la base (el pedido que la introduce) no tiene con qué correrla
            if [ "${TYCON_PUBLIC_CI_PART}" = "controls-bench-base" ] && ! grep -q -- 'controls-bench-base)' "${RUNNER_TEMP}/public-ci-base.sh"; then
              echo "la base todavía no conoce la parte del banco de la base: esta parte no tiene nada que correr"
              exit 0
            fi
            bash "${RUNNER_TEMP}/public-ci-base.sh" --root . --clean-machine --range "${BASE}...HEAD" --base "${BASE}"
          else
            bash scripts/ci/public-ci.sh --clean-machine
          fi
      - name: La salida completa de cada paso (sólo si algo quedó en rojo)
        if: failure()
        env:
          TYCON_PUBLIC_CI_OUT: ${{ runner.temp }}/public-ci
        run: |
          for f in "${TYCON_PUBLIC_CI_OUT}"/*.log "${TYCON_PUBLIC_CI_OUT}"/agent-skills-suites/*.log; do
            [ -f "${f}" ] || continue
            echo "::group::${f##*/}"
            tr '\r' ' ' < "${f}" | sed -e ':a' -e 's/::/: :/' -e 'ta' -e ':b' -e 's/##/# #/' -e 'tb'
            echo "::endgroup::"
          done

  # El piso del instalador: sólo las suites de lo que corre con el Node del sistema, con Node 22 (ver la cabecera).
  # Obligatorio: el chequeo `public-ci` lo espera como a los demás.
  installer-floor:
    name: Node 22 · installer-floor
    if: github.event_name != 'push' || github.actor != 'github-merge-queue[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Las suites de la instalación y la actualización, con el Node más viejo que acepta el instalador
        env:
          TYCON_PUBLIC_CI_OUT: ${{ runner.temp }}/public-ci
          TYCON_PUBLIC_CI_PART: installer-floor
        run: |
          # en un pedido no corre: el piso lo corre la cola, y en la cola y en el push a main corre siempre, entero
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "en un pedido corren sólo las partes checks, controls-bench y controls-bench-base: installer-floor corre en la cola de merge"
            exit 0
          fi
          bash scripts/ci/public-ci.sh --clean-machine
      - name: La salida completa de cada paso (sólo si algo quedó en rojo)
        if: failure()
        env:
          TYCON_PUBLIC_CI_OUT: ${{ runner.temp }}/public-ci
        run: |
          for f in "${TYCON_PUBLIC_CI_OUT}"/*.log; do
            [ -f "${f}" ] || continue
            echo "::group::${f##*/}"
            tr '\r' ' ' < "${f}" | sed -e ':a' -e 's/::/: :/' -e 'ta' -e ':b' -e 's/##/# #/' -e 'tb'
            echo "::endgroup::"
          done

  # El ensayo de Windows sobre el árbol del pedido (scripts/ci/windows-rehearsal.js): el bundle de este checkout y
  # `rehearse.js` encima, en un agente windows-latest, un escenario por trabajo y los cuatro a la vez. `all` es el alta y
  # la actualización; `waiver`, las firmas del dueño por terminal; `old-node`, un Node más viejo que el piso; `npx`, el
  # instalador por npx. Sin setup-node a propósito: se ensaya con el Node que trae la máquina, como un dev. Rojo es no
  # haber podido ensayar, o que ningún paso midiera; lo que el ensayo encuentra va en el resumen de la corrida y no pone
  # rojo el trabajo. En un pedido sale en verde sin ensayar (unos 12 minutos el más largo): corre en la cola de merge y
  # en el push a main. El tope es el de Azure: si un paso se cuelga, cada uno corta en el suyo y el reporte llega a salir.
  # Obligatorio: el chequeo `public-ci` lo espera como a los demás.
  windows:
    name: Windows · ${{ matrix.scenario }}
    if: github.event_name != 'push' || github.actor != 'github-merge-queue[bot]'
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        scenario: [all, waiver, old-node, npx]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: El ensayo de Windows de este escenario
        env:
          SCENARIO: ${{ matrix.scenario }}
          WORK: ${{ runner.workspace }}\tycon-rehearsal
        run: |
          # en un pedido sale en verde sin ensayar: corre en la cola y en el push a main
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { Write-Output 'en un pedido el ensayo de Windows no corre: corre en la cola de merge'; exit 0 }
          node scripts/ci/windows-rehearsal.js --scenario "$env:SCENARIO" --work "$env:WORK"
          exit $LASTEXITCODE

  # El chequeo con nombre estable. Corre SIEMPRE (un job que depende de otro que falló se saltea, y un chequeo salteado
  # cuenta como aprobado): mira el resultado de cada job del que depende y falla si alguno no terminó bien. El resultado
  # de un job con matriz es uno solo para todas sus combinaciones: `success` sólo si TODAS (cada Node, cada parte)
  # terminaron bien; una que falló, se canceló o no corrió lo deja en otra cosa, y acá eso es rojo. La única excepción es
  # el push a main que hace la cola al entrar un pedido: ahí se saltea con los demás (la cola ya probó ese commit).
  public-ci:
    if: always() && (github.event_name != 'push' || github.actor != 'github-merge-queue[bot]')
    needs: [checks, installer-floor, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todos los jobs terminaron bien
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultados: ${RESULTS}"
          [ -n "${RESULTS}" ] || exit 1
          for r in ${RESULTS}; do
            [ "${r}" = "success" ] || exit 1
          done
