# render.yaml — el sitio de la organización en Render, plan gratis (un ejemplo con nombres inventados: un Blueprint).
#
# Lo que cambia respecto de cualquier otra instalación (la guía: guides/organization-site.md, receta de Render):
# · Inicio de sesión: sólo el del sitio (SITE_AUTH_PROVIDER y su registro); Render no pone un candado delante.
# · Disco: el plan gratis no tiene. Sin SITE_DATA_DIR el sitio usa una carpeta temporal y lo dice: lo que sale de las
#   conversaciones en la pestaña Corridas queda «no medido», y un reinicio reinicia el plazo de 24 horas de una
#   configuración rota (y levanta el freno). Con un disco de Render (pago) montado en /data, poné SITE_DATA_DIR=/data.
# · Memoria: 512 MB en el plan gratis (el sitio pide 1 GB para armar la vista de corridas con sus conversaciones).
# · Secretos: cada variable `sync: false` la pregunta Render al crear el servicio desde este archivo, y después la
#   ignora: rotar un secreto se hace en el panel del servicio (Environment). Ningún valor va acá.
# · Se duerme a los 15 minutos sin tráfico y despierta en ~1 minuto (la prueba sin sesión de la noche lo espera).
#
# La imagen, por su huella (@sha256:…), nunca por etiqueta. Con `site.update: "auto"`, el nocturno que mantiene el sitio
# al día (pipelines/operations/site-update.yml) pide el redespliegue con la huella de `stable` por el hook de Render; en
# «sólo aviso», cambiala vos por la huella de la versión nueva cuando el sitio lo diga.
services:
  - type: web
    name: sitio-de-acme
    runtime: image
    plan: free
    image:
      url: ghcr.io/acme/arnes@sha256:cafecafecafecafecafecafecafecafecafecafecafecafecafecafecafecafe
    healthCheckPath: /livez
    envVars:
      - key: PORT
        value: "8080"
      - key: SITE_AUTH_PROVIDER
        value: oidc
      - key: SITE_PUBLIC_URL
        sync: false
      - key: SITE_OIDC_ISSUER
        sync: false
      - key: SITE_OIDC_CLIENT_ID
        sync: false
      - key: SITE_AUTH_ALLOWED_DOMAINS
        sync: false
      - key: SITE_OPERATIONS_REPO
        sync: false
      - key: SITE_FIRST_MAINTAINER
        sync: false
      - key: SITE_SESSION_KEY
        sync: false
      - key: SITE_OIDC_CLIENT_SECRET
        sync: false
      - key: SITE_OPERATIONS_TOKEN
        sync: false
      - key: SITE_MAILBOX_SAS
        sync: false
      # Leer operaciones de la copia en un contenedor (la guía, «De dónde lee operaciones»): SITE_OPERATIONS_SOURCE=copy,
      # la cuenta/contenedor y una SAS de sólo lectura; con la copia, SITE_OPERATIONS_TOKEN queda vacía. Vacías: el repo.
      - key: SITE_OPERATIONS_SOURCE
        sync: false
      - key: SITE_OPERATIONS_COPY
        sync: false
      - key: SITE_OPERATIONS_COPY_SAS
        sync: false
      # Las de la pestaña Configuración, apagadas por defecto: dejalas vacías salvo que decidas prenderlas.
      - key: SITE_OPERATIONS_WRITE_TOKEN
        sync: false
      - key: SITE_PROFILE_REPO
        sync: false
      - key: SITE_PROFILE_TOKEN
        sync: false
      - key: SITE_PROFILE_WRITE_TOKEN
        sync: false
      - key: SITE_PIPELINES_TOKEN
        sync: false
