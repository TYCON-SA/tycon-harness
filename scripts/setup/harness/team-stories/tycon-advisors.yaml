# Config del arnés para {{STORIES_REPO}} — el repo de las HISTORIAS de {{TEAM}}. No compila ni despliega
# nada: su pipeline es sólo el portón de controles en cada pull request.

# ── Cómo llega el trabajo a main ─────────────────────────────────────────────────────────────
# `pr`: el merge va por Pull Request con auto-complete, no por push directo a main.
merge:
  mode: pr

# Los repos de código que una entrega puede tocar junto con sus historias. Rutas relativas al directorio padre.
# Nace vacío: sumalos cuando existan (por ejemplo `repo_group: [mi-backend, mi-frontend]`).
repo_group: []
