# ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════
# La revisión nocturna de las ejecuciones — MODELO para cualquier organización en Azure DevOps
#
# Cómo darlo de alta: pipelines/operations/README.md. Se copia a `pipelines/` del repo de operaciones y se cambia el
# `name:` del recurso `harness` (marcado abajo).
#
# Baja del BUZÓN DE CORRIDAS los volcados, los registros y las conversaciones de la última semana, y
# `scripts/nightly/runs-review/runs-review.js` dice cuáles ejecuciones tuvieron fallas del arnés: una ficha por causa en
# `inbox/runs-review/`, con las ejecuciones que la traen adentro, y el estado de la pasada en
# `inbox/runs-review/last-run.json`, sin texto de las conversaciones. No usa modelo. El resumen de la mañana (`daily-summary.js --runs-review`, en el modelo de dependencias)
# lee lo que deja, así que corre ANTES: a las 03:00 UTC, con el resumen a las 04:00.
#
# Requiere el buzón: el nombre de la conexión de servicio en el parámetro `mailboxConnection` (de sólo lectura sobre ese
# almacenamiento, autorizada sólo para este pipeline y el del tablero). Sin buzón no hay qué revisar y la ejecución sale
# en rojo, en vez de decir «0 con fallas».
#
# Permisos (una vez): la identidad de compilación del proyecto con «Contribute» sobre el repo de operaciones.
# ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════

trigger: none   # nunca por push: una pasada por noche
pr: none

schedules:
  - cron: '0 3 * * *'   # 03:00 UTC: antes del resumen de las 04:00, que lee lo que deja
    displayName: 'Revisión nocturna de las ejecuciones'
    branches:
      include: [main]
    always: true         # corre aunque el repo no haya cambiado: el buzón cambia todas las noches

parameters:
  - name: efectos
    displayName: 'Con efectos fuera de la ejecución (guardar las fichas en el repo de operaciones)'
    type: boolean
    default: true
  - name: mailboxConnection
    displayName: 'Conexión de servicio de Azure con lectura sobre el buzón de ejecuciones'
    type: string
    default: ''

resources:
  repositories:
    - repository: harness
      type: git                         # o `github`, con `endpoint: <conexión de servicio de GitHub>`
      name: my-project/harness          # ← CAMBIAR: dónde está el arnés (en GitHub, la organización/repo público)
      ref: refs/heads/main

pool:
  vmImage: 'ubuntu-latest'

jobs:
  - job: ReviewRuns
    displayName: 'Revisar las ejecuciones de la semana'
    steps:
      - template: pipelines/operations/templates/fetch-harness.yml@harness
      - template: pipelines/operations/templates/ops-data.yml@harness

      - script: |
          set -u
          # Las fichas más nuevas de main del repo de operaciones: una ejecución repetida otro día, o la segunda del mismo
          # día, arranca con una copia vieja y daría por nuevo lo que la anterior ya dejó.
          if [ "$(Build.SourceBranch)" = "refs/heads/main" ]; then
            if ! node scripts/ci/push-nightly-data.js sync -- inbox/runs-review; then
              echo "##vso[task.logissue type=error]No se pudieron traer de main del repo de operaciones las fichas antes de revisar"
              exit 1
            fi
          fi
        displayName: 'Traer de main del repo de operaciones las fichas más nuevas'

      - template: pipelines/operations/templates/check-tree.yml@harness

      - ${{ if eq(parameters.mailboxConnection, '') }}:
          - script: |
              echo "##vso[task.logissue type=error]Sin el parámetro mailboxConnection no hay buzón que revisar: la revisión no corrió"
              exit 1
            displayName: 'Sin buzón no hay qué revisar'

      # La pasada baja el buzón ella misma (registros, volcados y las conversaciones de la ventana) y escribe las fichas y
      # last-run.json aunque la bajada no sea entera. Sale 1 si la pasada fue parcial: la ejecución queda naranja y el
      # paso de guardar corre igual, para que el resumen diga «parcial» y no «NO CORRIÓ».
      - ${{ if ne(parameters.mailboxConnection, '') }}:
          - task: AzureCLI@2
            displayName: 'Revisar las ejecuciones del buzón'
            continueOnError: true
            inputs:
              azureSubscription: ${{ parameters.mailboxConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -u
                DAY=$(date -u +%Y-%m-%d)
                mkdir -p "$(Agent.TempDirectory)/buzon/corridas-buzon"
                node scripts/nightly/runs-review/runs-review.js run --mailbox "$(Agent.TempDirectory)/buzon/corridas-buzon" \
                  --operations "$(Build.SourcesDirectory)" --today "$DAY"
                RC=$?
                if [ "$RC" -ne 0 ]; then
                  echo "##vso[task.logissue type=warning]La revisión de las ejecuciones fue parcial o no pudo correr (salió $RC): last-run.json lo dice"
                  exit 1
                fi
            env:
              # el pedido de trabajo de cada arreglo decidido: la cuenta de build necesita poder crear work items
              AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

      - script: |
          set -eu
          cd "$(Build.SourcesDirectory)"
          # A main llega SÓLO la carpeta de la revisión, sobre la punta recién traída y con reintento.
          DAY=$(date -u +%Y-%m-%d)
          node scripts/ci/push-nightly-data.js save \
            --message "chore(ejecuciones): revisión de las ejecuciones $DAY [nocturno]" \
            --require inbox/runs-review/last-run.json \
            -- inbox/runs-review
        displayName: 'Guardar las fichas y el estado de la pasada en el repo de operaciones'
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq('${{ parameters.efectos }}', 'true'))

      - script: rm -rf "$(Agent.TempDirectory)/buzon"
        displayName: 'Borrar la copia del buzón'
        condition: always()
