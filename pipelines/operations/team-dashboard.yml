# ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════
# El tablero del arnés — MODELO para cualquier organización en Azure DevOps
#
# Cómo darlo de alta: pipelines/operations/README.md. Se copia a `pipelines/` del repo de operaciones y se cambia el
# `name:` del recurso `harness` (marcado abajo).
#
# `artifacts/tablero-del-arnes.html` del repo de operaciones tiene UN escritor: este pipeline. Lee lo que dejaron los
# otros nocturnos en `.dashboard/` (las fuentes que espera las declara `scripts/nightly/dashboard/sources.json` del repo
# de operaciones; sin ese archivo, las del arnés), genera la página con `dashboard.js --nightly`, verifica el sello que
# la página trae adentro (de hoy, de esta corrida y del snapshot de métricas más nuevo), la guarda en main y verifica lo
# PUBLICADO. Corre después de las métricas: sin el snapshot del día, el sello no pasa.
#
# Opcional: el BUZÓN DE CORRIDAS (los registros de las máquinas del equipo, en un almacenamiento de Azure). Si la
# organización tiene uno, se pasa el nombre de la conexión de servicio en el parámetro `mailboxConnection` (de sólo
# lectura sobre ese almacenamiento, autorizada sólo para este pipeline). Sin buzón, las fichas del equipo salen «no leído»
# y la página se genera igual. Del buzón también bajan las métricas de cada merge que suben las máquinas: se juntan en
# `.dashboard/merges/` con su constancia (`bajada.json`), que leen la página y el nocturno de las métricas.
#
# Permisos (una vez): la identidad de compilación del proyecto con «Contribute» sobre el repo de operaciones.
# ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════

trigger: none   # nunca por push: la página se genera una vez por noche
pr: none

schedules:
  - cron: '30 8 * * *'   # 08:30 UTC: después de las métricas y de la revisión de dependencias
    displayName: 'Tablero del arnés (nocturno)'
    branches:
      include: [main]
    always: true

parameters:
  - name: efectos
    displayName: 'Con efectos fuera de la ejecución (guardar la página y verificar la publicada)'
    type: boolean
    default: true
  - name: mailboxConnection
    displayName: 'Conexión de servicio de Azure con lectura sobre el buzón de ejecuciones (vacío: sin buzón)'
    type: string
    default: ''

resources:
  repositories:
    - repository: harness
      type: git                         # o `github`, con `endpoint: <conexión de servicio de GitHub>`
      name: my-project/harness          # ← CAMBIAR: dónde está el arnés (en GitHub, la organización/repo público)
      ref: refs/heads/main

pool:
  vmImage: 'ubuntu-latest'

jobs:
  - job: GenerateAndPublish
    displayName: 'Generar la página del tablero y publicarla'
    steps:
      - template: pipelines/operations/templates/fetch-harness.yml@harness
      - template: pipelines/operations/templates/ops-data.yml@harness

      # Tolerante a propósito: si el buzón no se puede leer, la página se genera igual con el buzón «no leído» y la corrida
      # queda naranja. Sin buzón declarado, el paso no existe.
      - ${{ if ne(parameters.mailboxConnection, '') }}:
          - task: AzureCLI@2
            displayName: 'Bajar del buzón los registros y los volcados (sin conversaciones)'
            continueOnError: true
            inputs:
              azureSubscription: ${{ parameters.mailboxConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -u
                # Dónde está el buzón lo dice operations.json → site.mailbox (lo mismo que lee el sitio), sin llave: la
                # credencial es la de esta conexión. download-runs.js también pide el tenant, y sale de la conexión (no es
                # una credencial). Sin site.mailbox, la página sale sin buzón, como sin la conexión.
                MBX="$(Agent.TempDirectory)/mailbox-location.json"
                TENANT="$(az account show --query tenantId -o tsv 2>/dev/null || true)"
                node -e 'const c = require("./scripts/lib/operations-config.js").load("operations.json"); if (!c.ok) process.exit(3); const m = c.data.site && c.data.site.mailbox; if (!m) process.exit(4); require("fs").writeFileSync(process.argv[1], JSON.stringify({ cuenta: m.account, contenedor: m.container, tenant: process.argv[2] }) + "\n");' "$MBX" "$TENANT"
                LUGAR=$?
                if [ "$LUGAR" != 0 ]; then
                  if [ "$LUGAR" = 4 ]; then echo "##vso[task.logissue type=warning]el buzón no está declarado (operations.json → site.mailbox): las fichas del equipo salen sin número"
                  elif [ "$LUGAR" = 3 ]; then echo "##vso[task.logissue type=warning]operations.json no se pudo leer: no sé dónde está el buzón, y las fichas del equipo salen sin número"
                  else echo "##vso[task.logissue type=warning]no pude leer site.mailbox (el lector salió $LUGAR, ver arriba): las fichas del equipo salen sin número"; fi
                  echo "##vso[task.complete result=SucceededWithIssues;]"
                  exit 0
                fi
                [ -n "$TENANT" ] || echo "##vso[task.logissue type=warning]La conexión no dijo su tenant: la bajada lo va a decir"
                export TYCON_MAILBOX_JSON="$MBX"
                # La bajada exige también la organización de Azure DevOps (la integración «ado»). En una máquina sale del
                # perfil; acá el árbol no trae perfil, y sin ella la bajada se da por apagada: es la de esta corrida.
                export TYCON_ADO_ORG="$(System.CollectionUri)"
                BUZON="$(Agent.TempDirectory)/buzon/corridas-buzon"
                RES="$(Agent.TempDirectory)/bajada.json"
                mkdir -p "$(Agent.TempDirectory)/buzon"
                TYCON_MAILBOX_DIR="$BUZON" node scripts/metrics/download-runs.js --json --no-threads --budget-ms 600000 --merges-to "$(Agent.TempDirectory)/merges-nuevos" > "$RES"
                RC=$?
                if [ "$RC" -eq 0 ] && node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).completo === true ? 0 : 1)' "$RES"; then
                  echo "Buzón leído entero."
                else
                  # el estado (una palabra) y NUNCA el motivo, que nombra blobs y máquinas
                  ESTADO="$(node -e 'try { const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(String((r && r.estado) || "sin_estado").replace(/[^a-z_]/g, "") || "sin_estado"); } catch (e) { process.stdout.write("sin_resultado"); }' "$RES")"
                  echo "##vso[task.logissue type=warning]No se pudo leer el buzón entero: ${ESTADO} (download-runs salió $RC) — las fichas del equipo salen sin número"
                  echo "##vso[task.complete result=SucceededWithIssues;]"
                fi
                exit 0

      - script: |
          set -u
          # Los datos más nuevos de main del repo de operaciones: una corrida re-ejecutada otro día arranca con una copia
          # vieja, y su página se rechazaría recién publicada. Se traen los datos y NO el código; lo que main borró, se borra.
          if [ "$(Build.SourceBranch)" = "refs/heads/main" ]; then
            if ! node scripts/ci/push-nightly-data.js sync -- .dashboard artifacts/tablero-del-arnes.html; then
              echo "##vso[task.logissue type=error]No se pudieron traer de main del repo de operaciones los datos antes de generar la página"
              exit 1
            fi
          fi
        displayName: 'Traer de main del repo de operaciones los datos más nuevos'

      - template: pipelines/operations/templates/check-tree.yml@harness

      # Lo que deja la noche para el sitio de la organización: los pull requests abiertos con su autor y
      # los pedidos abiertos con su asignado, SIN títulos. El sitio no consulta la plataforma: lee estos dos archivos del
      # repo de operaciones (lo asignado se ve con hasta un día de atraso, y la pantalla lo dice). Si una consulta falla, el
      # archivo se escribe igual con `estado: no_medido` y el paso avisa; la página del tablero no depende de ellos.
      - script: |
          set -u
          DAY=$(date -u +%Y-%m-%d)
          mkdir -p .dashboard/open-prs .dashboard/assigned
          if ! node scripts/nightly/open-prs/open-prs.js --today "$DAY" --org "$(System.CollectionUri)" --json ".dashboard/open-prs/open-prs-$DAY.json" > /dev/null; then
            echo "##vso[task.logissue type=warning]Los pull requests para el sitio salieron «no medido» (el archivo lo dice)"
          fi
          if ! node scripts/nightly/assigned/assigned-items.js --today "$DAY" --org "$(System.CollectionUri)" --out .dashboard/assigned; then
            echo "##vso[task.logissue type=warning]Los pedidos asignados para el sitio salieron «no medido» (el archivo lo dice)"
          fi
          exit 0
        displayName: 'Lo que deja la noche para el sitio: pull requests y pedidos asignados'
        env:
          AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

      # La foto del examen de revisores, para el sitio: si el árbol trae `scripts/controls-bench/ultimo-examen.json` (lo
      # deja ahí la organización que corre el examen), se copia con la fecha de su `ts` a
      # `.dashboard/controls-bench/examen-<fecha>.json`, que es lo que lee el sitio. Sin el archivo, o con un `ts` que no
      # es una fecha, no se escribe nada. Nunca corta la noche.
      - script: |
          set -u
          F="$(Build.SourcesDirectory)/scripts/controls-bench/ultimo-examen.json"
          if [ ! -f "$F" ]; then echo "sin foto del examen: no se deja nada para el sitio"; exit 0; fi
          DIA=$(node -e 'try { const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); const t = String(d.ts || "").slice(0, 10); process.stdout.write(/^\d{4}-\d{2}-\d{2}$/.test(t) ? t : ""); } catch (e) { process.stdout.write("ILEGIBLE"); }' "$F")
          if [ "$DIA" = "ILEGIBLE" ]; then
            echo "##vso[task.logissue type=warning]La foto del examen está ilegible (no es un JSON con ts): no se deja para el sitio"
            exit 0
          fi
          if [ -z "$DIA" ]; then
            echo "##vso[task.logissue type=warning]La foto del examen no trae una fecha en ts: no se deja para el sitio"
            exit 0
          fi
          mkdir -p "$(Build.SourcesDirectory)/.dashboard/controls-bench"
          cp "$F" "$(Build.SourcesDirectory)/.dashboard/controls-bench/examen-$DIA.json" || echo "##vso[task.logissue type=warning]No pude copiar la foto del examen para el sitio"
          exit 0
        displayName: 'La foto del examen de revisores para el sitio'

      # La foto de despliegues: qué llegó a staging y a producción en cada producto, leído del stage de cada
      # corrida, con la aprobación pendiente o vencida y main roto o no. Lo que se lee lo declara `operations.json →
      # deployments`; sin declarar, cada producto sale «no medido». Va ANTES de la página (la ficha de despliegues la lee)
      # y es tolerante: si falla, la corrida queda naranja y el tablero se genera igual. La identidad de esta corrida
      # necesita «View builds» y «View build pipeline» en cada proyecto de producto (README).
      - script: |
          set -u
          node scripts/nightly/deployments/deployments.js --today "$(date -u +%Y-%m-%d)" --org "$(System.CollectionUri)" --out .dashboard/deployments
        displayName: 'La foto de despliegues de cada producto'
        continueOnError: true
        env:
          AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

      # Las métricas de cada merge que las máquinas subieron al buzón: la bajada las dejó una por merge en la carpeta
      # temporal y acá se juntan con las ya guardadas en `.dashboard/merges/`, con su constancia (`bajada.json`: completa
      # o no, y de cuándo). Va DESPUÉS de traer los datos de main (si no, ese paso las borra) y antes de la página. Corre
      # aunque la bajada haya fallado: la constancia dice que no se completó y la primera vuelta sale «no medido». Sin
      # buzón declarado, el paso no existe: no hay nada que juntar y la fuente sale «no medido» sin poner la noche naranja.
      - ${{ if ne(parameters.mailboxConnection, '') }}:
          - script: |
              set -u
              if ! node scripts/lib/merge-metrics.js juntar --from "$(Agent.TempDirectory)/merges-nuevos" --to "$(Build.SourcesDirectory)/.dashboard/merges" --result "$(Agent.TempDirectory)/bajada.json"; then
                echo "##vso[task.logissue type=warning]No se pudieron juntar las métricas de cada merge: la página se genera igual y la ficha lo dice"
                echo "##vso[task.complete result=SucceededWithIssues;]"
                exit 0
              fi
              # juntar sale 0 también con la bajada incompleta o con archivos inválidos: lo dice la constancia, y la corrida
              # queda naranja (sólo cuentas y el estado, que es una palabra: nunca nombres de máquinas ni de blobs)
              AVISO="$(node -e 'try { const c = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); const p = []; if (c.completo !== true) p.push(`la bajada no se completó (${String(c.estado || "desconocido").replace(/[^a-z_]/g, "")})`); if (Number(c.invalidos) > 0) p.push(`${Number(c.invalidos)} archivo(s) inválido(s) descartado(s)`); process.stdout.write(p.join(" y ")); } catch (e) { process.stdout.write("la constancia no se puede leer"); }' "$(Build.SourcesDirectory)/.dashboard/merges/bajada.json")"
              if [ -n "$AVISO" ]; then
                echo "##vso[task.logissue type=warning]Métricas de cada merge: ${AVISO} — la primera vuelta y la ficha del capturador dicen «no medido» si la bajada no está completa"
                echo "##vso[task.complete result=SucceededWithIssues;]"
              fi
              exit 0
            displayName: 'Juntar las métricas de cada merge bajadas del buzón'
            condition: succeededOrFailed()

      - script: |
          set -u
          BUZON="$(Agent.TempDirectory)/buzon/corridas-buzon"
          if [ -d "$BUZON" ]; then
            node scripts/nightly/dashboard/dashboard.js --nightly --mailbox "$BUZON" --mailbox-state "$(Agent.TempDirectory)/bajada.json"
          else
            node scripts/nightly/dashboard/dashboard.js --nightly
          fi
          RC=$?
          case "$RC" in
            0) ;;
            2) echo "##vso[task.logissue type=warning]El tablero se generó con una fuente obligatoria ausente o vieja (exit 2): la página lo dice. Si esa fuente no existe en tu organización, sacala de las obligatorias en scripts/nightly/dashboard/sources.json del repo de operaciones"
               echo "##vso[task.complete result=SucceededWithIssues;]" ;;
            *) echo "##vso[task.logissue type=error]El generador del tablero no pudo medir o escribir la página (exit $RC)"
               exit 1 ;;
          esac
          exit 0
        displayName: 'Generar la página del tablero (modo nocturno)'

      # La prueba de vida NO es «el archivo existe»: el sello tiene que ser de hoy, de ESTA corrida y del snapshot de
      # métricas más nuevo. Si no, el paso falla y no se guarda nada.
      - script: |
          set -u
          node scripts/nightly/dashboard/seal.js --verify artifacts/tablero-del-arnes.html --today "$(date -u +%Y-%m-%d)" --run "$(Build.BuildId)" --dashboard .dashboard
        displayName: 'Prueba de vida: el sello de la página es de hoy y del snapshot más nuevo'

      - script: |
          set -eu
          cd "$(Build.SourcesDirectory)"
          # A main llegan SÓLO la página y los dos archivos del sitio, sobre la punta recién traída y con reintento. El sello se verifica ANTES de cada
          # empuje sobre lo que se va a publicar (la página y el .dashboard de la punta, extraídos a $PUSH_DIR).
          DAY=$(date -u +%Y-%m-%d)
          # la marca de la configuración aplicada: el paso que trajo los datos de main la pisó; ops-data.yml
          # dejó la copia de esta corrida en la carpeta temporal. Viaja sólo con una noche verde, como lo demás
          mkdir -p .dashboard && cp "$(Agent.TempDirectory)/applied-config.json" .dashboard/applied-config.json
          node scripts/ci/push-nightly-data.js save \
            --message "chore(tablero): página del arnés $DAY [nocturno]" \
            --require artifacts/tablero-del-arnes.html \
            --verify "node scripts/nightly/dashboard/seal.js --verify \"\$PUSH_DIR/artifacts/tablero-del-arnes.html\" --today \"$DAY\" --run \"$(Build.BuildId)\" --dashboard \"\$PUSH_DIR/.dashboard\"" \
            --verify-export .dashboard \
            -- artifacts/tablero-del-arnes.html .dashboard/open-prs .dashboard/assigned .dashboard/deployments .dashboard/applied-config.json .dashboard/merges .dashboard/controls-bench
        displayName: 'Guardar la página del día y lo del sitio en el repo de operaciones'
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq('${{ parameters.efectos }}', 'true'))

      # Lo publicado, no el disco: la página que abre la organización es la de main del repo de operaciones.
      - script: |
          set -u
          cd "$(Build.SourcesDirectory)"
          PUB="$(Agent.TempDirectory)/publicada.html"
          if ! git fetch --quiet origin main; then
            echo "##vso[task.logissue type=error]No se pudo traer main del repo de operaciones para verificar lo publicado"
            exit 1
          fi
          if ! git show origin/main:artifacts/tablero-del-arnes.html > "$PUB"; then
            echo "##vso[task.logissue type=error]La página del tablero no está en main del repo de operaciones"
            exit 1
          fi
          if ! node scripts/nightly/dashboard/seal.js --verify "$PUB" --today "$(date -u +%Y-%m-%d)" --run "$(Build.BuildId)" --dashboard .dashboard; then
            echo "##vso[task.logissue type=error]La página publicada no pasa la verificación del sello"
            exit 1
          fi
          echo "La página publicada pasa la verificación."
        displayName: 'Verificar la página publicada'
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq('${{ parameters.efectos }}', 'true'))

      # El ensayo (efectos: false): lo que este nocturno habría guardado, con las mismas rutas que su guardado, como
      # artefacto de la corrida (`ensayo-datos`). Ver «El ensayo» en pipelines/operations/README.md. Como el guardado,
      # devuelve antes la marca de esta noche: en main, el sync la pisó con la de main.
      - script: |
          set -u
          mkdir -p .dashboard && cp "$(Agent.TempDirectory)/applied-config.json" .dashboard/applied-config.json \
            || echo "##vso[task.logissue type=warning]ensayo: falta la marca de esta noche (applied-config.json): el ensayo la cuenta sin ella y el guardado no podría devolverla"
          node scripts/ci/rehearsal-index.js --out "$(Build.ArtifactStagingDirectory)/ensayo-datos" \
            -- artifacts/tablero-del-arnes.html .dashboard/open-prs .dashboard/assigned .dashboard/deployments .dashboard/applied-config.json .dashboard/merges .dashboard/controls-bench
        displayName: 'El ensayo: lo que se habría guardado'
        condition: and(succeededOrFailed(), eq('${{ parameters.efectos }}', 'false'))
      - task: PublishPipelineArtifact@1
        displayName: 'El ensayo: publicar lo que se habría guardado'
        condition: and(succeededOrFailed(), eq('${{ parameters.efectos }}', 'false'))
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/ensayo-datos
          artifact: ensayo-datos

      - script: rm -rf "$(Agent.TempDirectory)/buzon" "$(Agent.TempDirectory)/bajada.json" "$(Agent.TempDirectory)/publicada.html"
        displayName: 'Borrar la copia del buzón'
        condition: always()
