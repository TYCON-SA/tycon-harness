# ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════
# Revisión nocturna de dependencias — MODELO para cualquier organización en Azure DevOps
#
# Cómo darlo de alta: pipelines/operations/README.md. Se copia a `pipelines/` del repo de operaciones y se cambia el
# `name:` del recurso `harness` (marcado abajo).
#
# POR QUÉ EXISTE. De los controles de seguridad de un pull request, el de dependencias es el único que pregunta AFUERA:
# compara los paquetes contra la base pública de avisos. Su veredicto puede cambiar sin que cambie una línea de código: un
# repo que pasó en verde a la tarde tiene un aviso nuevo a la noche, y nadie se entera hasta el próximo pull request.
# Esta revisión mira cada noche la rama `main` de los repos declarados y AVISA (no frena: el código no cambió).
#
# QUÉ MIRA Y A QUIÉN AVISA — todo en el repo de operaciones, nada en este YAML:
#   · `scripts/nightly/dependencies/repos.json` — los repos (proyecto/repo de Azure DevOps, tipo npm, nuget o pip), el tope de
#     avisos por noche y, en su bloque `azure`, si se crean pedidos de trabajo (`pedidos_activos`). Ejemplo:
#     pipelines/operations/examples/repos.json del arnés.
#   · `operations.json` — a quién se asigna un pedido de trabajo cuando no se deduce un dueño (`owners`) y quiénes revisan
#     los pull requests por hallazgo (`reviewers.dependencies`). Ejemplo: pipelines/operations/examples/operations.json.
#   · Lo que deja: `.dashboard/dependencias/` (la foto de cada noche) e `inbox/dependencies/` (una ficha por hallazgo).
#     Cada hallazgo nuevo abre un PULL REQUEST en el repo de operaciones: ahí una persona decide, y rechazarlo obliga a
#     escribir el motivo.
#
# Opcional: el RESUMEN DIARIO por Telegram. Si la definición tiene la variable `TYCON_TELEGRAM_CHAT_ID` (y la secreta
# `TELEGRAM_BOT_TOKEN`), después de mirar se manda el resumen. Sin el chat, el paso no corre.
#
# Permisos (una vez): la identidad de compilación del proyecto («<proyecto> Build Service») necesita LECTURA sobre los repos
# declarados, y «Contribute» y «Contribute to pull requests» sobre el repo de operaciones. Para los pedidos de trabajo,
# además, crear y comentar work items y leer grupos en los proyectos declarados. Un permiso que falta no queda callado:
# un repo que no se pudo clonar sale «NO MEDIDO», y un pedido que no se pudo crear queda en el snapshot con su motivo.
# ═══════════════════════════════════════════════════════════════════════════════════════════════════════════════════

trigger: none   # nunca por push: lo que cambia no es el repo, es lo que se sabe de los paquetes
pr: none

schedules:
  - cron: '0 4 * * *'
    displayName: 'Revisión nocturna de dependencias'
    branches:
      include: [main]
    always: true   # el repo de operaciones no cambia; la base de avisos sí, todos los días

# Una corrida de prueba va con efectos=false: mira las dependencias y escribe en el disco, pero no registra ni abre pull
# requests, no crea pedidos de trabajo, no manda el resumen y no guarda nada.
parameters:
  - name: efectos
    displayName: 'Con efectos fuera de la ejecución (pull requests, pedidos de trabajo, resumen y guardar)'
    type: boolean
    default: true
  - name: dotnetSdks
    displayName: 'Versiones del SDK de .NET a instalar (sólo se instalan si algún repo es nuget)'
    type: object
    default: ['9.0.x', '10.0.x']

resources:
  repositories:
    - repository: harness
      type: git                         # o `github`, con `endpoint: <conexión de servicio de GitHub>`
      name: my-project/harness          # ← CAMBIAR: dónde está el arnés (en GitHub, la organización/repo público)
      ref: refs/heads/main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: RAMA_ANALIZADA
    value: 'main'

jobs:
  - job: Review
    displayName: 'Mirar las dependencias de los repos declarados y dejar el borrador'
    timeoutInMinutes: 90
    steps:
      - template: pipelines/operations/templates/fetch-harness.yml@harness
      - template: pipelines/operations/templates/ops-data.yml@harness

      - script: |
          set -euo pipefail
          # Los revisores de los pull requests, de operations.json (reviewers.dependencies). Sin el archivo o sin la clave:
          # el pull request se abre igual, sin revisores. Con un operations.json que no valida: rojo, no se adivina.
          cd "$(Build.SourcesDirectory)"
          if [ -f operations.json ]; then
            REV=$(node -e 'const c = require("./scripts/lib/operations-config.js").load("operations.json"); if (!c.ok) { for (const p of c.problems) console.error(`operations.json: ${p.path || "(el archivo)"}: ${p.message}`); process.exit(1); } process.stdout.write(((c.data.reviewers || {}).dependencies || []).join(" "));') \
              || { echo "##vso[task.logissue type=error]operations.json del repo de operaciones no es válido (motivo arriba)"; exit 1; }
          else
            REV=""
          fi
          echo "revisores de los pull requests: ${REV:-(ninguno)}"
          echo "##vso[task.setvariable variable=OPS_REVIEWERS_DEPENDENCIES]$REV"
          # Los pedidos de trabajo, sólo si repos.json los prende (azure.pedidos_activos: true). Apagados, los dos pasos
          # que hablan con Azure Boards no corren: sin esos permisos, la corrida saldría roja todas las noches.
          [ -f scripts/nightly/dependencies/repos.json ] || { echo "##vso[task.logissue type=error]El repo de operaciones no trae scripts/nightly/dependencies/repos.json: no hay qué repos mirar (ejemplo: pipelines/operations/examples/repos.json del arnés)"; exit 1; }
          WI=$(node -e 'const c = JSON.parse(require("fs").readFileSync("scripts/nightly/dependencies/repos.json", "utf8")); process.stdout.write(c && c.azure && c.azure.pedidos_activos === true ? "1" : "0");') \
            || { echo "##vso[task.logissue type=error]scripts/nightly/dependencies/repos.json no es JSON válido"; exit 1; }
          echo "pedidos de trabajo: $([ "$WI" = 1 ] && echo prendidos || echo 'apagados (azure.pedidos_activos no es true)')"
          echo "##vso[task.setvariable variable=WORK_ITEMS_ON]$WI"
          # Qué herramienta hace falta: .NET sólo con algún repo nuget activo, Python y pip-audit sólo con alguno pip.
          KINDS=$(node -e 'const c = JSON.parse(require("fs").readFileSync("scripts/nightly/dependencies/repos.json", "utf8")); const t = new Set((c.repos || []).filter((r) => r && r.activo !== false).map((r) => r.tipo)); process.stdout.write(`${t.has("nuget") ? 1 : 0} ${t.has("pip") ? 1 : 0}`);') \
            || { echo "##vso[task.logissue type=error]no se pudo leer qué tipos de repo hay en scripts/nightly/dependencies/repos.json"; exit 1; }
          HAS_NUGET=${KINDS% *}
          HAS_PIP=${KINDS#* }
          echo "se instala: .NET $([ "$HAS_NUGET" = 1 ] && echo sí || echo 'no (ningún repo nuget)') · Python y pip-audit $([ "$HAS_PIP" = 1 ] && echo sí || echo 'no (ningún repo pip)')"
          echo "##vso[task.setvariable variable=HAS_NUGET]$HAS_NUGET"
          echo "##vso[task.setvariable variable=HAS_PIP]$HAS_PIP"
          # La primera noche de una organización no hay cola: se crea con sus tres carpetas (y su .gitkeep, que guardar
          # lleva al repo de operaciones). Una cola que existe a medias (sin pending/) NO se completa acá: eso es una
          # mudanza a medias, y el guion de los pull requests la frena con su motivo.
          if [ ! -e inbox/dependencies ]; then
            for D in pending promoted archived; do mkdir -p "inbox/dependencies/$D" && : > "inbox/dependencies/$D/.gitkeep"; done
            echo "primera noche: se crea la cola inbox/dependencies (pending, promoted, archived)"
          fi
        displayName: 'Leer la configuración de la organización (operations.json y repos.json)'

      # Cada repo declara su SDK en su global.json; con uno solo instalado, un repo que pide otra versión mayor saldría
      # «NO MEDIDO» todas las noches. Se instalan los de la lista, y sólo si algún repo es nuget.
      - ${{ each sdk in parameters.dotnetSdks }}:
          - task: UseDotNet@2
            displayName: 'SDK .NET ${{ sdk }}'
            condition: and(succeeded(), eq(variables.HAS_NUGET, '1'))
            inputs: { packageType: 'sdk', version: '${{ sdk }}' }

      # pip-audit, fijado, sólo si algún repo es pip.
      - task: UsePythonVersion@0
        displayName: 'Python 3.12 (para los repos pip)'
        condition: and(succeeded(), eq(variables.HAS_PIP, '1'))
        inputs: { versionSpec: '3.12' }
      - script: python -m pip install --disable-pip-version-check pip-audit==2.10.1
        displayName: 'pip-audit 2.10.1'
        condition: and(succeeded(), eq(variables.HAS_PIP, '1'))

      - script: |
          # Lo que una persona decidió AYER en un pull request se registra ANTES de la revisión: una ficha rechazada no
          # puede salir como «sin decidir» un día tarde. Si Azure no contesta, la noche se mira igual y queda naranja.
          set -uo pipefail
          cd "$(Build.SourcesDirectory)"
          bash scripts/ci/open-pr-per-finding.sh --record-only \
            --queue inbox/dependencies \
            --branch dependencias \
            --script scripts/nightly/dependencies/nightly-dependencies.js \
            --org "$(System.CollectionUri)" \
            --project "$(System.TeamProject)" \
            --repo "$(Build.Repository.Name)"
        displayName: 'Registrar lo que se decidió en los pull requests'
        continueOnError: true
        # empuja a main por dentro (abandona pedidos, borra ramas, guarda): sólo desde main y con efectos
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq('${{ parameters.efectos }}', 'true'))
        env:
          AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

      - script: |
          set -uo pipefail
          cd "$(Build.SourcesDirectory)"
          CLONES="$(Agent.TempDirectory)/repos"
          mkdir -p "$CLONES"
          ORG="$(System.CollectionUri)"
          FALLIDOS=""
          # Las rutas y los repos salen de repos.json: agregar un repo es una entrada en ese archivo, no una línea acá.
          while IFS=$'\t' read -r RUTA ADO; do
            [ -z "$RUTA" ] && continue
            PROJ="${ADO%%/*}"; RNAME="${ADO##*/}"
            DEST="$CLONES/$RUTA"
            mkdir -p "$(dirname "$DEST")"
            if ! ERR=$(git -c http.extraheader="AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN" \
                 clone --quiet --depth=1 --branch "$(RAMA_ANALIZADA)" \
                 "${ORG}${PROJ}/_git/${RNAME}" "$DEST" 2>&1); then
              # el error del clon SE CONSERVA: un permiso que falta no se ve igual que un repo que no existe
              echo "##vso[task.logissue type=warning]No se pudo clonar $PROJ/$RNAME: $ERR"
              FALLIDOS="$FALLIDOS $ADO"
            fi
          done < <(node scripts/nightly/dependencies/nightly-dependencies.js clone-list)
          echo "clonados: $(cd "$CLONES" && find . -maxdepth 3 -name .git | wc -l)"
          [ -z "$FALLIDOS" ] || echo "##vso[task.logissue type=warning]Repos NO clonados:$FALLIDOS — van a figurar como NO MEDIDO, que no es lo mismo que limpio"
        displayName: 'Clonar los repos declarados'
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - script: |
          # El estado de cada pedido de trabajo, ANTES de decidir. SÓLO LEE. Y la fecha de la noche nace acá, una vez.
          # Con código 2 (sin token, sin az, pedidos apagados) deja el volcado con el motivo y la noche mide igual.
          set -uo pipefail
          cd "$(Build.SourcesDirectory)"
          HOY=$(date -u +%Y-%m-%d)
          echo "##vso[task.setvariable variable=HOY_NOCTURNO]$HOY"
          node scripts/nightly/dependencies/work-items.js state \
            --out "$(Build.SourcesDirectory)/.dashboard/dependencias" \
            --pending "$(Build.SourcesDirectory)/inbox/dependencies" \
            --today "$HOY" \
            | tee /tmp/estado-salida.txt
          CODIGO=${PIPESTATUS[0]}
          if [ "$CODIGO" = "2" ]; then
            echo "##vso[task.logissue type=warning]No se pudo leer el estado de los pedidos de trabajo (código 2) — ver la salida. La noche mide igual pero NO cruza: no es «coinciden»."
          elif [ "$CODIGO" != "0" ]; then
            echo "##vso[task.logissue type=warning]El volcado del estado de los pedidos terminó con código $CODIGO — el nocturno lo va a leer como «sin volcado»."
          fi
          exit 0
        displayName: 'Volcar el estado de los pedidos de trabajo'
        condition: and(succeeded(), eq(variables['WORK_ITEMS_ON'], '1'))
        env:
          AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

      - template: pipelines/operations/templates/check-tree.yml@harness

      - script: |
          # ¿Los pipelines de los productos hacen lo mismo? Va ANTES de correr la revisión, que ejecuta código
          # de los productos, y sobre los mismos clones de main. Deja .dashboard/paridad/paridad-<día>.json para el sitio de
          # la organización. Nunca pone roja la noche: una divergencia o un repo sin medir son un aviso. El aviso sale de lo
          # que dice el archivo, no del código de salida solo (un «parcial» sin divergencias sale 0).
          set -uo pipefail
          cd "$(Build.SourcesDirectory)"
          INICIO=$(date +%s)
          HOY="${HOY_NOCTURNO:-$(date -u +%Y-%m-%d)}"
          echo "##vso[task.setvariable variable=HOY_NOCTURNO]$HOY"
          CLONES="$(Agent.TempDirectory)/repos"
          mkdir -p "$CLONES"
          ORG="$(System.CollectionUri)"
          # Lo que la lista de productos declara y la revisión de dependencias no trajo (con `ado` en la entrada).
          # El código de la lista se lee: si no se pudo armar, se dice (el resultado dice por qué).
          LISTA=$(node scripts/ci/check-product-parity.js clone-list --root "$CLONES" --platform azure) \
            || echo "##vso[task.logissue type=warning]Paridad: no se pudo armar la lista de lo que falta clonar (código $?) — el resultado dice por qué"
          while IFS=$'\t' read -r RUTA ADO; do
            [ -z "$RUTA" ] && continue
            PROJ="${ADO%%/*}"; RNAME="${ADO##*/}"
            mkdir -p "$(dirname "$CLONES/$RUTA")"
            if ! ERR=$(git -c http.extraheader="AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN" \
                 clone --quiet --depth=1 --branch "$(RAMA_ANALIZADA)" \
                 "${ORG}${PROJ}/_git/${RNAME}" "$CLONES/$RUTA" 2>&1); then
              echo "##vso[task.logissue type=warning]Paridad: no se pudo clonar $PROJ/$RNAME: $(printf '%s' "$ERR" | tr '\r\n' '  ' | sed 's/##vso/## vso/g')"
            fi
          done <<< "$LISTA"
          OUT="$(Build.SourcesDirectory)/.dashboard/paridad/paridad-$HOY.json"
          rm -f "$OUT"
          node scripts/ci/check-product-parity.js --root "$CLONES" \
            --today "$HOY" --out "$OUT"
          RC=$?
          echo "paridad: $(( $(date +%s) - INICIO )) s · código $RC"
          if [ "$RC" != 0 ] && [ "$RC" != 1 ] && [ "$RC" != 2 ] || [ ! -f "$OUT" ]; then
            echo "##vso[task.logissue type=warning]Paridad de los productos: la paridad no dejó su resultado (código $RC)"
            exit 0
          fi
          AVISO=$(node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const n = (r.divergencias || []).length, v = (r.vencidas || []).length;
            const s = (r.por_ruta || []).filter((e) => e.estado !== "medido").length + (r.grupos_sin_comparar || []).length;
            if (r.estado === "no_medido") console.log(`no medido: ${r.motivo}`);
            else if (r.estado === "parcial") console.log(`${n} divergencias · ${v} vencidas · ${s} sin medir`);
            else if (r.estado === "medido" && (n || v)) console.log(`${n} divergencias · ${v} vencidas`);
          ' "$OUT") || AVISO="la paridad no dejó su resultado (el archivo no se pudo leer)"
          [ -z "$AVISO" ] || echo "##vso[task.logissue type=warning]Paridad de los productos: $(printf '%s' "$AVISO" | tr '\r\n' '  ' | sed 's/##vso/## vso/g')"
          exit 0
        displayName: 'Comparar los pipelines de los productos (paridad)'
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - script: |
          # ¿Hay pruebas de navegador que el pipeline de su producto no corre? Mira los mismos clones de main que la
          # paridad, sin ejecutar nada de ellos. Deja .dashboard/pruebas-sin-ci/pruebas-sin-ci-<día>.json; el resumen
          # cuenta lo que dice (--tests-without-ci). Nunca pone roja la noche: un hallazgo o un control que no midió son
          # un aviso, y sin informe el resumen lo dice.
          set -uo pipefail
          cd "$(Build.SourcesDirectory)"
          HOY="${HOY_NOCTURNO:-$(date -u +%Y-%m-%d)}"
          OUT="$(Build.SourcesDirectory)/.dashboard/pruebas-sin-ci/pruebas-sin-ci-$HOY.json"
          mkdir -p "$(dirname "$OUT")"
          rm -f "$OUT"
          node scripts/ci/check-tests-without-ci.js --root "$(Agent.TempDirectory)/repos" --json > "$OUT.tmp"
          RC=$?
          # sólo un informe que se lee queda como el del día (con 2 y sin ningún repo a mano, igual dice cuántos no
          # miró); sin informe es «no midió»
          if node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$OUT.tmp" 2>/dev/null; then
            mv "$OUT.tmp" "$OUT"
            [ "$RC" = 0 ] || echo "##vso[task.logissue type=warning]Pruebas sin pipeline: no se pudo mirar ningún repo (código $RC)"
          else
            echo "##vso[task.logissue type=warning]Pruebas sin pipeline: el control no midió (código $RC): $(head -c 300 "$OUT.tmp" | tr '\r\n' '  ' | sed 's/##vso/## vso/g')"
            rm -f "$OUT.tmp"
            exit 0
          fi
          AVISO=$(node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const h = (r.resultados || []).filter((x) => x.veredicto === "sin-ci" || x.veredicto === "sin-pipeline").length;
            if (h) console.log(`${h} de ${r.medidos} repos con pruebas de navegador que su pipeline no corre`);
          ' "$OUT")
          [ -z "$AVISO" ] || echo "##vso[task.logissue type=warning]Pruebas sin pipeline: $AVISO"
          exit 0
        displayName: 'Buscar pruebas de navegador que ningún pipeline corre'

      - script: |
          # 🔴 pipefail no es decorativo: sin él, el exit del paso es el de `tee` y un nocturno caído quedaría VERDE.
          set -uo pipefail
          cd "$(Build.SourcesDirectory)"
          HOY="${HOY_NOCTURNO:-$(date -u +%Y-%m-%d)}"
          echo "##vso[task.setvariable variable=HOY_NOCTURNO]$HOY"
          node scripts/nightly/dependencies/nightly-dependencies.js run \
            --root "$(Agent.TempDirectory)/repos" \
            --out "$(Build.SourcesDirectory)/.dashboard/dependencias" \
            --pending "$(Build.SourcesDirectory)/inbox/dependencies" \
            --today "$HOY" \
            | tee /tmp/deps-salida.txt
          CODIGO=${PIPESTATUS[0]}
          # Sale 0 aunque encuentre vulnerabilidades: una dependencia vulnerable NO es un pipeline roto. Otro código es que
          # NO SE PUDO MIRAR NADA.
          if [ "$CODIGO" != "0" ]; then
            echo "##vso[task.logissue type=error]El nocturno terminó con código $CODIGO — las dependencias NO se miraron"
            exit 1
          fi
          if [ ! -f "$(Build.SourcesDirectory)/.dashboard/dependencias/dependencias-$HOY.json" ]; then
            echo "##vso[task.logissue type=error]No quedó el snapshot de $HOY: la noche no se miró"
            exit 1
          fi
          if grep -q 'NO MEDIDO' /tmp/deps-salida.txt; then
            echo "##vso[task.logissue type=warning]Hubo repos que no se pudieron mirar — ver la salida. No medido NO es limpio."
          fi
        displayName: 'Correr la revisión de dependencias'

      - script: |
          # Va ANTES de guardar: el id de cada pedido se escribe en la ficha y tiene que viajar en el mismo commit. No tumba
          # el guardado: si no pudo intentar nada, deja la marca y el rojo lo pone el último paso.
          set -uo pipefail
          cd "$(Build.SourcesDirectory)"
          HOY="${HOY_NOCTURNO:-}"
          if [ -z "$HOY" ]; then
            echo "##vso[task.logissue type=error]Falta HOY_NOCTURNO (la fecha del paso de la revisión): los pedidos de trabajo no se intentaron."
            echo "##vso[task.setvariable variable=PEDIDOS_NO_INTENTADOS]1"
            exit 0
          fi
          node scripts/nightly/dependencies/work-items.js run \
            --out "$(Build.SourcesDirectory)/.dashboard/dependencias" \
            --pending "$(Build.SourcesDirectory)/inbox/dependencies" \
            --today "$HOY" \
            | tee /tmp/pedidos-salida.txt
          CODIGO=${PIPESTATUS[0]}
          if [ "$CODIGO" != "0" ]; then
            echo "##vso[task.logissue type=error]Los pedidos de trabajo NO se pudieron intentar (código $CODIGO) — ver la salida. No es «no había nada que pedir»."
            echo "##vso[task.setvariable variable=PEDIDOS_NO_INTENTADOS]1"
          fi
          exit 0
        displayName: 'Crear los pedidos de trabajo'
        condition: and(succeeded(), eq('${{ parameters.efectos }}', 'true'), eq(variables['WORK_ITEMS_ON'], '1'))
        env:
          AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

      - script: |
          # El barrido de las retrospectivas: cada merge a main de los repos del arnés de la organización
          # (team-repos.json: public, maintainers, operations) sin su archivo de métricas recibe su latido, sin modelo. Los
          # archivos van a .dashboard/retros (se guardan con el resto) y el informe del día, al resumen (--retros). Un repo
          # que no se pudo bajar no corta la noche: el informe lo dice y el resumen también.
          set -uo pipefail
          cd "$(Build.SourcesDirectory)"
          HOY="${HOY_NOCTURNO:-$(date -u +%Y-%m-%d)}"
          node scripts/metrics/retro-sweep.js \
            --team-repos "$(Build.SourcesDirectory)/team-repos.json" \
            --clone-dir "${AGENT_TEMPDIRECTORY:-${TMPDIR:-/tmp}}/retro-sweep" \
            --out "$(Build.SourcesDirectory)/.dashboard/retros" \
            --covered-in "$(Build.SourcesDirectory)/.dashboard/merges" \
            --report "$(Build.SourcesDirectory)/.dashboard/retros/barrido/retro-sweep-$HOY.json"
          CODIGO=$?
          [ "$CODIGO" = 0 ] || echo "##vso[task.logissue type=warning]El barrido de las retrospectivas no pudo mirar todo (código $CODIGO): el resumen dice qué faltó."
          exit 0
        displayName: 'Barrer las retrospectivas de los merges a main'
        condition: succeeded()
        env:
          CLONE_TOKEN: $(System.AccessToken)

      - script: |
          # La propuesta del modelo de la noche (models.nightly de team-repos.json) para las fichas pendientes de las tres
          # fuentes, hasta 30. Propone y nada más: no mueve fichas ni crea pedidos. Va antes del resumen (su línea «sin
          # propuesta del modelo») y del guardado (la propuesta viaja con las fichas). Falla abierto: nunca pone roja la
          # noche. Las llaves llegan como variables secretas del paso; ni este paso ni el guion imprimen su valor.
          set -uo pipefail
          cd "$(Build.SourcesDirectory)"
          HOY="${HOY_NOCTURNO:-$(date -u +%Y-%m-%d)}"
          node scripts/nightly/findings/propose.js --operations "$(Build.SourcesDirectory)" \
            --team-repos "$(Build.SourcesDirectory)/team-repos.json" --today "$HOY" || true
          exit 0
        displayName: 'Pedirle al modelo de la noche una propuesta por ficha'
        condition: and(succeeded(), eq('${{ parameters.efectos }}', 'true'))
        continueOnError: true
        env:
          ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
          OLLAMA_API_KEY: $(OLLAMA_API_KEY)

      - script: |
          # La prueba sin sesión del sitio de la organización: el aviso lleva el enlace sólo si pasó ESTA
          # mañana. Sin `site.url` en operations.json no se prueba. Nunca frena la noche: el resultado viaja al resumen
          # (--site-check del paso siguiente).
          set -uo pipefail
          cd "$(Build.SourcesDirectory)"
          # un operations.json que no se pudo leer NO es «sin site.url»: el lector sale 3 y el aviso dirá «no se pudo probar»
          URL=$(node -e 'const c = require("./scripts/lib/operations-config.js").load("operations.json"); if (!c.ok) process.exit(3); process.stdout.write(c.data.site && c.data.site.url ? c.data.site.url : "");')
          LECTURA=$?
          if [ "$LECTURA" != 0 ]; then echo "##vso[task.logissue type=warning]operations.json no se pudo leer (código $LECTURA): el sitio no se prueba y el aviso dirá «no se pudo probar»."; exit 0; fi
          if [ -z "$URL" ]; then echo "sin site.url en operations.json: el sitio no se prueba (el aviso dirá «sitio: sin configurar»)"; exit 0; fi
          node scripts/site/check-deploy.js --url "$URL" --out "${AGENT_TEMPDIRECTORY:-${TMPDIR:-/tmp}}/site-check.json"
          CODIGO=$?
          [ "$CODIGO" = 0 ] || echo "##vso[task.logissue type=warning]La prueba sin sesión del sitio no pasó (código $CODIGO): el aviso sale sin el enlace."
          exit 0
        displayName: 'Probar el sitio sin sesión'
        condition: and(succeeded(), eq('${{ parameters.efectos }}', 'true'))

      - script: |
          # El resumen diario. Va después de los pedidos y antes de guardar: la constancia de entrega viaja en el mismo
          # commit. Si no se entregó, la corrida queda naranja y guardar corre igual. Los canales los decide notify.js
          # con el perfil del equipo (integrations.notify.channels), que este paso baja del repo que declara
          # team-repos.json → profile con la identidad de la ejecución (necesita LECTURA sobre ese repo). Sin la lista, o sin
          # poder bajar el perfil, el canal de operations.json → notify.channel, y el resumen lo dice.
          set -uo pipefail
          cd "$(Build.SourcesDirectory)"
          HOY="${HOY_NOCTURNO:-}"
          if [ -z "$HOY" ]; then
            echo "##vso[task.logissue type=warning]Falta HOY_NOCTURNO: el resumen NO se intentó."
            exit 1
          fi
          # Una variable que no está en la definición NO llega vacía: Azure deja el literal `$(NOMBRE)`. Tratada como ausente,
          # el motivo dice la verdad («no hay token»).
          case "${TELEGRAM_BOT_TOKEN:-}" in *'$('*) unset TELEGRAM_BOT_TOKEN ;; esac
          case "${TYCON_TELEGRAM_CHAT_ID:-}" in *'$('*) unset TYCON_TELEGRAM_CHAT_ID ;; esac
          case "${TYCON_NOTIFY_WEBHOOK_URL:-}" in *'$('*) unset TYCON_NOTIFY_WEBHOOK_URL ;; esac
          ERR=$(mktemp)
          # la versión del sitio, sólo si la organización tiene el nocturno que lo mantiene al día (site-update.yml)
          SU=()
          [ -d "$(Build.SourcesDirectory)/.dashboard/site-update" ] && SU=(--site-update "$(Build.SourcesDirectory)/.dashboard/site-update/site-update-$HOY.json")
          # la revisión de la semana (scripts/nightly/weekly-review/): su informe vive en main del repo de mantenimiento, que el barrido de las
          # retrospectivas ya bajó. Sin ese repo en team-repos.json, o sin informe todavía, el resumen no lleva la línea.
          SEM=()
          # sale 3 si team-repos.json no se pudo leer o es inválido (se avisa); sin `maintainers` declarado, vacío (es legítimo)
          if ! MANT=$(node -e 'const r=require("./scripts/lib/team-repos.js").load(process.argv[1]);if(!r.ok)process.exit(3);const m=r.data.maintainers;process.stdout.write(m?m.repo.replace(/[^\w.-]/g,"_"):"")' "$(Build.SourcesDirectory)/team-repos.json"); then
            MANT=""
            echo "##vso[task.logissue type=warning]No pude leer team-repos.json para la revisión de la semana: el resumen va sin ella."
          fi
          CLON="${AGENT_TEMPDIRECTORY:-${TMPDIR:-/tmp}}/retro-sweep/$MANT"
          SEMF="${AGENT_TEMPDIRECTORY:-${TMPDIR:-/tmp}}/weekly-review.json"
          if [ -n "$MANT" ] && [ -d "$CLON/.git" ] && ! git -C "$CLON" rev-parse --verify --quiet origin/main >/dev/null; then
            echo "##vso[task.logissue type=warning]El clon del repo de mantenimiento no tiene origin/main legible: el resumen va sin la revisión de la semana."
          elif [ -n "$MANT" ] && [ -d "$CLON/.git" ]; then
            # con main legible, sin el archivo todavía no hubo revisión (no es una falla); con el archivo, leerlo tiene que andar
            HAY=0; git -C "$CLON" cat-file -e origin/main:.dashboard/weekly-review/latest.json 2>/dev/null || HAY=$?
            if [ "$HAY" = 0 ]; then
              if git -C "$CLON" show origin/main:.dashboard/weekly-review/latest.json > "$SEMF"; then SEM=(--weekly "$SEMF")
              else echo "##vso[task.logissue type=warning]No pude leer el informe de la revisión de la semana: el resumen va sin ella."; fi
            elif [ "$HAY" != 1 ] && [ "$HAY" != 128 ] || ! git -C "$CLON" ls-tree --name-only origin/main >/dev/null 2>&1; then
              # 1 o 128 con el árbol de main legible: el archivo no está (todavía no hubo revisión); otra cosa es un git roto
              echo "##vso[task.logissue type=warning]No pude ver si hay informe de la revisión de la semana (git salió $HAY): el resumen va sin ella."
            fi
          elif [ -n "$MANT" ]; then
            echo "##vso[task.logissue type=warning]No está el clon del repo de mantenimiento: el resumen va sin la revisión de la semana."
          fi
          # la línea de las ejecuciones, si la organización tiene la revisión nocturna (runs-review.yml, 03:00): con su
          # carpeta en el repo de operaciones; sin ella, el resumen no la nombra
          RR=(); [ -d "$(Build.SourcesDirectory)/inbox/runs-review" ] && RR=(--runs-review "$(Build.SourcesDirectory)")
          node scripts/nightly/dependencies/daily-summary.js deliver --source dependencies --today "$HOY" ${SU[@]+"${SU[@]}"} ${SEM[@]+"${SEM[@]}"} ${RR[@]+"${RR[@]}"} \
            --out "$(Build.SourcesDirectory)/.dashboard/dependencias" \
            --pending "$(Build.SourcesDirectory)/inbox/dependencies" \
            --operations "$(Build.SourcesDirectory)/operations.json" \
            --site-check "${AGENT_TEMPDIRECTORY:-${TMPDIR:-/tmp}}/site-check.json" \
            --team-repos "$(Build.SourcesDirectory)/team-repos.json" --clone-dir "${AGENT_TEMPDIRECTORY:-${TMPDIR:-/tmp}}/retro-sweep" \
            --retros "$(Build.SourcesDirectory)/.dashboard/retros/barrido/retro-sweep-$HOY.json" \
            --tests-without-ci "$(Build.SourcesDirectory)/.dashboard/pruebas-sin-ci/pruebas-sin-ci-$HOY.json" 2> "$ERR"
          CODIGO=$?
          cat "$ERR" >&2
          if [ "$CODIGO" != "0" ]; then
            echo "##vso[task.logissue type=warning]El resumen NO se entregó (código $CODIGO): $(tail -n 1 "$ERR")"
            exit 1
          fi
        displayName: 'Entregar el resumen'
        continueOnError: true
        condition: and(succeeded(), eq('${{ parameters.efectos }}', 'true'))
        env:
          TELEGRAM_BOT_TOKEN: $(TELEGRAM_BOT_TOKEN)
          TYCON_TELEGRAM_CHAT_ID: $(TYCON_TELEGRAM_CHAT_ID)
          TYCON_NOTIFY_WEBHOOK_URL: $(TYCON_NOTIFY_WEBHOOK_URL)
          TYCON_SLACK_WEBHOOK_URL: $(TYCON_SLACK_WEBHOOK_URL)
          TYCON_TEAMS_WEBHOOK_URL: $(TYCON_TEAMS_WEBHOOK_URL)
          TYCON_MAIL_USER: $(TYCON_MAIL_USER)
          TYCON_MAIL_PASSWORD: $(TYCON_MAIL_PASSWORD)
          CLONE_TOKEN: $(System.AccessToken)

      - script: |
          set -eu
          cd "$(Build.SourcesDirectory)"
          # A main del repo de operaciones llega SÓLO lo que la noche escribió en estas carpetas (la paridad),
          # sobre la punta recién traída y con reintento. El checkout no se mueve. La foto de hoy tiene que estar.
          node scripts/ci/push-nightly-data.js save \
            --message "chore(dependencias): revisión nocturna $(date -u +%Y-%m-%d) [nocturno]" \
            --require-daily '.dashboard/dependencias/dependencias-{day}.json' \
            -- .dashboard/dependencias inbox/dependencies .dashboard/paridad .dashboard/pruebas-sin-ci .dashboard/retros inbox/runs-review/pending inbox/watcher/pending inbox/model-proposals.json
        displayName: 'Guardar el snapshot y las fichas en el repo de operaciones'
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq('${{ parameters.efectos }}', 'true'))

      - script: |
          set -uo pipefail
          cd "$(Build.SourcesDirectory)"
          # Abre un pull request SÓLO por una ficha que nunca tuvo uno; el que una persona rechazó se convierte en la
          # decisión que esta cola prevé. Si no se pudo preguntar a Azure, no se abre nada y la noche termina en rojo.
          bash scripts/ci/open-pr-per-finding.sh \
            --queue inbox/dependencies \
            --branch dependencias \
            --script scripts/nightly/dependencies/nightly-dependencies.js \
            --org "$(System.CollectionUri)" \
            --project "$(System.TeamProject)" \
            --repo "$(Build.Repository.Name)" \
            --reviewers "${OPS_REVIEWERS_DEPENDENCIES:-}"
        displayName: 'Abrir un pull request por hallazgo (ahí se decide)'
        # empuja ramas y guarda en main por dentro: sólo desde main y con efectos
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq('${{ parameters.efectos }}', 'true'))
        env:
          AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)

      # El rojo de «los pedidos no se intentaron» va ACÁ, después de guardar y de abrir los pull requests: la noche no se
      # pierde por no poder hablar con los tableros de los proyectos.
      - script: |
          echo "##vso[task.logissue type=error]Los pedidos de trabajo no se intentaron esta noche. El snapshot y las fichas ya se guardaron; la ejecución queda en rojo para que no pase por una noche sin novedad."
          exit 1
        displayName: 'Denunciar que los pedidos no se intentaron'
        condition: and(succeededOrFailed(), eq(variables['PEDIDOS_NO_INTENTADOS'], '1'))
