# pipelines/azure-pipelines-pr.yml — los controles del arnés, corridos en el SERVIDOR antes de que un cambio
# aterrice en main (etapa 1 del plan `tasks/plan-proteccion-pr-arnes-2026-09-17.md`).
#
# 🔴 POR QUÉ EXISTE. Hasta hoy el arnés entra a main por push directo: 880 de 911 commits de la
# línea de main en 30 días. Las 114 suites y el banco corren UNA vez por noche, y encontraron main
# roto 12 de 13 noches — o sea que el primero en enterarse de un rojo es el arranque de sesión de
# cada dev, en su máquina, a la mañana siguiente. Esto es lo único que hoy no existe del lado del
# servidor: correr los controles ANTES de que 12 máquinas se bajen el cambio.
#
# Contrato (el mismo que el de los nocturnos, con una diferencia que importa):
#   · `trigger: none` / `pr: none` — NO se dispara solo: lo encola la política de rama. Un segundo
#     disparador haría dos corridas por cambio sobre los 4 carriles hospedados de toda la organización, de los
#     que a una corrida le tocan 2 en la práctica (story 8.22: medido en la cola, no es un número de la licencia).
#     (EXCEPCIÓN TEMPORAL hasta el 2026-09-24: la Etapa 3 le agrega un `trigger` sobre main en modo
#     aviso para medir. Ver el bloque `trigger:` de abajo.)
#   · las suites corren en DOS trabajos a la vez (2026-10-04). Hasta ese día era un solo job en serie, y con
#     rojos y reintentos ya no entraba en su tope de 60 min: las corridas 11761 y 11788 se cortaron sin veredicto,
#     y un job cortado no dice nada. Ver el bloque `parameters:` y el job `Suites`, más abajo.
#   · NUNCA escribe en el repo: ni reporte, ni snapshot, ni rama. Eso sigue siendo del nocturno.
#     (Lo verifica `scripts/tests/pr-verdict.test.sh`, caso V11b.)
#   · el veredicto se da CONTRA LA ÚLTIMA FOTO NOCTURNA, no contra cero: un rojo que ya estaba rojo
#     en main AVISA, sólo un rojo NUEVO frena. Sin esa regla, `publish-bump.test.sh` —roja por una
#     causa de entorno de Azure desde el 7/9— habría frenado el 100 % de los pull requests durante
#     11 días. El criterio vive en `scripts/ci/pr-verdict.js`, con sus casos.
#
# 🔴 Cuánto corre lo decide el DIFF, no una lista de rutas en la política. Azure no deja eximir
# rutas del «pull request obligatorio» (sólo del build), y un filtro en la política sería una
# segunda lista que se desactualiza. Entonces la política encola siempre y acá se decide:
#   · el minuto de lint, SIEMPRE (es el pre-commit del repo, corrido en el servidor);
#   · el banco y las 114 suites, sólo si el cambio trae código (~10 min).
# Y si el diff NO se puede calcular —una corrida a mano, un `fetch` que falla— se corre TODO: falla
# hacia más trabajo, nunca hacia menos, como `affected-forms.js`.

name: pr-$(Date:yyyyMMdd)$(Rev:.r)

# (YA SACADO el 2026-10-05: ver abajo) TEMPORAL — Etapa 3 del plan (`tasks/plan-proteccion-pr-arnes-2026-09-17.md` §3 y §10): una
# semana de medición, hasta el **2026-09-24**. Se saca en la Etapa 6, junto con `--suites-warn`.
# Qué hace mientras dure: cada RÁFAGA de pushes a main produce UNA corrida (`batch: true`, Azure
# agrupa lo que llega mientras la anterior corre) que deja veredicto y **no frena a nadie** —no hay
# política de rama todavía, y con `--suites-warn` sólo el banco y el minuto de lint ponen la
# corrida en rojo. Es la única forma de contar «cuántos pull requests habría frenado» antes de que
# frenar tenga consecuencias.
# Dos cosas que hay que saber para leer los números (§10 las usa):
#   · una corrida de CI NO es un pull request: `System.PullRequest.TargetBranch` viene vacío, el
#     paso «Qué trae este cambio» falla hacia más trabajo y corre TODO (~12 min, 1 carril). Bien
#     así: lo que se quiere medir es el caso caro, no el de documentación.
#   · los 5 pushes nocturnos a main (commits «[nocturno]» de la identidad de build, 04–08 UTC) NO
#     llevan `[skip ci]`, así que también encolan corrida. Se cuentan aparte por su autor.
# El contrato normal —y el de después del 24/9— es `trigger: none`: lo encola la política de rama.
# 2026-10-05 (decisión del dueño): sacado. La medición había vencido el 24/9 y cada ráfaga de merges a main encolaba una
# corrida completa (~50 min de carril) que no frenaba a nadie, en una fila de 4 carriles para toda la organización y con
# seis sesiones validando ramas. El banco nocturno sigue midiendo main todas las noches.
trigger: none
# Story 8.26, tanda C (AC 10): con un repo de GitHub como propio (el público, desde el corte; el de prueba antes), el
# pedido a main es el que dispara la validación, y Azure corta las corridas viejas del mismo pedido (`autoCancel`, por
# defecto). Con el interno de Azure como propio (la 170) este bloque no se aplica: allá la encola la política de rama o
# `scripts/ci/queue-validation.js`, como siempre.
pr:
  branches:
    include: [main]

# Cuántos trabajos paralelos de suites, como MÁXIMO (story 8.22, tramo C). 🔴 Cuántos corren lo decide el peso de lo que
# corre: «Qué suites corren» le pregunta a scripts/ci/suites-shard.js (`jobs`, con el `job_budget` del juego `pr` de
# scripts/ci/suites-weights.json) y publica la matriz misma como salida (`suites.matrix`). La matriz del job Suites y los
# `--of` de todos los pasos salen de esa salida y de ningún otro lado. Si no se puede calcular, corre el máximo y lo dice:
# nunca menos trabajos por no saber. Lo que daría un plan, sin correr nada:
# `node scripts/ci/suites-shard.js jobs --max 2 --only <lista> --weight-set pr`. Su forma la fija
# scripts/tests/pr-suites-shards.test.js.
# 🔴 POR QUÉ 2 DE MÁXIMO: a una corrida le tocan 2 carriles en la práctica. Un plan que entra en un trabajo (hasta ~725 s
# de peso, ~10 min) pide 1 trabajo y el banco: dos pedidos para dos carriles. Hasta el tramo C pedía siempre 2 más el
# banco, y el tercero esperaba carril ~5 min (12181, 12090, 12057, 12127). El banco (~4 min) va en su propio trabajo: el
# reparto no sabe de él.
parameters:
  - name: suiteShards
    displayName: 'Máximo de trabajos paralelos de suites'
    type: number
    default: 2
  # La validación COMPLETA de una rama (story 8.22, AC 6): con `true` corren todas las suites, aunque la rama toque poco.
  # Sin él, corre lo que la rama toca. Se pide al encolar: `node scripts/ci/queue-validation.js --all`.
  - name: runAll
    displayName: 'Correr todas las suites (validación completa de la rama)'
    type: boolean
    default: false

pool:
  vmImage: 'ubuntu-latest'

# Cuatro jobs. `Validar` corre SIEMPRE (qué trae el cambio, el freno de publicación sobre el pedido —story 8.26, tanda
# F2: con un repo de GitHub como propio, lo que el pedido publica— y el minuto de lint) y, si el cambio trae código, deja la lista
# de suites que corren. Los otros tres corren sólo si trae código: el banco y los trabajos de suites a la vez, y el
# veredicto al final, cuando terminaron todos —bien o mal—. Un cambio de sólo documentación los saltea a los tres: un
# job salteado no es un job fallido.
jobs:
  - job: Validar
    displayName: 'Controles del arnés sobre el cambio'
    # Lint y la lista de suites, nada más: el banco y las suites ya no corren acá. La historia del tope del job único
    # (30 → 45 → 60, corridas 11387, 11572 y 11573) sigue en el job Suites.
    timeoutInMinutes: 15
    steps:
      - checkout: self
        fetchDepth: 0            # hace falta la historia para comparar contra la rama destino
        persistCredentials: true # sin esto el `git fetch` de abajo no tiene credenciales

      - task: UseNode@1
        inputs:
          version: '20.x'

      # ── Qué trae este cambio ────────────────────────────────────────────────────────────────
      - script: |
          set -uo pipefail
          # 🔴 La variable se lee del ENTORNO y no como `$(System.PullRequest.TargetBranch)`: en una
          # corrida que no es de pull request, la forma `$(…)` deja el LITERAL en la variable y todo
          # lo que la mire después cree que hay una rama destino llamada así. Ya mordió en el arnés
          # con `$(TELEGRAM_BOT_TOKEN)`. Y por las dudas, un valor con forma de literal se descarta.
          TARGET="${SYSTEM_PULLREQUEST_TARGETBRANCH:-}"
          case "$TARGET" in '$('*) TARGET='' ;; esac
          TARGET="${TARGET#refs/heads/}"
          TODO=no; MOTIVO=''
          RAMA="$(Build.SourceBranch)"; RAMA="${RAMA#refs/heads/}"
          # Story 8.22 (AC 6): la validación completa pedida a mano (parámetro runAll) corre todo, aunque sea sólo docs.
          # (Azure escribe un booleano como «True»/«False»; se acepta también en minúsculas.)
          RUN_ALL="${{ parameters.runAll }}"
          if [ "$RUN_ALL" = True ] || [ "$RUN_ALL" = true ]; then
            TODO=si; MOTIVO='pedido a mano: corre todo'; BASE='origin/main'
          elif [ -z "$TARGET" ] && [ "$RAMA" != main ]; then
            # 2026-10-06 (orden del dueño): las sesiones validan su rama lanzando esta corrida A MANO, no como pull
            # request. Antes eso corría TODO siempre —un .md tardaba lo mismo que una story—. Una rama a mano se
            # compara contra main igual que un pull request: el cambio es la rama ENTERA desde que salió de main.
            if ! git fetch --no-tags --quiet origin main; then
              echo "##vso[task.logissue type=warning]No se pudo traer origin/main — se usa lo que trajo el checkout"
            fi
            if git rev-parse --verify -q origin/main >/dev/null; then
              BASE='origin/main'; echo "corrida a mano sobre la rama $RAMA: el cambio es la rama entera contra origin/main"
            else
              TODO=si; MOTIVO='corrida a mano y no existe origin/main en el clon'; BASE='origin/main'
            fi
          elif [ -z "$TARGET" ]; then
            TODO=si; MOTIVO='corrida de main a mano: no hay rama destino contra la cual comparar'
            BASE='origin/main'
          else
            if ! git fetch --no-tags --quiet origin "$TARGET"; then
              # el aviso con texto fijo (story 8.26, tanda C, AC 45: el control del pedido es público); el detalle, abajo
              echo "##vso[task.logissue type=warning]No se pudo traer la rama destino — se usa lo que trajo el checkout"
              echo "   la rama destino: origin/$TARGET"
            fi
            if git rev-parse --verify -q "origin/$TARGET" >/dev/null; then
              BASE="origin/$TARGET"
            else
              TODO=si; MOTIVO="no existe origin/$TARGET en el clon"; BASE='origin/main'
            fi
          fi
          LISTA="$(Agent.TempDirectory)/cambiados.txt"
          # 🔴 `--no-renames` (pase adversarial del tramo 1 de la story 8.18, hallazgo 12): git detecta los
          # renombres por defecto y un archivo MOVIDO salía sólo con su ruta de destino. Un pull request que
          # sacaba un archivo de `skills/` hacia una carpeta de documentación quedaba «sin código» —ni banco
          # ni suites—, y todo control que mira por ruta dejaba de ver la carpeta de la que salió. Así
          # aparecen la ruta vieja y la nueva (un movimiento es un borrado más un alta), que es lo que ya
          # hacen `touched-files.js` en el portón de las stories y el paso 8 del lint.
          # 🔴 `core.quotePath=false` (pase adversarial del tramo B de la 8.22): con la configuración de fábrica, git escribe una
          # ruta con letras no ASCII entre comillas y con escapes octales («"scripts/a\303\261o.js"»), y esa ruta no coincide
          # con nada de lo que las suites usan: con --deps, las que la usan se salteaban.
          if [ "$TODO" = no ]; then
            if ! git -c core.quotePath=false diff --name-only --no-renames "$BASE...HEAD" > "$LISTA" 2>"$(Agent.TempDirectory)/diff.err"; then
              TODO=si; MOTIVO="el diff contra $BASE falló: $(tr '\n' ' ' < "$(Agent.TempDirectory)/diff.err" | cut -c1-200)"
            fi
          fi
          if [ "$TODO" = si ]; then
            case "$MOTIVO" in
              'pedido a mano'*) echo "▸ $MOTIVO" ;;
              *) echo "##vso[task.logissue type=warning]No se pudo acotar el cambio — se corre TODO: falla hacia más trabajo, nunca hacia menos"
                 echo "   motivo: $(printf '%s' "$MOTIVO" | sed 's/#/♯/g')" ;;
            esac
            git -c core.quotePath=false ls-files > "$LISTA"
          fi
          echo "archivos del cambio: $(wc -l < "$LISTA")"
          sed -n '1,40p' "$LISTA"
          [ "$(wc -l < "$LISTA")" -gt 40 ] && echo "  … (y $(( $(wc -l < "$LISTA") - 40 )) más)"
          # Código = lo que puede cambiar la conducta de un control. La lista es la del plan §1.
          # 🔴 Story 8.18: el arnés trae agent-skills adentro. `skills/` y `packs/` cuentan igual que
          # `agents/` —son las rutas de la fuente lógica agent-skills: esas tres carpetas,
          # `.tycon/post-commit-ignore` y `.githooks/pre-commit-skills`—. Sin esto, un pull request
          # que sólo toca una skill del pipeline pasaba con el minuto de lint y nada más: ni banco
          # ni suites, que es justo donde viven las pruebas de las skills.
          # 2026-10-06 (orden del dueño): un .md es documentación y no es código —«¿qué tiene que validar en Azure? si es
          # un .md»—, también bajo scripts/ (los papeles de la copia en public-files/). Un nombre real lo frena el control
          # del commit (new-names.js). Salvo en agents/, skills/ y packs/: ahí el .md ES la conducta (las instrucciones de
          # cada revisor y de cada paso del pipeline).
          # Story 8.22: esta lista es además la que elige qué suites corren (los .md no eligen). grep sale 1 sin coincidencias
          # —una lista vacía es legítima— y 2 si no pudo leer: eso no es «no hay código», es «no sé», y corre todo.
          LISTA_CODIGO="$(Agent.TempDirectory)/cambiados-codigo.txt"
          grep -vE '\.md$' "$LISTA" > "$LISTA_CODIGO"; RC_COD=$?
          grep -E '^(agents|skills|packs)/.*\.md$' "$LISTA" >> "$LISTA_CODIGO"; RC_MD=$?
          if [ "$RC_COD" -gt 1 ] || [ "$RC_MD" -gt 1 ]; then
            TODO=si; MOTIVO="no pude armar la lista de código del cambio (grep salió $RC_COD/$RC_MD)"
            echo "##vso[task.logissue type=warning]No se pudo acotar el cambio — se corre TODO: falla hacia más trabajo, nunca hacia menos"
            echo "   motivo: $MOTIVO"
          fi
          # el motivo de «corre todo» lo repite el paso de las suites (story 8.22, AC 4): quien lee el registro sabe por qué
          echo "##vso[task.setvariable variable=motivoTodo]$MOTIVO"
          if [ "$TODO" = si ] || grep -qE '^(scripts/|build/|adapters/|pipelines/|\.githooks/|claude-md-blocks/|agents/|skills/|packs/|\.tycon/post-commit-ignore$)' "$LISTA_CODIGO"; then
            HAY_CODIGO=si
          else
            HAY_CODIGO=no
          fi
          echo "##vso[task.setvariable variable=hayCodigo]$HAY_CODIGO"
          echo "##vso[task.setvariable variable=baseDelCambio]$BASE"
          echo "##vso[task.setvariable variable=todoElRepo]$TODO"
          # Los otros trabajos (banco, suites, veredicto) leen esta misma decisión desde afuera del job.
          echo "##vso[task.setvariable variable=hayCodigo;isOutput=true]$HAY_CODIGO"
          echo "▸ base=$BASE · todo=$TODO · banco y suites: $HAY_CODIGO"
        displayName: 'Qué trae este cambio'
        name: change

      # La foto nocturna y lo privado (la lista de los repos de los productos), UNA vez para toda la corrida (story 8.26,
      # tanda C, AC 11 y 43): con el interno de Azure como propio, de origin/main y del checkout; con un repo de GitHub
      # como propio, del repo de Azure que nombra la variable de la definición HARNESS_PRIVATE_REPO. Se publica, y el
      # banco, las suites y el veredicto bajan ESTA: los cuatro lectores de la foto leen la misma.
      - template: /pipelines/templates/fetch-snapshot.yml
        parameters:
          step: fetch

      # ── El freno de publicación, sobre el pedido (story 8.26, tanda F2 · AC 23) ─────────────────────────
      # 🔴 POR QUÉ ACÁ, Y SIEMPRE. Con el arnés mantenido directo en el repo público, lo que un pedido trae ya es
      # público cuando esta corrida arranca: este paso no frena la publicación, frena el MERGE, y dice qué hacer. Va en
      # el trabajo que corre siempre —un pedido de sólo documentación publica lo mismo que uno de código— y sin
      # `condition:`. Es el mismo freno del `pre-push` de cada máquina (scripts/hooks/public-push-guard.js), en su modo
      # de rango: cada commit que el pedido suma a su rama destino (contenido, rutas, mensaje, autor y committer), el
      # nombre de la rama, y el título y el cuerpo, que trae scripts/ci/pr-texts.js de la API de GitHub.
      #   · La lista es la que el paso de arriba dejó en una carpeta temporal de este trabajo (nunca en un artefacto), y
      #     se borra al terminar el paso. Sin lista, rojo: «no pude mirar» no es «limpio».
      #   · Sin poder leer el título y el cuerpo, rojo. En una corrida que no es de un pedido (a mano, sobre una rama)
      #     se miran los commits y la rama, y el freno dice que no hubo título ni cuerpo.
      #   · Con el repo propio en Azure (el interno: trae `specs/` y los correos del equipo, y no se publica tal cual) el
      #     paso dice «no aplica» y no juzga. Sólo ese proveedor: con cualquier otro —GitHub, vacío, uno que no se
      #     conoce— juzga.
      #   · El aviso lleva texto fijo y la cuenta (AC 45: este registro es público); el lugar de cada hallazgo va en
      #     las líneas comunes del registro, y el freno nunca imprime el texto hallado.
      # Todo se lee del ENTORNO (Azure pasa `System.PullRequest.*` como `SYSTEM_PULLREQUEST_*`), no con macros: en una
      # corrida que no es de un pedido la macro deja su literal, y acá eso sería «una rama llamada así».
      # Límite declarado: el paso corre el freno del propio pedido (este YAML también es del pedido). Lo que eso deja
      # pasar lo mira la verificación de noche de lo publicado. Casos: scripts/tests/pr-suites-shards.test.js (T23, T63).
      - script: |
          set -uo pipefail
          red() { echo "##vso[task.logissue type=error]$1"; exit 1; }
          cd "$(Build.SourcesDirectory)" || red "freno de publicación: no pude entrar al checkout"
          LISTDIR="$(Agent.TempDirectory)/private-list"
          TEXTS="$(Agent.TempDirectory)/pr-texts"
          # la lista no queda en el disco para los pasos que siguen, termine como termine este
          trap 'rm -rf "$LISTDIR" "$TEXTS"' EXIT
          if [ "${BUILD_REPOSITORY_PROVIDER:-}" = TfsGit ]; then
            echo "▸ freno de publicación: no aplica — el repo propio de esta corrida está en Azure y no es el público"
            exit 0
          fi
          plain() { case "${1:-}" in '$('*) printf '' ;; *) printf '%s' "${1:-}" ;; esac; }
          ARGS=(--base "$(baseDelCambio)")
          # la punta es el commit del pedido, no el merge de prueba que arma GitHub (ése no lo escribió nadie)
          HEAD_SHA="$(plain "${SYSTEM_PULLREQUEST_SOURCECOMMITID:-}")"
          NUMBER="$(plain "${SYSTEM_PULLREQUEST_PULLREQUESTNUMBER:-}")"
          # En un pedido la punta la da Azure. Sin ella no se cae a HEAD: ahí HEAD es ese merge de prueba, y mirarlo
          # sería juzgar un commit que no es del pedido (y con la identidad de GitHub, no la de quien lo abrió).
          if [ -z "$HEAD_SHA" ] && { [ -n "$NUMBER" ] || [ "${BUILD_REASON:-}" = PullRequest ]; }; then
            red "freno de publicación: la corrida es de un pedido y no sé cuál es su commit — no puedo decir qué publica"
          fi
          ARGS+=(--head "${HEAD_SHA:-HEAD}")
          BRANCH="$(plain "${SYSTEM_PULLREQUEST_SOURCEBRANCH:-}")"
          if [ -z "$BRANCH" ]; then
            case "${BUILD_SOURCEBRANCH:-}" in refs/heads/*) BRANCH="${BUILD_SOURCEBRANCH#refs/heads/}" ;; esac
          fi
          BRANCH="${BRANCH#refs/heads/}"
          # En un pedido el nombre de la rama es texto publicado (figura en su página). Sin él no se sale verde: quedaría
          # sin mirar y nadie lo diría. En una corrida a mano sobre algo que no es una rama no hay nombre que mirar.
          if [ -z "$BRANCH" ] && { [ -n "$NUMBER" ] || [ "${BUILD_REASON:-}" = PullRequest ]; }; then
            red "freno de publicación: la corrida es de un pedido y no sé el nombre de su rama — no puedo decir que esté mirado"
          fi
          # lo que la línea de cuentas del freno tiene que decir: la rama mirada si se le pasó una, y el título y el
          # cuerpo mirados si hay pedido
          LOOKED_BRANCH='branch=0'
          if [ -n "$BRANCH" ]; then
            ARGS+=(--branch "$BRANCH")
            LOOKED_BRANCH='branch=1'
          fi
          rm -rf "$TEXTS"
          LOOKED="$LOOKED_BRANCH title=0 body=0"
          if [ -n "$NUMBER" ]; then
            LOOKED="$LOOKED_BRANCH title=1 body=1"
            echo "▸ el título y el cuerpo del pedido…"
            if ! node scripts/ci/pr-texts.js --repo "${BUILD_REPOSITORY_NAME:-}" --number "$NUMBER" --out "$TEXTS" --credential-from "$(Build.SourcesDirectory)"; then
              red "freno de publicación: no pude leer el título y el cuerpo del pedido — no se dan por mirados: no medido no es verde"
            fi
            ARGS+=(--title-file "$TEXTS/pr-title.txt" --body-file "$TEXTS/pr-body.txt")
          elif [ "${BUILD_REASON:-}" = PullRequest ]; then
            red "freno de publicación: la corrida es de un pedido y no sé su número — no puedo leer su título ni su cuerpo"
          fi
          echo "▸ freno de publicación sobre el pedido (cada commit, la rama, el título y el cuerpo)…"
          OUT="$(TYCON_PUBLISH_DENYLIST="$LISTDIR/denylist.json" node scripts/hooks/public-push-guard.js range "${ARGS[@]}" 2>&1)"; RC=$?
          # lo que dijo el freno, en líneas comunes: dónde, nunca qué. Sin `#`, para que Azure no lea una orden en una ruta.
          printf '%s\n' "$OUT" | sed 's/#/♯/g'
          LINE="$(printf '%s\n' "$OUT" | grep '^public-push-guard: verdict=' | tail -1)"
          # la cuenta es lo único que el aviso interpola, y sólo si son cifras (AC 45)
          N="$(printf '%s\n' "$LINE" | sed -n 's/^public-push-guard: verdict=[a-z]* findings=\([0-9][0-9]*\) .*/\1/p')"
          [ -n "$N" ] || N='?'
          case "$RC" in
            0)
              # verde es la línea de cuentas en verde Y con la rama mirada si se le pasó una, y el título y el cuerpo
              # mirados si la corrida es de un pedido: un freno que pasó sin mirarlos no miró lo que este paso le pidió
              case "$LINE" in
                'public-push-guard: verdict=pass findings=0 commits='*" $LOOKED") echo "✅ freno de publicación: sin hallazgos" ;;
                *) red "freno de publicación: el freno terminó sin su línea de cuentas — este pedido NO consta como mirado" ;;
              esac ;;
            1) red "freno de publicación: $N cosa(s) de este pedido no pueden estar en el repo público — NO se mergea: cerrar el pedido, borrar la rama y pedir la purga (el lugar de cada una, en el registro de este paso)" ;;
            *) red "freno de publicación: no pude mirar este pedido (el motivo, en el registro de este paso) — no medido no es verde" ;;
          esac
        displayName: 'El freno de publicación sobre el pedido'

      # 🔴 AgentSkills SIEMPRE y ANTES del lint, aunque el cambio sea sólo documentación. Medido en
      # la corrida 10568 con el clon después: `lint-story-frontmatter.js` no encontró el descubridor
      # de stories del arnés —que vive en AgentSkills—, cayó al layout clásico y declaró «todas las
      # stories son legibles» habiendo mirado 33 de 278 .md; y `build/check.js` salió rojo por no
      # encontrar los advisors canónicos. Un pull request de documentación es JUSTO el que toca
      # stories, así que acá no hay nada que ahorrar: el clon tarda ~2 s.
      # Desde la story 8.18 la plantilla no clona: ENLAZA `~/.claude/agent-skills` a este mismo
      # checkout. Lo que se valida es el contenido del propio pull request —sus skills, sus
      # revisores—, ya no «el arnés de la rama contra `main` de agent-skills».
      - template: /pipelines/templates/traer-repos.yml
        parameters:
          agentSkills: true
          productos: false

      # ── El minuto de lint: SIEMPRE. Es el pre-commit del repo, del lado del servidor ─────────
      # Cada control decide solo si le toca, mirando la lista de archivos. Un control que no
      # encuentra su herramienta sale ROJO: un control ausente no es un control aprobado.
      # 🔴 Story 8.18 — las DOS partes del pre-commit. El repo unido tiene un pre-commit en dos
      # partes (la del arnés y la de las skills). Acá NO se llama a ninguna de las dos: un hook
      # corrido en el servidor mira lo stageado, que ahí es nada, y saldría verde sin haber mirado.
      # Sus controles están escritos como pasos, sobre el diff del cambio. De la parte de las skills:
      # los dos frenos de nombres con su fuente (7 y 7b), «nada ajeno sin declarar» (8) y la paridad
      # de revisores (5, que ya miraba `agents/`). Lo único que no corre acá es el chequeo de vida del
      # revisor tocado: consulta a un modelo, y este agente no tiene sesión.
      - script: |
          set -uo pipefail
          cd "$(Build.SourcesDirectory)"
          LISTA="$(Agent.TempDirectory)/cambiados.txt"
          FALLAS=0
          falla(){ echo "##vso[task.logissue type=error]$1"; FALLAS=$((FALLAS+1)); }
          toco(){ grep -qE "$1" "$LISTA"; }

          # 1. Frontmatter de stories. Se le pasan TODOS los .md del cambio: quién es una story lo
          #    decide el lint, no un grep de rutas. Una story que el arnés no puede leer no da error:
          #    desaparece en silencio del validator, del backfill y del portón de cierre.
          MDS="$(grep -E '\.md$' "$LISTA" || true)"
          if [ -n "$MDS" ]; then
            echo "▸ lint de frontmatter de stories ($(echo "$MDS" | wc -l) .md)…"
            # shellcheck disable=SC2086
            node scripts/lib/lint-story-frontmatter.js $MDS || falla "hay stories que el arnés no puede leer (motivo arriba)"
          fi

          # 2. El portón de cierre de stories, contra la RAMA DESTINO del pull request.
          echo "▸ tycon-ci-gate (--base $(baseDelCambio))…"
          node scripts/ci/tycon-ci-gate.js --repo "$(Build.SourcesDirectory)" --base "$(baseDelCambio)" \
            || falla "el portón del arnés rechazó el cambio (motivo arriba)"

          # 2b. Lo que rompería la verificación de una versión BAJADA (story 8.23, tanda B · AC 20): export-ignore,
          #     export-subst, enlaces y submódulos en rutas publicadas. Sobre el índice entero; es barato.
          echo "▸ lo que rompería la verificación de la versión bajada…"
          node scripts/ci/check-publishable-tree.js --repo "$(Build.SourcesDirectory)"; RC=$?
          [ "$RC" = 0 ] || falla "$([ "$RC" = 1 ] && echo 'hay enlaces, submódulos o atributos de exportación en rutas publicadas (arriba dice cuáles)' || echo 'no pude mirar la verificación de lo publicado: no medido no es verde')"

          # 3. Presupuesto de los bloques del CLAUDE.md (se cargan enteros en cada sesión de cada máquina).
          if toco '^claude-md-blocks/'; then
            echo "▸ presupuesto de los bloques del CLAUDE.md…"
            node scripts/ci/check-claude-md-blocks.js --repo "$(Build.SourcesDirectory)"; RC=$?
            [ "$RC" = 0 ] || falla "$([ "$RC" = 1 ] && echo 'un bloque del CLAUDE.md se pasa de su techo' || echo 'no pude medir los bloques del CLAUDE.md: no medido no es verde')"
          fi

          # 4. La versión pública del mapa del arnés se DERIVA de la privada: acá se verifica que
          #    coincida (en la máquina el pre-commit la regenera; un pipeline no escribe en el repo).
          #    Sin el mapa interno (el repo público: lo trae el del equipo) no hay pública que derivar.
          if toco '^(artifacts/mapa-arnes\.html|scripts/tools/harness-map/|onboarding/mini-class/mapa-del-arnes\.html)' && [ -f artifacts/mapa-arnes.html ]; then
            echo "▸ versión pública del mapa del arnés…"
            if node scripts/tools/harness-map/public-version.js --input artifacts/mapa-arnes.html \
                 --config scripts/tools/harness-map/publica.json --output "$(Agent.TempDirectory)/mapa-publico.html"; then
              cmp -s "$(Agent.TempDirectory)/mapa-publico.html" onboarding/mini-class/mapa-del-arnes.html \
                || falla "onboarding/mini-class/mapa-del-arnes.html no coincide con lo que se genera desde la privada — se regenera con el pre-commit, no se edita a mano"
            else
              falla "la versión pública del mapa del arnés no se pudo generar (motivo arriba)"
            fi
          fi

          # 5. Paridad Claude↔Codex y «una pieza nueva entra con sus casos en el banco».
          if toco '^(adapters/|build/|agents/|scripts/hooks/|scripts/controls-bench/|scripts/install-tycon-hooks\.sh|\.githooks/)'; then
            echo "▸ paridad Claude↔Codex (build/check.js)…"
            node build/check.js || falla "la paridad Claude↔Codex quedó desalineada (motivo arriba)"
          fi

          # 6. El formato de las series del tablero. 🔴 MODO AVISO, igual que en el nocturno de las
          #    06:00 (`pipelines/azure-pipelines.yml`, «Validar el formato de las métricas por merge»): la
          #    decisión del 2026-09-05 es medir antes de gatear, porque el contrato 2.0 lo cumplían
          #    6 de 125 archivos. Ponerlo bloqueante acá lo gatearía por la ventana, y encima por
          #    archivos que este cambio no escribió: medido hoy sobre main, hay 1 en rojo
          #    (`metrics-2026-09-16-…-story-2.9-fixup-merge.json`, un 0 donde va un entero ≥ 1), así
          #    que frenaría cada pull request que toque `.dashboard/` — que es ~1 por día, el latido
          #    de la retrospectiva. El código de salida SE LEE: no se tapa con `|| true`, que
          #    convierte «no pude mirar» en «miré y está bien».
          if toco '^\.dashboard/'; then
            echo "▸ formato de las series de .dashboard/ (aviso, no frena)…"
            node scripts/lib/dashboard-series.js --validate --dir "$(Build.SourcesDirectory)/.dashboard"; RC=$?
            [ "$RC" = 0 ] || echo "##vso[task.logissue type=warning]Métricas por merge: hay archivos que violan el contrato 2.0 (exit $RC). Modo aviso: no frena. Detalle arriba."
          fi

          # 7. Nombres reales nuevos en lo que se publica (story 8.10): el mismo freno del pre-commit, sobre
          #    el diff del cambio (base común → punta). Un commit con el freno apagado, desde la web de Azure
          #    DevOps o desde una máquina sin hooks llega acá. Sin rango (una corrida que no es de PR, sobre
          #    main: la base es origin/main) el guion avisa «no medido» y NO suma a FALLAS: la red de esa
          #    corrida es el termómetro nocturno. Protege main recién con la Etapa 6 del plan de protección
          #    (la política de rama que encola este pipeline).
          #    🔴 DOS corridas, una por fuente (story 8.18, [DEF-8.18-lint-del-pr]). En el repo unido cada corrida
          #    mira sólo su mitad, partida por ruta: la de `arnes` no ve `agents/`, `skills/` ni `packs/`, que son de
          #    la fuente `agent-skills`. Con una sola corrida, un nombre real metido en una skill pasaba este lint
          #    sin que nadie lo mirara. Cada corrida suma a FALLAS por su cuenta y dice de qué fuente es.
          echo "▸ nombres reales nuevos en lo que se publica (--range $(baseDelCambio)...HEAD), fuente arnes…"
          node scripts/publishing/new-names.js --range "$(baseDelCambio)...HEAD" --source arnes; RC=$?
          [ "$RC" = 0 ] || falla "$([ "$RC" = 1 ] && echo 'el cambio mete nombres reales en lo que se publica (arriba dice dónde y cómo salir)' || echo 'nombres nuevos: no pude mirar (motivo arriba): no medido no es verde')"
          echo "▸ nombres reales nuevos, fuente agent-skills (agents/, skills/, packs/)…"
          node scripts/publishing/new-names.js --range "$(baseDelCambio)...HEAD" --source agent-skills; RC=$?
          [ "$RC" = 0 ] || falla "$([ "$RC" = 1 ] && echo 'el cambio mete nombres reales en lo que se publica desde agents/, skills/ o packs/ — fuente agent-skills (arriba dice dónde y cómo salir)' || echo 'nombres nuevos, fuente agent-skills: no pude mirar (motivo arriba): no medido no es verde')"

          # 7b. Nombres nuevos en castellano en lo que ejecuta la máquina (story 8.9): el mismo freno del pre-commit,
          #     sobre el diff del cambio. Mismo tratamiento que el 7: sin rango, «no medido» y no suma a FALLAS; y las
          #     mismas dos corridas, una por fuente. El par de la fuente arnes va PRIMERO y en dos líneas que se
          #     sostienen solas: el caso C-22 de scripts/tests/githook-livefire.test.sh lo saca de acá y lo corre.
          echo "▸ nombres nuevos en castellano (--range base del cambio...HEAD), fuente arnes…"
          node scripts/publishing/spanish-names.js --range "$(baseDelCambio)...HEAD" --source arnes; RC=$?
          [ "$RC" = 0 ] || falla "$([ "$RC" = 1 ] && echo 'el cambio mete nombres nuevos en castellano en lo que se publica (arriba dice dónde y cómo salir)' || echo 'nombres en castellano: no pude mirar (motivo arriba): no medido no es verde')"
          echo "▸ nombres nuevos en castellano, fuente agent-skills (agents/, skills/, packs/)…"
          node scripts/publishing/spanish-names.js --range "$(baseDelCambio)...HEAD" --source agent-skills; RC=$?
          [ "$RC" = 0 ] || falla "$([ "$RC" = 1 ] && echo 'el cambio mete nombres nuevos en castellano en lo que se publica desde agents/, skills/ o packs/ — fuente agent-skills (arriba dice dónde y cómo salir)' || echo 'nombres en castellano, fuente agent-skills: no pude mirar (motivo arriba): no medido no es verde')"

          # 7c. Historia interna en la prosa que se publica (story 8.26, tanda G1): el mismo control del pre-commit,
          #     sobre el diff del cambio, en UNA corrida para las dos fuentes. Nace avisando: en modo aviso el guion sale
          #     0 y lo que encontró se ve acá como AVISO de la corrida, con la cuenta y nada más (el archivo, la línea y
          #     la forma quedan en el registro de este paso: un aviso de esta validación no interpola texto). Cuando el
          #     control frene (scripts/publishing/internal-history.json → mode), sale distinto de 0 y suma a FALLAS.
          #     El guion escribe SIEMPRE su línea de cuentas (`internal-history: findings=… cannot_look=… mode=…`): si
          #     no está, o dice que no pudo mirar o que está apagado, se avisa — un paso verde sin cuentas no es «limpio».
          echo "▸ historia interna en la prosa que se publica (--range base del cambio...HEAD)…"
          IH_OUT="$(node scripts/publishing/internal-history.js --range "$(baseDelCambio)...HEAD")"; RC=$?
          IH_LINE="$(printf '%s\n' "$IH_OUT" | grep '^internal-history: ' | tail -1)"
          N="$(printf '%s\n' "$IH_LINE" | sed -n 's/^internal-history: findings=\([0-9][0-9]*\) .*/\1/p')"
          TOTAL="$(printf '%s\n' "$IH_LINE" | sed -n 's/.* warnings=\([0-9][0-9]*\).*/\1/p')"
          if [ "$RC" != 0 ]; then
            falla "$([ "$RC" = 1 ] && echo 'el cambio agrega historia interna a la prosa que se publica (arriba dice dónde y cómo salir)' || echo 'historia interna: no pude mirar (motivo arriba): no medido no es verde')"
          elif [ -z "$IH_LINE" ]; then
            echo "##vso[task.logissue type=warning]historia interna: el control terminó sin su línea de cuentas; este cambio NO consta como mirado"
          else
            case "$IH_LINE" in
              *' cannot_look=1 '*) echo "##vso[task.logissue type=warning]historia interna: el control está en modo aviso y NO PUDO MIRAR este cambio (el motivo, en el registro del paso)" ;;
              *' mode=off'*) echo "##vso[task.logissue type=warning]historia interna: el control está APAGADO en esta validación; este cambio no se miró" ;;
            esac
            if [ "${N:-0}" != 0 ]; then
              echo "##vso[task.logissue type=warning]historia interna: el cambio agrega $N forma(s) a la prosa que se publica; el control está en modo aviso y no frena (archivo y línea, en el registro del paso)"
            fi
            if [ "${TOTAL:-0}" != 0 ]; then
              echo "##vso[task.logissue type=warning]historia interna: el cambio agrega $TOTAL forma(s) de las que sólo avisan (archivo y línea, en el registro del paso)"
            fi
          fi

          # 8. Nada ajeno sin declarar (story 8.5): una skill de internet copiada al árbol sin declararla en el
          #    manifiesto de terceros. Es el otro control de la parte de las skills del pre-commit, y como allá corre
          #    sólo si el cambio toca skills/, agents/, .agents/ o .claude/, o si trae un enlace simbólico. Mira lo
          #    versionado del checkout, sin red y en milisegundos. Un git que falla no se lee como «no trae enlaces»:
          #    con el diff en error el control corre igual.
          RAW_DIFF="$(git diff --raw --no-renames "$(baseDelCambio)...HEAD" 2>&1)" || RAW_DIFF=':? 120000 (git diff falló)'
          if toco '^(skills/|agents/|\.agents/|\.claude/)' || printf '%s\n' "$RAW_DIFF" | awk '$2 == "120000" { found = 1 } END { exit !found }'; then
            echo "▸ skills de terceros sin declarar…"
            node scripts/publishing/third-party-coverage.js --repo "$(Build.SourcesDirectory)" --skip-content; RC=$?
            [ "$RC" = 0 ] || falla "$([ "$RC" = 1 ] && echo 'hay algo ajeno sin declarar en el manifiesto de skills de terceros (arriba dice qué)' || echo 'skills de terceros: no pude mirar (motivo arriba): no medido no es verde')"
          fi

          echo "———"
          [ "$FALLAS" = 0 ] && echo "✅ lint: sin hallazgos" || { echo "❌ lint: $FALLAS control(es) en rojo"; exit 1; }
        displayName: 'Controles de lint (siempre)'

      # ── Qué suites corren, y en qué trabajo (sólo si el cambio trae código) ────────────────────────────────
      # 🔴 2026-10-02: qué suites corren (scripts/ci/suites-for-change.js). Las que declaran
      # `gate_only_when_touching` (la copia pública de verdad, ~14 min; las skills de terceros, ~2 min)
      # corren acá sólo si el cambio toca su carpeta o la suite misma; el banco nocturno las corre
      # siempre. El cambio es la lista del paso «Qué trae este cambio» (la rama entera contra su destino).
      # 🔴 Story 8.22 (AC 4): si ese paso dejó todo=si —corrida de main, sin origin/main, diff que falló o la validación
      # completa pedida a mano— corren TODAS, con su motivo. Antes una corrida que no era pull request caía al último
      # commit de la rama: elegía por un solo commit y fallaba hacia menos. Ese camino ya no existe.
      # 🔴 Story 8.22 (AC 7-9, decisión del dueño 2026-10-05: la validación en 15 min): `--deps` — una suite sin criterio
      # propio corre sólo si el cambio toca algo de lo que usa su código (scripts/ci/suite-deps.js); las demás, el
      # nocturno. Se elige con la lista de CÓDIGO (los .md no eligen), salvo la pesada que declara `reads_md`, que mira la
      # lista entera. La red es la foto nocturna de origin/main: si no es completa y de las últimas 36 h, --deps no
      # saltea nada. Un cambio en cómo se elige (el selector, el lector de dependencias, este pipeline) corre todo.
      # 🔴 2026-10-04: la lista se arma UNA vez, acá, y viaja como artefacto a los trabajos de suites y al veredicto: si
      # cada trabajo la armara por su cuenta, dos trabajos podrían repartir listas distintas. El reparto se hace sobre
      # las que CORREN (`--only`): sobre la lista entera, la copia pública —casi siempre salteada— se quedaba un trabajo.
      # 🔴 2026-10-04 (decisión del dueño): las dos más largas —la copia pública de verdad, ~24 min, y la máquina limpia,
      # ~7— corren SÓLO si el cambio toca lo que miden. El criterio vive en scripts/ci/heavy-suites.json (`--heavy`) y,
      # para esas dos, manda sobre su `gate_only_when_touching`. Sin lista de cambios corren las dos. Las que no corren
      # van a skip.txt, y el veredicto las nombra: «no corrió: el cambio no toca lo que mide» (ni verdes ni rojas).
      - script: |
          set -uo pipefail
          # La raíz `agent-skills` de suites.json la da la regla de scripts/lib/skills-dir.js, la misma función
          # que usan los demás lectores (story 8.18): la variable, si está; si no, el propio checkout cuando trae
          # las skills adentro; si no, lo instalado. Una raíz que no existe NO se saltea: el guion sale 1 con el
          # motivo, y acá eso es «no se midieron», rojo.
          SK="$(node scripts/lib/skills-dir.js --skills)" || { echo "##vso[task.logissue type=error]suites: no hay carpeta de skills de la que correr las suites de raíz agent-skills (motivo arriba) — NO se midieron"; exit 1; }
          echo "suites: la raíz agent-skills es $SK"
          OUT="$(Build.ArtifactStagingDirectory)/suites-plan"; mkdir -p "$OUT"
          CAMB="$(Agent.TempDirectory)/cambiados.txt"; LISTA_CODIGO_SUITES="$(Agent.TempDirectory)/cambiados-codigo.txt"; CAMB_ARG=()
          if [ "$(todoElRepo)" = no ] && [ -f "$CAMB" ] && [ -f "$LISTA_CODIGO_SUITES" ]; then
            CAMB_ARG=(--changed "$LISTA_CODIGO_SUITES" --changed-with-docs "$CAMB" --deps)
            echo "suites: el cambio es la rama entera ($(grep -c . "$LISTA_CODIGO_SUITES") archivo(s) de código, $(grep -c . "$CAMB") en total)"
            # La red de --deps: la última foto del banco nocturno, la que trajo «La foto nocturna y lo privado de la
            # validación» (story 8.26, tanda C, AC 43: la misma que usa el veredicto; la de la rama puede ser vieja, y en el
            # repo público no existe). Sin ella, --deps no saltea nada (suites-for-change.js lo dice).
            FOTO="$(Agent.TempDirectory)/snapshot/nightly-suites.json"
            if [ -s "$FOTO" ]; then
              CAMB_ARG+=(--nightly "$FOTO")
            else
              echo "##vso[task.logissue type=warning]suites: no pude leer la foto nocturna (no la trajo «La foto nocturna y lo privado de la validación») — --deps no saltea nada"
            fi
          elif [ "$(todoElRepo)" = no ]; then
            echo "##vso[task.logissue type=warning]suites: falta la lista del cambio de «Qué trae este cambio» — corren todas"
          else
            echo "suites: corren todas — ${MOTIVOTODO:-sin motivo anotado}"
          fi
          PLAN="$(Agent.TempDirectory)/suites-plan.txt"
          # `${CAMB_ARG[@]+…}`: con la lista vacía y `set -u`, el bash 3.2 de una Mac corta el paso (las pruebas lo corren ahí).
          if ! node scripts/ci/suites-for-change.js --suites "$(Build.SourcesDirectory)/scripts/tests/suites.json" \
               --scripts "$(Build.SourcesDirectory)/scripts" --skills "$SK" ${CAMB_ARG[@]+"${CAMB_ARG[@]}"} \
               --heavy "$(Build.SourcesDirectory)/scripts/ci/heavy-suites.json" \
               --over-limit "$(Build.SourcesDirectory)/scripts/ci/suites-over-limit.json" > "$PLAN"; then
            echo "##vso[task.logissue type=error]suites: no pude armar la lista de suites — NO se midieron"
            exit 1
          fi
          # un plan sin ninguna suite que correr es «no se midió», nunca un verde con 0 corridas
          if ! grep -q '^RUN' "$PLAN"; then
            echo "##vso[task.logissue type=error]suites: la lista de suites salió vacía — NO se midieron"
            exit 1
          fi
          grep '^SKIP' "$PLAN" | cut -f2- | while IFS=$'\t' read -r NOMBRE MOTIVO; do echo "⏭ $NOMBRE — $MOTIVO"; done
          grep '^RUN' "$PLAN" | cut -f2- > "$OUT/run.txt"
          { grep '^SKIP' "$PLAN" || true; } | cut -f2- > "$OUT/skip.txt"
          # Cuántos trabajos (story 8.22, tramo C): los que pide el peso de lo que corre, hasta el máximo del parámetro.
          # `SUITES_JOB_BUDGET` fija a mano lo que entra en un trabajo, como SUITES_JOBS los núcleos. Si no se puede
          # calcular, el máximo, y se dice: nunca menos trabajos por no saber.
          if JOBS_NEEDED="$(node scripts/ci/suites-shard.js jobs --max "${{ parameters.suiteShards }}" --only "$OUT/run.txt" --weight-set pr --exclusive-apart --scripts "$(Build.SourcesDirectory)/scripts" \
                 ${SUITES_JOB_BUDGET:+--budget "$SUITES_JOB_BUDGET"} 2>"$(Agent.TempDirectory)/jobs.err")"; then
            cat "$(Agent.TempDirectory)/jobs.err"
          else
            # El máximo posible: el del parámetro, pero nunca más trabajos que suites (el reparto no arma uno vacío, y
            # pedirlo dejaba la corrida entera sin medir).
            # 🔴 «Suites» son las que se REPARTEN (story 8.22, tramo I): las que corren solas van al trabajo del banco y
            # no cuentan. Contándolas, 1 común y 1 exclusiva pedían 2 trabajos, el reparto se negaba y la validación
            # entera quedaba roja sin medir (pase adversarial, 2026-10-08). Si todas corren solas, igual va UN trabajo
            # de suites, que termina sin correr ninguna. Sin poder separarlas, la cuenta de todas, como antes.
            JOBS_NEEDED="${{ parameters.suiteShards }}"; RUNNING=$(grep -c . "$OUT/run.txt"); APART=""
            if node scripts/ci/suites-exclusive.js "$(Build.SourcesDirectory)/scripts/tests/suites.json" "$OUT/run.txt" \
                 "$(Agent.TempDirectory)/jobs-shared.txt" "$(Agent.TempDirectory)/jobs-apart.txt" 2>"$(Agent.TempDirectory)/jobs-split.err"; then
              RUNNING=$(grep -c . "$(Agent.TempDirectory)/jobs-shared.txt")
              ALONE=$(grep -c . "$(Agent.TempDirectory)/jobs-apart.txt")
              [ "$ALONE" -gt 0 ] && APART=" · $ALONE corren solas, en el trabajo del banco"
            else
              # su motivo va aparte: pegado al del cálculo se perdía detrás del corte a 200 caracteres
              APART=" · no pude separar las que corren solas: cuento todas"
              SPLIT_WHY="$(tr '\n' ' ' < "$(Agent.TempDirectory)/jobs-split.err" | sed 's/ *$//' | cut -c1-160)"
            fi
            [ "$RUNNING" -lt "$JOBS_NEEDED" ] && JOBS_NEEDED="$RUNNING"
            [ "$JOBS_NEEDED" -lt 1 ] && JOBS_NEEDED=1
            # el aviso con cuentas y texto fijo (story 8.26, tanda C, AC 45); los motivos, en la línea de abajo
            echo "##vso[task.logissue type=warning]suites: no pude calcular cuántos trabajos hacen falta — uso el máximo, $JOBS_NEEDED (hay $RUNNING suite(s))$APART"
            echo "   el cálculo: $(tr '\n' ' ' < "$(Agent.TempDirectory)/jobs.err" | cut -c1-200 | sed 's/#/♯/g')${SPLIT_WHY:+ · separar las que corren solas: $(printf '%s' "$SPLIT_WHY" | sed 's/#/♯/g')}"
          fi
          # La matriz del job Suites ES la salida: la cuenta de cada paso (acá, cada trabajo y el veredicto) sale de ella.
          if ! MATRIX="$(node scripts/ci/suites-shard.js matrix --of "$JOBS_NEEDED")" || ! OF="$(node scripts/ci/suites-shard.js of --matrix "$MATRIX")"; then
            echo "##vso[task.logissue type=error]suites: no pude armar la matriz de $JOBS_NEEDED trabajo(s) — NO se midieron"
            exit 1
          fi
          echo "suites: $(grep -c . "$OUT/run.txt") corren, repartidas en $OF trabajo(s) · $(grep -c . "$OUT/skip.txt") quedan para el nocturno"
          # El reparto se calcula ya, acá: si no se puede (una suite que suites.json no tiene, más trabajos que suites),
          # se sabe ahora y no en cada trabajo. Con los pesos medidos en ESTA validación (`--weight-set pr`, story 8.22), no
          # con los del nocturno; los tres llamados a suites-shard.js (acá, cada trabajo y el veredicto) piden el mismo juego.
          # 🔴 Las que corren solas no entran en este reparto (story 8.22, tramo I): las corre el trabajo del banco,
          # después del banco. `--exclusive-apart` va en los cuatro llamados (acá dos, cada trabajo y el veredicto).
          if ! node scripts/ci/suites-shard.js plan --of "$OF" --only "$OUT/run.txt" --weight-set pr --exclusive-apart --scripts "$(Build.SourcesDirectory)/scripts"; then
            echo "##vso[task.logissue type=error]suites: no pude repartir la lista en $OF trabajo(s) — NO se midieron"
            exit 1
          fi
          echo "##vso[task.setvariable variable=matrix;isOutput=true]$MATRIX"
          # La cuenta sola, para el trabajo del banco: él no es una pata de la matriz y la necesita para pedir su lista.
          echo "##vso[task.setvariable variable=of;isOutput=true]$OF"
        displayName: 'Qué suites corren'
        condition: and(succeeded(), eq(variables['hayCodigo'], 'si'))
        name: suites

      # El nombre lleva el INTENTO: un artefacto no se puede pisar, y un job reintentado desde Azure publica otro. Los
      # que la bajan leen la del intento más alto.
      - publish: '$(Build.ArtifactStagingDirectory)/suites-plan'
        artifact: 'suites-plan-a$(System.JobAttempt)'
        displayName: 'Publicar la lista de suites del cambio'
        condition: and(succeeded(), eq(variables['hayCodigo'], 'si'))

      - script: |
          echo "▸ el cambio no toca código del arnés: corrieron sólo los controles de lint."
          echo "  El banco y las 114 suites los corre el nocturno sobre main, esta misma noche."
        displayName: 'Sin código: el banco y las suites no corren'
        condition: and(succeeded(), ne(variables['hayCodigo'], 'si'))

  # ── El banco de controles, en su propio trabajo (sólo si el cambio trae código) ──────────────────────────
  - job: Bench
    displayName: 'Banco de controles sobre el cambio'
    dependsOn: Validar
    condition: and(succeeded(), eq(dependencies.Validar.outputs['change.hayCodigo'], 'si'))
    # 🔴 20 → 40 (story 8.22, tramo I): este trabajo corre el banco (~5 min) y, después, las suites que corren solas
    # (la copia pública de verdad, ~6,5 min, y cinco livianas). Antes las corría sola, al final, un trabajo de suites,
    # y este carril quedaba ocioso desde el minuto 5. El número es el peor caso con todo colgado: 10 min del tope del
    # banco (su paso, abajo) más la suma de los topes de las suites que corren solas (scripts/ci/run-capped.js). Lo
    # normal son ~17. Si igual lo cortan, lo que no publicó es NO MEDIDO en el veredicto, nunca verde.
    # La cuenta de hoy (2026-10-11), con siete suites corriendo solas: 10 + 29,6 = 39,6 min. Entra porque las dos que
    # casi no tardan en la validación (clean-machine, 3 s; instinct-executor, 1 s) tienen tope propio de 60 s en vez del
    # piso de 180 (`suite_cap.per_suite` del juego `pr`, scripts/ci/suites-weights.json; decisión del dueño). Sin eso
    # daba 43,6. 🔴 Este número NO se sube: ninguna corrida pasa de 40 minutos. Si una suite más pasa a correr sola y la
    # cuenta deja de entrar, la prueba T48 de scripts/tests/pr-suites-shards.test.js se pone roja con la cuenta escrita.
    timeoutInMinutes: 40
    # Qué trabajo de suites es éste para los pasos de la plantilla: el del banco, con la cuenta que publicó Validar.
    variables:
      SUITES_SHARD: bench
      SUITES_OF: $[ dependencies.Validar.outputs['suites.of'] ]
    steps:
      - checkout: self
        fetchDepth: 0            # story 8.18: la plantilla de abajo enlaza AgentSkills a ESTE checkout y lo quiere entero
        persistCredentials: true # como el trabajo de suites: las que corren solas corren acá sobre el mismo clon (tramo I)

      - task: UseNode@1
        inputs:
          version: '20.x'

      # La foto nocturna y la lista de productos que trajo Validar (story 8.26, tanda C, AC 43): las suites que corren
      # solas en este trabajo usan la misma foto que el veredicto.
      - template: /pipelines/templates/fetch-snapshot.yml
        parameters:
          step: download

      # El banco no lee los repos de los productos (el nocturno lo corre igual, sin ellos), pero las suites que este
      # trabajo corre después sí pueden: trae lo mismo que trae el trabajo de suites, para que una suite no dé otro
      # resultado según en qué trabajo le tocó (story 8.22, tramo I). La lista, la que trajo Validar: en el árbol público
      # no está (story 8.26, tanda C).
      - template: /pipelines/templates/traer-repos.yml
        parameters:
          agentSkills: true
          productos: true
          productRegistry: '$(Agent.TempDirectory)/snapshot/product-repos.json'

      - script: |
          set -uo pipefail
          cd "$(Build.SourcesDirectory)"
          mkdir -p "$(Build.ArtifactStagingDirectory)/bench"
          REP="$(Build.ArtifactStagingDirectory)/bench/banco.json"
          # `--tool both`: los casos con la forma de evento de CADA herramienta. No hace falta tener
          # Codex instalado: el runner sólo cambia la forma del payload.
          # 🔴 `pipefail` no es decorativo: sin él el exit sería el de `tee` (siempre 0).
          # 🔴 Con tope propio (story 8.22, tramo I): después de este paso corren las suites que corren solas. Un banco
          # colgado que llegara al tope del TRABAJO haría que Azure cancele todo lo que sigue, y esas suites no
          # correrían. Cortado acá, el paso sale rojo («NO se midió»), el trabajo sigue y el veredicto dice las dos
          # cosas. 600 s: el banco tarda ~3 min en el agente. Un reporte que haya dejado antes del corte no vale.
          CAP="${BENCH_CAP_SECONDS:-600}"
          case "$CAP" in ''|0|*[!0-9]*)
            echo "##vso[task.logissue type=warning]banco: BENCH_CAP_SECONDS no es un número de segundos («$CAP») — uso 600"
            CAP=600 ;;
          esac
          MARK="$(Agent.TempDirectory)/banco.capped"; rm -f "$MARK"
          node scripts/ci/run-capped.js --seconds "$CAP" --mark "$MARK" -- node scripts/controls-bench/runner.js --tool both --baseline check --json "$REP" | tee "$(Agent.TempDirectory)/banco-salida.txt"
          CODIGO=${PIPESTATUS[0]}
          if [ -f "$MARK" ]; then
            rm -f "$REP"
            echo "##vso[task.logissue type=error]El banco pasó su tope de $CAP s y se cortó: NO se midió. Las suites de este trabajo corren igual."
            exit 1
          fi
          if [ ! -f "$REP" ]; then
            echo "##vso[task.logissue type=error]El runner no dejó reporte: el banco NO se midió (código $CODIGO)"
            exit 1
          fi
          # Mismo contrato que el nocturno: este paso sale 0 aunque haya rojos. Quién frena y quién
          # avisa lo decide el veredicto, comparando contra la foto nocturna.
          echo "banco medido (código del runner: $CODIGO) — el veredicto lo da el job final"
        displayName: 'Banco de controles (--tool both)'

      - publish: '$(Build.ArtifactStagingDirectory)/bench'
        artifact: 'bench-a$(System.JobAttempt)'
        displayName: 'Publicar el reporte del banco'
        condition: always()

      # Las suites que corren solas, en este carril (story 8.22, tramo I). Corren aunque el banco haya salido rojo o no
      # haya dejado reporte: de eso se ocupa el veredicto, y un banco roto no puede dejar suites sin medir.
      - template: /pipelines/templates/correr-suites.yml
        parameters:
          condicion: succeededOrFailed()

  # ── Las suites de prueba del arnés, en trabajos paralelos (sólo si el cambio trae código) ────────────────
  # Cada trabajo baja la lista que armó `Validar`, le pide SU parte a scripts/ci/suites-shard.js (reparto por peso,
  # siempre el mismo con la misma lista; la unión es la lista entera y ninguna suite corre dos veces) y la corre con el
  # lazo de siempre: cada roja se reintenta UNA vez. Ninguno da el veredicto: cada uno publica lo que midió
  # (`suites-shard-<i>-a<intento>`) y el job Verdict lo junta. Cuántos trabajos: la matriz que publicó `Validar`
  # (`suites.matrix`), con el parámetro `suiteShards` de máximo; cada pata trae su número y la cuenta (SUITES_OF).
  - job: Suites
    displayName: 'Las suites de prueba del arnés'
    dependsOn: Validar
    condition: and(succeeded(), eq(dependencies.Validar.outputs['change.hayCodigo'], 'si'))
    strategy:
      matrix: $[ dependencies.Validar.outputs['suites.matrix'] ]
    # La historia del tope. Del job único: 30 → 45 (2026-09-30, la 11387 se cortó en el minuto 30 con las 165 suites ya
    # terminadas), 45 → 60 (2026-10-02, la 11572 y la 11573: 188 suites en serie, ~35 min). Ese día las dos más lentas
    # pasaron a correr sólo si el cambio toca su carpeta (scripts/ci/suites-for-change.js). 2026-10-04: con rojos y
    # reintentos ni 60 alcanzaba (11761, 11788). Ese día, 45 POR TRABAJO: con la copia pública salteada cada uno rondaba
    # los 15 min; si el cambio la corría (~24 min en el nocturno), el trabajo que la llevaba quedaba cerca de los 30.
    # 45 → 40 (2026-10-08, cierre de la story 8.22; lo decidió el dueño del arnés con lo medido a la vista). La copia
    # pública de verdad ya no corre acá: corre en el trabajo del banco, y cada suite tiene su tope propio. El trabajo de
    # suites más largo medido dura 26,0 min con un cambio de un archivo (el del instalador, #12490) y 31,4 en una
    # validación que corre casi todo (#12481). Con 40, el más lento de un archivo tiene su margen entero («lo medido más
    # la mitad» da 39) y una que corre todo, ~9 min; un trabajo colgado cuesta 5 min menos de carril. Si una validación
    # sana se corta en el minuto 40, este número se revisa con esa corrida a la vista: no se sube a ojo.
    # Lo fija scripts/tests/pr-suites-shards.test.js (T33 y el caso de los topes).
    timeoutInMinutes: 40
    steps:
      - checkout: self
        fetchDepth: 0            # las suites corren sobre el mismo clon que antes, con su historia
        persistCredentials: true

      - task: UseNode@1
        inputs:
          version: '20.x'

      # La foto nocturna (la de las rojas que no se reintentan) y la lista de productos: las que trajo Validar.
      - template: /pipelines/templates/fetch-snapshot.yml
        parameters:
          step: download

      - template: /pipelines/templates/traer-repos.yml
        parameters:
          agentSkills: true
          productos: true
          productRegistry: '$(Agent.TempDirectory)/snapshot/product-repos.json'

      # Bajar la lista del cambio, correr las suites de este trabajo y publicar lo que midió. Los mismos pasos corre el
      # trabajo del banco con las suites que corren solas (story 8.22, tramo I): viven en una plantilla para que no se
      # separen. Qué trabajo es lo dicen SUITES_SHARD y SUITES_OF, que acá vienen de la matriz.
      - template: /pipelines/templates/correr-suites.yml

  # ── El veredicto, con lo de todos los trabajos (sólo si el cambio trae código) ───────────────────────────
  # 🔴 Corre aunque el banco o un trabajo de suites hayan fallado o los haya cortado el tope: un trabajo cortado no dice
  # nada, y éste es el que dice qué se midió y qué no. Las suites de un trabajo que no terminó entran como NO MEDIDAS
  # (scripts/ci/suites-shard.js merge) y el veredicto las nombra: ni verdes ni «rojo nuevo» (scripts/ci/pr-verdict.js).
  - job: Verdict
    displayName: 'Veredicto del cambio'
    dependsOn: [Validar, Bench, Suites]
    condition: and(always(), eq(dependencies.Validar.outputs['change.hayCodigo'], 'si'))
    timeoutInMinutes: 10
    # La matriz que publicó `Validar` (story 8.22, tramo C): de ella sale el --of con que se juntan los trabajos. Se lee
    # como variable de entorno, no como macro: el JSON trae comillas y una macro las pegaría crudas en el guion.
    variables:
      SUITES_MATRIX: $[ dependencies.Validar.outputs['suites.matrix'] ]
    steps:
      - checkout: self
        fetchDepth: 0            # story 8.18: con un solo repo, todo checkout del arnés trae la historia entera

      - task: UseNode@1
        inputs:
          version: '20.x'

      # La foto nocturna contra la que se da el veredicto: la que trajo Validar (story 8.26, tanda C, AC 43).
      - template: /pipelines/templates/fetch-snapshot.yml
        parameters:
          step: download

      # Sin nombre de artefacto baja todos los de la corrida, cada uno en su carpeta. Si un trabajo no publicó nada, acá
      # no hay nada que bajar de él: lo cuenta el paso que sigue.
      - task: DownloadPipelineArtifact@2
        displayName: 'Bajar lo que publicó cada trabajo'
        continueOnError: true
        inputs:
          buildType: 'current'
          targetPath: '$(Pipeline.Workspace)/artifacts'

      - script: |
          set -uo pipefail
          ART="$(Pipeline.Workspace)/artifacts"
          FORCE_RED=0
          # 🔴 «No lo pude bajar» no es «no publicó»: lo que falte cuenta como NO MEDIDO (merge no le cree a una carpeta a
          # medias), y además este paso sale rojo.
          if [ "${AGENT_JOBSTATUS:-Succeeded}" != "Succeeded" ]; then
            echo "##vso[task.logissue type=error]Bajar lo que publicó cada trabajo tuvo problemas (estado del job: ${AGENT_JOBSTATUS}): lo que no llegó cuenta como NO MEDIDO, nunca como verde"
            FORCE_RED=1
          fi
          # El banco: el reporte del último intento del job Bench.
          BENCH_DIR="$(ls -d "$ART"/bench-a*/ 2>/dev/null | sort -V | tail -1)"
          if [ -n "$BENCH_DIR" ] && [ -f "${BENCH_DIR}banco.json" ]; then
            cp "${BENCH_DIR}banco.json" "$(Agent.TempDirectory)/banco.json"
          else
            echo "##vso[task.logissue type=error]El job del banco no dejó su reporte: el banco NO se midió"
            FORCE_RED=1
          fi
          PLAN_DIR="$(ls -d "$ART"/suites-plan-a*/ 2>/dev/null | sort -V | tail -1)"
          if [ -z "$PLAN_DIR" ] || [ ! -s "${PLAN_DIR}run.txt" ]; then
            echo "##vso[task.logissue type=error]No está la lista de suites del cambio: las suites NO se midieron"
            exit 1
          fi
          # Cuántos trabajos armó Validar: sin la matriz no se sabe qué reparto esperar — no se junta con un número inventado.
          if ! OF="$(node scripts/ci/suites-shard.js of --matrix "${SUITES_MATRIX:-}")"; then
            echo "##vso[task.logissue type=error]No pude leer cuántos trabajos de suites armó Validar (la matriz suites.matrix): las suites NO se midieron"
            exit 1
          fi
          MERGED="$(Agent.TempDirectory)/suites-merged"
          # Con las que corren solas aparte (story 8.22, tramo I): se junta también lo que publicó el trabajo del banco
          # (suites-shard-bench-a*), con las mismas exigencias; si no publicó, sus suites son NO MEDIDAS.
          node scripts/ci/suites-shard.js merge --of "$OF" --only "${PLAN_DIR}run.txt" --weight-set pr --exclusive-apart \
            --artifacts "$ART" --out "$MERGED" --scripts "$(Build.SourcesDirectory)/scripts"
          CODIGO=$?
          if [ "$CODIGO" != "0" ] || [ ! -f "$MERGED/ran.txt" ] || [ ! -f "$MERGED/failures.txt" ]; then
            echo "##vso[task.logissue type=error]No se pudo juntar lo que midió cada trabajo de suites (código $CODIGO): las suites NO se midieron"
            exit 1
          fi
          N=$(grep -c . "$MERGED/ran.txt")
          FALLAS=""
          while IFS= read -r F; do FALLAS="$FALLAS $F"; done < "$MERGED/failures.txt"
          # El mismo reporte que arma el nocturno (con el motivo saneado de cada roja), a un archivo
          # temporal: este pipeline no escribe en el repo.
          # Contra la foto nocturna que trajo Validar (story 8.26, tanda C, AC 43), unidos por el mapa de renombres (story
          # 8.9, tanda C3): una suite que el cambio deja sin correr sale avisada; una renombrada, no.
          # «No viaja» (story 8.26, tanda C, AC 11): una suite de la foto que no está en el registro de la rama ni en el de
          # main es del repo de mantenimiento (con el público como propio): no es «desaparecida». Hacen falta LOS DOS: con
          # sólo el de la rama, una suite que el cambio borró no estaría en ningún registro y se disfrazaría de «no viaja»
          # (revisor de fallos silenciosos). Sin el de main no se pasa ninguno: nada se da por «no viaja», y lo que falte
          # sale desaparecido, como antes.
          REG=()
          BASE_REGISTRY="$(Agent.TempDirectory)/base-suites.json"
          if (cd "$(Build.SourcesDirectory)" && git show origin/main:scripts/tests/suites.json) > "$BASE_REGISTRY" 2>"$(Agent.TempDirectory)/base-suites.err"; then
            REG=(--registry "$(Build.SourcesDirectory)/scripts/tests/suites.json" --registry "$BASE_REGISTRY")
          else
            echo "no pude leer el registro de suites de origin/main: ninguna suite se da por «no viaja» (las de la foto que no corrieron salen desaparecidas) — $(tr '\n' ' ' < "$(Agent.TempDirectory)/base-suites.err" | cut -c1-160 | sed 's/#/♯/g')"
          fi
          # Con un repo de GitHub como propio los avisos de Azure llevan texto fijo y cuentas (AC 45): el control es público.
          PUBLIC=(); [ "${BUILD_REPOSITORY_PROVIDER:-}" = GitHub ] && PUBLIC=(--public-notices)
          if ! node scripts/ci/suites-report.js ${PUBLIC[@]+"${PUBLIC[@]}"} --rep "$(Agent.TempDirectory)/suites.json" --build "$(Build.BuildId)" --runs "$N" \
                 --failures "$FALLAS" --detail "$MERGED/red-output" --retries "$MERGED/retries.json" \
                 --ran "$MERGED/ran.txt" --previous "$(Agent.TempDirectory)/snapshot/nightly-suites.json" ${REG[@]+"${REG[@]}"} \
                 --not-run "${PLAN_DIR}skip.txt"; then
            echo "##vso[task.logissue type=error]suites-report.js no pudo armar el reporte de suites: NO se midieron"
            exit 1
          fi
          echo "suites: $N corridas · $(grep -c . "$MERGED/failures.txt") en rojo, ausentes o sin medir — el veredicto lo da el paso que sigue"
          exit "$FORCE_RED"
        displayName: 'Juntar lo que midió cada trabajo'

      # ── El veredicto ────────────────────────────────────────────────────────────────────────
      # `succeededOrFailed()` a propósito: si el banco o las suites no pudieron medir, el paso de arriba (o su
      # job) ya salió rojo y la corrida va a quedar roja igual; pero el veredicto se da con lo que sí se midió.
      - script: |
          set -uo pipefail
          A=(); [ -f "$(Agent.TempDirectory)/suites.json" ] && A+=(--suites-actual "$(Agent.TempDirectory)/suites.json")
          [ -f "$(Agent.TempDirectory)/banco.json" ] && A+=(--current-bench "$(Agent.TempDirectory)/banco.json")
          # La foto, la que trajo Validar y bajó este trabajo (story 8.26, tanda C, AC 43): se pasa SIEMPRE, aunque no
          # haya llegado. Sin ella el veredicto sale «no pude decidir: sin foto»; nunca cae a la del árbol que valida.
          A+=(--suites-snapshot "$(Agent.TempDirectory)/snapshot/nightly-suites.json" --bench-snapshot "$(Agent.TempDirectory)/snapshot/nightly-bench.json")
          # 🔴 El modo aviso: desde la Etapa 3 (2026-09-17) un rojo nuevo de SUITE avisa y sólo el banco frena. Desde la
          # story 8.26 (tanda C, AC 14; decisión 10 del dueño) lo decide el interruptor de la definición,
          # HARNESS_SUITES_BLOCK (scripts/ci/suites-block.js): sin él, aviso con el interno de Azure como propio (la
          # 170) y freno con un repo de GitHub (el público). Lo que sigue frenando siempre es el banco y el minuto de
          # lint, que corre en el job Validar.
          WARN=()
          BLOCK="$(node scripts/ci/suites-block.js)" || BLOCK=on
          if [ "$BLOCK" = off ]; then
            WARN=(--suites-warn)
            echo "##vso[task.logissue type=warning]suites en modo aviso por interruptor: un rojo nuevo de suite avisa y no frena (HARNESS_SUITES_BLOCK de la definición)"
          fi
          PUBLIC=(); [ "${BUILD_REPOSITORY_PROVIDER:-}" = GitHub ] && PUBLIC=(--public-notices)
          node scripts/ci/pr-verdict.js ${A[@]+"${A[@]}"} ${WARN[@]+"${WARN[@]}"} ${PUBLIC[@]+"${PUBLIC[@]}"} --ado; RC=$?
          if [ "$RC" = 2 ]; then
            echo "##vso[task.logissue type=error]No se pudo dar el veredicto: no medido no es verde"
          fi
          exit "$RC"
        displayName: 'Veredicto: ¿algún rojo NUEVO?'
        condition: succeededOrFailed()
