# Entrar a Google Cloud para el actualizador del sitio (update-site.js --platform cloudrun), desde el nocturno de GitHub
# (pipelines/operations/github/site-update.yml). Workload Identity Federation: sin llave de cuenta de servicio guardada.
# La cuenta tiene un rol propio sobre el servicio del sitio (run.services.get y run.services.update) y
# iam.serviceAccounts.actAs sobre la cuenta con la que corre el sitio, y nada más (guides/integrations/gcs-mailbox.md).
name: Entrar a Google Cloud (el sitio al día)
description: Workload Identity Federation y la herramienta de Google Cloud, para poner al día el sitio en Cloud Run.
inputs:
  workload_identity_provider:
    description: projects/<número>/locations/global/workloadIdentityPools/<pool>/providers/<proveedor>
    required: true
  service_account:
    description: la cuenta de servicio del actualizador
    required: true
runs:
  using: composite
  steps:
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
